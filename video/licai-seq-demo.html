<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李财逐帧动画测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b2621;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100vw;max-height:100vh;aspect-ratio:16/9;object-fit:contain;cursor:pointer}
  body.render canvas{width:1920px;height:1080px;max-height:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="snowkit.js"></script>
<script src="licai-assets.js"></script>
<script src="licai-emo.js"></script>
<script src="licai-seq.js"></script>
<script src="licaikit.js"></script>
<script src="licai-move.js"></script>
<script>
/* 李财逐帧动画测试（26 秒）：探头 / 笑开 / 跑步 / 正面骑车 / 滑雪 / 摔跟头 */
(() => {
'use strict';
const SRC = document.currentScript.textContent;
const T = [0, 4, 8, 12.5, 17, 21.5, 26];
const S = [];
const GY = 900;

// ① 探头：从桌边慢慢冒出来
S.push(lt => {
  seqDraw('探头', lt - .3, 4, 960, 760, 520, { once: true });
  g.fillStyle = '#E9D3B0'; g.fillRect(260, 760, 1400, 260); hrect(260, 760, 1400, 260, 5, C.brown, 6);
  hline(260, 760, 1660, 762, 8, C.brown, 8);
  header(lt - .2, '① {o}探头{/}', '8 张连续画面，一张张播 = 真正的动作');
});
// ② 慢慢笑开
S.push(lt => {
  seqDraw('笑开', lt - .3, 3.5, 960, 860, 700, { once: true });
  g.fillStyle = '#E9D3B0'; g.fillRect(300, 805, 1320, 280); hline(300, 805, 1620, 807, 9, C.brown, 8);
  header(lt - .2, '② {r}慢慢笑开{/}', '表情一点点变化，比直接换图自然');
});
// ③ 跑步循环
S.push(lt => {
  scrollGround(GY, lt * 520);
  const x = lt < 3.4 ? lerp(-200, 900, eout(lt / 1.6)) : 900 + (lt - 3.4) ** 2 * 900;
  seqDraw('跑步', lt, 12, x, GY + 6, 360);
  for (let d = 0; d < 4; d++) { const age = ((lt * 3) % 1 + d) / 3; dustPuff(x - 180 - age * 300, GY - 6, age, d + Math.floor(lt * 3), .7); }
  header(lt - .2, '③ {g}跑起来{/}', '8 帧跑步循环，腿真的在迈');
});
// ④ 正面骑车：迎面骑过来
S.push(lt => {
  g.save(); g.strokeStyle = C.gray; g.lineWidth = 5;
  for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(960 + k * 40, 420); g.lineTo(960 + k * 420, 1080); g.stroke(); }
  g.restore();
  for (let k = 0; k < 5; k++) { const q = ((lt * .8 + k / 5) % 1), y = 440 + q * q * 640; hline(960 - 8 - q * 30, y, 960 + 8 + q * 30, y, 300 + k, C.ink, 4 + q * 8); }
  const h = lerp(520, 820, sm(lt / 4.5));
  seqDraw('正面骑车', lt, 10, 960, 1010, h);
  header(lt - .2, '④ {b}迎面骑过来{/}', '正面骑车循环，身体左右晃、尾巴在甩');
});
// ⑤ 滑雪
S.push(lt => {
  g.save(); g.fillStyle = '#EAF3FA'; g.beginPath(); g.moveTo(0, 620); g.lineTo(W, 980); g.lineTo(W, H); g.lineTo(0, H); g.fill(); g.restore();
  hline(0, 620, W, 980, 77, C.blue, 6);
  const q = clamp(lt / 4.5, 0, 1), x = lerp(-150, 2100, q), y = 620 + (x / W) * 360;
  for (let k = 0; k < 10; k++) { const a = (lt * 2 + k / 10) % 1; hcircle(x - 160 - a * 260 + jit(k, 20), y - a * 60 + jit(k + 9, 20), 8 + a * 10, 8 + a * 10, k, '#B9D3E8', 3); }
  seqDraw('滑雪板', lt, 9, x, y + 10, 420, { rot: Math.atan2(360, W) });
  header(lt - .2, '⑤ {b}滑起来{/}', '滑雪板动作，第 5 帧会跳起来');
});
// ⑥ 摔跟头
S.push(lt => {
  hline(0, GY, W, GY + 2, 52, C.ink, 5);
  const i = seqDraw('摔跟头', lt - .3, 8, 760 + clamp((lt - .3) * 8, 0, 7) * 50, GY + 10, 780, { once: true });
  if (lt > 1.4) { sparks(1340, GY - 330, 40, clamp((lt - 1.4) / .2, 0, 1), 4); typeText('{r}哎呀！{/}', 1300, 420, 110, lt - 1.5, { cps: 8 }); }
  if (lt > 2.6) stamp('逐帧测试', 1560, 760, 64, lt - 2.6);
  header(lt - .2, '⑥ {r}摔个跟头{/}', '翻滚、落地，一气呵成');
});

function sound(K, c, DUR, T) {
  const s = licaiSound(K, DUR);
  T.slice(1, -1).forEach(t => s.whoosh(t - .05));
  s.pop(4 + 1.8); s.ding(4 + 2.4);
  for (let k = 0; k < 13; k++) K.tone(300, 8 + k / 3, .05, .03, 'sine');
  s.bell(12.5 + 1);
  s.whoosh(17 + .5); s.grow(17 + 1.6, .4);
  K.thud(21.5 + 1.2, .5); s.wrong(21.5 + 1.4); s.stamp(21.5 + 2.6);
}
function coverArt(key, w, h) {
  paper(); const s = Math.min(w, h) / 1080;
  seqDraw('跑步', 0, 1, w / 2, h * .8, h * .4, { frame: 3 });
  txt('李财逐帧动画', w / 2, 140 * s, 100 * s, C.orange, { align: 'center' });
}
licaiRun({ T, S, seed: 78, allText: SRC.replace(/[\x00-\x7f]/g, ''), audio: sound, cover: coverArt });
})();
</script>
</body>
</html>
