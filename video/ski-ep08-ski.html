<script>
/*
 * 滑雪不难 EP.08 双板《腿为什么这么累：学会用腿吸收》（约 2 分 05 秒）
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 29.6, 46.0, 62.0, 74.0, 94.0, 112.0, 119.0, 125.5];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '滑两趟，\n腿就{r}酸到发抖{/}？', y: YH, size: 84, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '问题可能不在体力，\n在你{a}怎么用腿{/}。', y: YH, size: 80, w: 900 },
  { in: 8.25, out: 11.35, text: '腿为什么这么累：\n学会用腿吸收', y: .3, size: 96, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '会用腿，才能滑一整天', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 17.4, text: '累的原因一：\n一直{r}蹲死{/}不动', y: YH, size: 80, w: 900 },
  { in: 12.6, out: 17.4, text: '肌肉一直绷着，没有一秒放松，最容易酸。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 17.8, out: 23.4, text: '累的原因二：\n{r}靠在鞋后帮上{/}', y: YH, size: 80, w: 900 },
  { in: 18.6, out: 23.4, text: '往后坐，大腿前侧一直在"刹车"，\n板头还压不住。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 23.8, out: 29.4, text: '累的原因三：\n全身{r}绷紧{/}', y: YH, size: 80, w: 900 },
  { in: 24.6, out: 29.4, text: '一紧张就浑身用力，力气全花在"僵着"上。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 29.8, out: 37.6, text: '腿是{g}弹簧{/}：\n有起有伏。', y: YH, size: 84, w: 900 },
  { in: 30.6, out: 37.6, text: '站高、蹲低来回换，肌肉有紧有松，\n比一直蹲着省力得多。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 38.0, out: 45.8, text: '{a}三个关节{/}一起弯', y: YH, size: 84, w: 900 },
  { in: 38.8, out: 45.8, text: '脚踝、膝盖、髋一起弯，\n小腿轻轻贴住鞋舌，不是只弯腰。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 46.2, out: 53.8, text: '遇到起伏：\n腿{g}收起来{/}吸收。', y: YH, size: 84, w: 900 },
  { in: 47.0, out: 53.8, text: '鼓包顶上来，腿就收；\n过了鼓包，腿再伸出去。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 54.2, out: 61.8, text: '上身和头，\n高度{g}基本不变{/}。', y: YH, size: 84, w: 900 },
  { in: 55.0, out: 61.8, text: '板贴着雪走，人不会被弹起来。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 62.2, out: 67.8, text: '转弯也一样：\n{a}起{/}来换刃，{g}蹲{/}下压住。', y: YH, size: 80, w: 900 },
  { in: 63.0, out: 67.8, text: '连续转弯的节奏，靠的就是这根弹簧。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 68.2, out: 73.8, text: '腿酸到发抖，\n就{g}停下歇一会儿{/}。', y: YH, size: 80, w: 900 },
  { in: 69.0, out: 73.8, text: '累到控制不住还硬撑，最容易受伤。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 74.2, out: 76.4, text: '怎么练？\n三步。', y: YH, size: 80, w: 900 },
  { in: 76.7, out: 82.8, text: '① 原地弹簧', y: YH, size: 84, w: 900 },
  { in: 77.4, out: 82.8, text: '平地上站好，脚踝、膝盖、髋一起弯，\n慢慢起、慢慢蹲，做 10 次。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 83.2, out: 88.8, text: '② 缓坡直滑时起伏', y: YH, size: 80, w: 900 },
  { in: 83.9, out: 88.8, text: '一边滑一边起伏，重心始终在脚掌中间。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 89.2, out: 93.8, text: '③ 找小鼓包练吸收', y: YH, size: 80, w: 900 },
  { in: 89.9, out: 93.8, text: '目标：头的高度不跟着地形上下跑。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 94.2, out: 99.8, text: '常见错误一：\n只弯腰，{r}不弯腿{/}', y: YH, size: 80, w: 900 },
  { in: 95.0, out: 99.8, text: '屁股撅出去，小腿离开鞋舌，重量跑到脚后跟。', y: YB, size: 40, w: 500, sub: 1 },
  { in: 100.2, out: 105.8, text: '常见错误二：\n起得太猛，{r}蹦起来{/}', y: YH, size: 76, w: 900 },
  { in: 101.0, out: 105.8, text: '起伏要慢慢来，板始终贴着雪。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 106.2, out: 111.8, text: '常见错误三：\n腿{r}伸直{/}过鼓包', y: YH, size: 80, w: 900 },
  { in: 107.0, out: 111.8, text: '人被弹起来，落地就容易失去平衡。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 119.2, out: 999, text: '你滑一天，\n腿能撑几趟？', y: .37, size: 88, w: 900, st: .06 },
  { in: 120.2, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const STEPS = ['① 原地弹簧', '② 直滑起伏', '③ 过小鼓包'];

/* ───────── 侧面姿势 ───────── */
const SQ = { shin: 34, thigh: -68, torso: 42, head: 20, uarm: 138, farm: 92, pole: 205 };   // 蹲低
const UP = { shin: 14, thigh: -16, torso: 18, head: 10, uarm: 150, farm: 100, pole: 202 };  // 站高（仍然微屈）
const STRAIGHT = { shin: 4, thigh: -4, torso: 6, head: 6, uarm: 165, farm: 140, pole: 195 };
const WAIST = { shin: 6, thigh: -14, torso: 72, head: 44, uarm: 128, farm: 92, pole: 210 };
const springPose = v => lerpPose(SQ, UP, v); // 0 = 蹲低，1 = 站高

function muscleBar(x, y, w, level, txt) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.92)'; g.shadowColor = 'rgba(27,40,56,.1)'; g.shadowBlur = 16; rrect(x - 20, y - 60, w + 40, 110, 22); g.fill(); g.shadowBlur = 0;
  label(txt || '大腿负担', x, y - 28, 28, COL.sub, 700, 'left');
  g.fillStyle = '#e6edf3'; rrect(x, y, w, 26, 13); g.fill();
  const c = level > .7 ? COL.red : level > .45 ? COL.amber : COL.green; g.fillStyle = c; rrect(x, y, Math.max(26, w * level), 26, 13); g.fill();
  g.restore();
}
function thighHeat(J, a) { const m = mid(J.K, J.Hp); glow(m[0], m[1], .6 * J.u, '240,71,60', a); }
function spring(x, y0, y1, a) {
  g.save(); g.globalAlpha = a; g.strokeStyle = COL.green; g.lineWidth = 6; g.lineJoin = 'round'; g.beginPath(); const n = 8;
  for (let i = 0; i <= n * 2; i++) { const yy = lerp(y0, y1, i / (n * 2)), xx = x + (i === 0 || i === n * 2 ? 0 : (i % 2 ? 26 : -26)); i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
  g.stroke(); g.fillStyle = COL.green; rrect(x - 34, y0 - 8, 68, 10, 4); g.fill(); rrect(x - 34, y1 - 2, 68, 10, 4); g.fill(); g.restore();
}

/* ───────── 起伏地形 ───────── */
const SPD = 260, WL = 560, AMP = 64, TH0 = 6;
const bump = xw => AMP * Math.pow(.5 - .5 * Math.cos(2 * Math.PI * xw / WL), 1.3);
const surfY = (x, sc, base) => base + (x - CX) * Math.tan(TH0 * D2R) - bump(x + sc);
function terrain(sc, base) {
  g.save(); const gr = g.createLinearGradient(0, base - 200, 0, H); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#dde8f2'); g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, surfY(x, sc, base)); g.lineTo(W, H); g.closePath(); g.fill();
  g.strokeStyle = '#c3d4e4'; g.lineWidth = 4; g.beginPath(); for (let x = 0; x <= W; x += 8) { const y = surfY(x, sc, base); x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore();
}
const headRel = (th, pose, u) => { const J = joints([0, 0], th, pose, u); return -J.Hd[1]; };
function bumpState(t, mode, base, u) {
  const sc = t * SPD, y = surfY(CX, sc, base), th = Math.atan2(surfY(CX + 6, sc, base) - surfY(CX - 6, sc, base), 12) / D2R, b = bump(CX + sc);
  let F = [CX, y], p;
  if (mode === 'absorb') {
    const h0 = headRel(th, SQ, u), h1 = headRel(th, UP, u), target = h1 - .08 * (h1 - h0) - b;
    p = springPose(clamp((target - h0) / (h1 - h0), 0, 1));
  } else { p = STRAIGHT; const ph = ((CX + sc) / WL) % 1, hop = 46 * Math.pow(Math.max(0, Math.sin((ph - .5) * 2 * Math.PI)), 2); F = [CX, y - hop]; }
  return { F, th, p, sc, y };
}
function bumpScene(t, mode, base, u, trailOn) {
  const st = bumpState(t, mode, base, u);
  terrain(st.sc, base);
  if (trailOn) {
    g.save(); g.strokeStyle = mode === 'absorb' ? COL.green : COL.red; g.lineWidth = 6; g.setLineDash([4, 10]); g.lineCap = 'round'; g.beginPath();
    for (let i = 0; i <= 60; i++) { const tt = t - i * .04; if (tt < 0) break; const s2 = bumpState(tt, mode, base, u), J = joints(s2.F, s2.th, s2.p, u), x = CX - (st.sc - s2.sc); i ? g.lineTo(x, J.Hd[1]) : g.moveTo(x, J.Hd[1]); }
    g.stroke(); g.restore();
  }
  if (mode === 'stiff' && st.F[1] < st.y - 6) { g.save(); g.fillStyle = 'rgba(40,60,80,.12)'; g.beginPath(); g.ellipse(CX, st.y, 1.6 * u, 12, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  return drawSkier(st.F, st.th, st.p, u);
}

/* ───────── 背面小人（转弯节奏），同 EP.04 ───────── */
function backV(F, p, u) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const seg = (a, b, w, c) => { g.strokeStyle = c; g.lineWidth = w * u; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const poly = (pts, c) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = c; g.fill(); };
  const boots = [-1, 1].map(sd => [F[0] + sd * p.stance * u, F[1]]);
  boots.forEach(b => { const tip = [b[0], F[1] - 1.0 * u], tail = [b[0], F[1] + .9 * u]; poly([[tip[0] - .06 * u, tip[1]], [tip[0] + .06 * u, tip[1]], [tail[0] + .11 * u, tail[1]], [tail[0] - .11 * u, tail[1]]], COL.ski); });
  const hipC = [F[0] + p.sway * u, F[1] - p.hipH * u], hips = [[hipC[0] - .18 * u, hipC[1]], [hipC[0] + .18 * u, hipC[1]]];
  const knees = boots.map((b, i) => { const a = [b[0], b[1] - .4 * u], m = mid(a, hips[i]); return [m[0] + p.knee * u, m[1]]; });
  const S = [hipC[0], hipC[1] - 1.1 * u], sh = [[S[0] - .28 * u, S[1]], [S[0] + .28 * u, S[1]]];
  const hands = sh.map((q, i) => [q[0] + (i ? 1 : -1) * .42 * u, q[1] + .8 * u]);
  hands.forEach((h, i) => seg(h, [h[0] + (i ? 1 : -1) * .3 * u, F[1] + .3 * u], .04, '#8a9bb0'));
  boots.forEach((b, i) => { const a = [b[0], b[1] - .4 * u]; seg(a, knees[i], .26, COL.pants); seg(knees[i], hips[i], .3, COL.pants); poly([[b[0] - .15 * u, b[1] + .02 * u], [b[0] + .15 * u, b[1] + .02 * u], [b[0] + .13 * u, b[1] - .45 * u], [b[0] - .13 * u, b[1] - .45 * u]], COL.boot); });
  seg(hips[0], hips[1], .34, COL.pants);
  seg(hipC, S, .6, COL.jacket2); seg(sh[0], sh[1], .32, COL.jacket2);
  sh.forEach((q, i) => { const e = [q[0] + (i ? 1 : -1) * .3 * u, q[1] + .45 * u]; seg(q, e, .17, COL.jacket2); seg(e, hands[i], .15, COL.jacket2); g.fillStyle = COL.pants; g.beginPath(); g.arc(hands[i][0], hands[i][1], .1 * u, 0, Math.PI * 2); g.fill(); });
  const Hd = [S[0], S[1] - .4 * u];
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = .05 * u; g.beginPath(); g.arc(Hd[0], Hd[1], .22 * u, 0, Math.PI * 2); g.fill(); g.stroke();
  g.strokeStyle = COL.amber; g.lineWidth = .07 * u; g.beginPath(); g.moveTo(Hd[0] - .21 * u, Hd[1] + .02 * u); g.lineTo(Hd[0] + .21 * u, Hd[1] + .02 * u); g.stroke();
  g.restore();
}
function snowBack(scrollY) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#dfeaf4'); gr.addColorStop(.35, '#f1f6fa'); gr.addColorStop(1, '#ffffff'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { const x = 60 + i * 125 + (i % 2) * 30, y = H * .3 + (i % 3) * 18; g.fillStyle = '#c9d8e5'; for (let j = 0; j < 3; j++) { const w = 36 - j * 9, yy = y - j * 26; g.beginPath(); g.moveTo(x, yy - 42); g.lineTo(x - w, yy); g.lineTo(x + w, yy); g.closePath(); g.fill(); } }
  g.strokeStyle = '#e0e9f1'; g.lineWidth = 5; for (let i = 0; i < 26; i++) { const x = (i * 197) % W, y = H * .36 + (((i * 131) + scrollY) % (H * .6)); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40, y); g.stroke(); }
}
function heightGraph(x, y, w, h, ph) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.92)'; g.shadowColor = 'rgba(27,40,56,.1)'; g.shadowBlur = 20; rrect(x - 20, y - h / 2 - 50, w + 40, h + 100, 24); g.fill(); g.shadowBlur = 0;
  g.strokeStyle = COL.amber; g.lineWidth = 6; g.beginPath();
  for (let i = 0; i <= 120; i++) { const t = i / 120, p = ph - Math.PI * 2 + t * Math.PI * 4, v = Math.cos(2 * p) * .5 + .5; const xx = x + t * w, yy = y + h / 2 - v * h; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();
  const v = Math.cos(2 * ph) * .5 + .5; g.fillStyle = COL.ink; g.beginPath(); g.arc(x + w / 2, y + h / 2 - v * h, 12, 0, Math.PI * 2); g.fill();
  label('站高', x - 4, y - h / 2 - 24, 26, COL.sub, 700, 'left'); label('蹲低', x - 4, y + h / 2 + 24, 26, COL.sub, 700, 'left');
  g.restore();
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子
S.push(lt => {
  const th = 10, F = [CX - 30, H * .6]; drawSky(0); drawSnowfall(lt, .4); drawSlope(F, th, lt * 200, { noProps: true }); speedLines(F, th, lt, .3);
  const shake = clamp((lt - 1) / 2.5, 0, 1), J = drawSkier([F[0] + Math.sin(lt * 60) * 3 * shake, F[1]], th, SQ, 170);
  thighHeat(J, .3 + .6 * shake);
  muscleBar(W * .14, H * .665, W * .72, lerp(.35, .98, shake));
  if (lt > 4.2) { g.save(); g.globalAlpha = sm((lt - 4.2) / .4); label('?', J.Hd[0] + 130, J.Hd[1] - 60, 90, COL.amber, 900); g.restore(); }
});
// B 标题
S.push(lt => {
  drawSky(0); g.fillStyle = 'rgba(247,250,252,.5)'; g.fillRect(0, 0, W, H);
  pill('滑雪不难 · EP.08 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  bumpScene(lt, 'absorb', H * .78, 120, false);
});
// C 三个原因
S.push(lt => {
  const seg = lt < 6.2 ? 0 : lt < 12.2 ? 1 : 2, l2 = lt - [0, 6.2, 12.2][seg];
  const th = 10, F = [CX - 30, H * .6]; drawSky(0); drawSlope(F, th, lt * 200, { noProps: true });
  let J, load;
  if (seg === 0) { J = drawSkier(F, th, SQ, 170); load = lerp(.4, .95, sm(l2 / 4)); thighHeat(J, load * .8); label('一直这么低', J.Hd[0] + 240, J.Hd[1] + 20, 36, COL.red, 900); }
  else if (seg === 1) { J = drawSkier(F, th, lerpPose(POSES.neutral, POSES.back, sm((l2 - .3) / .8)), 170); load = lerp(.45, .9, sm((l2 - .3) / 1.2)); const a = win(l2, .8, 6, .3, .3); const m = mid(J.K, J.Hp); ring(m[0], m[1], 70, COL.red, a, true); const bk = J.P(-.25, .55); ring(bk[0], bk[1], 50, COL.red, a, true); g.save(); g.globalAlpha = a; label('靠在鞋后帮上', bk[0] - 170, bk[1] + 110, 34, COL.red, 900); g.restore(); }
  else { J = drawSkier([F[0] + Math.sin(lt * 50) * 3, F[1]], th, POSES.tense, 170); load = lerp(.5, .92, sm(l2 / 3)); g.save(); [J.Hd, J.S, J.Hn, J.K, J.Hp].forEach((q, i) => ring(q[0], q[1], 30 + 8 * Math.sin(lt * 9 + i), COL.red, .6)); g.restore(); label('浑身用力', J.Hd[0] + 240, J.Hd[1] + 20, 36, COL.red, 900); }
  muscleBar(W * .14, H * .665, W * .72, load);
  markX(W * .14, H * .3, 40, win(l2, .3, 6, .2, .3));
});
// D 弹簧 + 三个关节
S.push(lt => {
  const th = 10, F = [CX + 20, H * .6]; drawSky(0); drawSnowfall(lt + 30, .4); drawSlope(F, th, lt * 160, { noProps: true });
  if (lt < 8.2) {
    const v = .5 - .5 * Math.cos(Math.max(0, lt - .6) * 1.6), J = drawSkier(F, th, springPose(v), 170);
    spring(W * .12, J.Hp[1], F[1] - 10, 1);
    muscleBar(W * .14, H * .665, W * .72, .35 + .15 * (1 - v), '大腿负担：有紧有松');
    label(v > .5 ? '站高 · 放松' : '蹲低 · 用力', J.Hd[0] + 230, J.Hd[1] - 10, 36, v > .5 ? COL.green : COL.amber, 900);
  } else {
    const l2 = lt - 8.2, v = .5 - .5 * Math.cos(Math.max(0, l2) * 1.2), J = drawSkier(F, th, springPose(.2 + .3 * v), 170);
    [[J.A, '脚踝', .3], [J.K, '膝盖', 1.3], [J.Hp, '髋', 2.3]].forEach(([q, t, d], i) => {
      const a = sm((l2 - d) / .4); ring(q[0], q[1], 40, COL.amber, a); g.save(); g.globalAlpha = a; label(t, q[0] + 230, q[1] - (i - 1) * 30, 40, COL.amber, 900); g.setLineDash([8, 8]); g.strokeStyle = COL.amber; g.lineWidth = 3; g.beginPath(); g.moveTo(q[0] + 44, q[1]); g.lineTo(q[0] + 170, q[1] - (i - 1) * 30); g.stroke(); g.restore();
    });
    const a = sm((l2 - 3.6) / .4), sh = mid(J.A, J.K); g.save(); g.globalAlpha = a; label('小腿贴住鞋舌', sh[0] - 250, sh[1] - 70, 34, COL.green, 900); g.restore();
  }
});
// E 吸收鼓包
S.push(lt => {

});
// F 转弯节奏（背面）/ 歇一会儿
S.push(lt => {

    muscleBar(W * .14, H * .665, W * .72, lerp(.9, .25, sm((l2 - .3) / 4)));
  }
});
// G 练习三步
S.push(lt => {
  const cur = lt < 2.4 ? -1 : lt < 9 ? 0 : lt < 15 ? 1 : lt < 19.8 ? 2 : 3;
  drawSky(0);
  if (cur <= 0) {
    const th = 0, F = [CX - 40, H * .6]; drawSlope(F, th, 0, { noProps: true });
    const tt = Math.max(0, lt - 2.6), v = .5 + .5 * Math.cos(tt * Math.PI / 1.24), J = drawSkier(F, th, springPose(v), 170);
    label(`${Math.min(10, Math.floor(tt / 2.48))} / 10`, W * .8, H * .32, 60, COL.green, 900);
    spring(W * .12, J.Hp[1], F[1] - 10, 1);
  } else if (cur === 1) {
    const th = 10, F = [CX - 30, H * .6], l2 = lt - 9; drawSlope(F, th, lt * 220, { noProps: true }); speedLines(F, th, lt, .3);
    const v = .5 + .5 * Math.cos(l2 * 1.6), J = drawSkier(F, th, springPose(v), 165);
    const c = J.P(.1, 0); g.save(); g.setLineDash([10, 8]); g.strokeStyle = COL.green; g.lineWidth = 4; g.beginPath(); g.moveTo(J.com[0], J.com[1]); g.lineTo(c[0], c[1]); g.stroke(); g.setLineDash([]); g.fillStyle = COL.green; g.beginPath(); g.arc(J.com[0], J.com[1], 14, 0, Math.PI * 2); g.fill(); g.restore();

// H 三个错误
S.push(lt => {
  const seg = lt < 6 ? 0 : lt < 12 ? 1 : 2, l2 = lt - seg * 6;

    const th = 10, F = [CX - 30, H * .6]; drawSlope(F, th, lt * 180, { noProps: true });
    const ph = (l2 % 2.2) / 2.2, hop = 90 * Math.max(0, Math.sin(Math.min(1, Math.max(0, ph - .25) / .35) * Math.PI)), up = ph < .3 ? sm(ph / .3) : 1 - sm((ph - .6) / .4);

// I 口诀卡
S.push(lt => {

    const ra = eout((lt - .8 - i * 1.2) / .35); if (ra <= 0) return; const ry = y + 250 + i * 225;
    g.save(); g.globalAlpha = a * ra; g.translate((1 - ra) * 40, 0); pill(t1, x + 70 + (t1.length * 38 + 52) / 2, ry - 44, 38, c, '#fff'); label(t2, x + 70, ry + 42, 50, COL.ink, 900, 'left'); g.restore();

S.push(lt => {

/* ───────── 封面 ───────── */
function coverArt(key, w, h) {
  drawSky(0);
  const art = (base, u, cx) => {
    const sc = 1.05 * SPD, y = k => base + (k - cx) * Math.tan(TH0 * D2R) - bump(k - cx + CX + sc);
    g.save(); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 8) g.lineTo(x, y(x)); g.lineTo(w, h); g.closePath(); g.fill();
    g.strokeStyle = '#c3d4e4'; g.lineWidth = 4; g.beginPath(); for (let x = 0; x <= w; x += 8) { x ? g.lineTo(x, y(x)) : g.moveTo(x, y(x)); } g.stroke(); g.restore();
    const F = [cx, y(cx)], th = Math.atan2(y(cx + 6) - y(cx - 6), 12) / D2R, J = drawSkier(F, th, springPose(.2), u);
    spring(cx - 2.2 * u, J.Hp[1], F[1] - 10, 1);
  };

    pill('滑雪不难 · EP.08 · 双板', cx, pillY, pillSize, COL.amber, '#fff');
    label('腿为什么这么累？', cx, y1, size, COL.ink, 900);
    g.font = `900 ${size * .62}px ${SANS}`; const parts = [['把腿当', COL.ink], ['弹簧', COL.green], ['用', COL.ink]], ws = parts.map(q => g.measureText(q[0]).width);
    let x = cx - ws.reduce((s, v) => s + v, 0) / 2; parts.forEach((q, i) => { label(q[0], x + ws[i] / 2, y2, size * .62, q[1], 900); x += ws[i]; });
    label('原因 · 起伏 · 吸收 · 三个错误', cx, subY, subSize, COL.sub, 700);
  };
  if (key === '9x16') { art(h * .8, 180, w * .56); title(CX, h * .24, h * .315, 112, h * .37, 40, h * .15, 42); }
  else if (key === '3x4') { art(h * .86, 145, w * .56); title(CX, h * .17, h * .265, 106, h * .325, 38, h * .07, 40); }
  else {
    art(h * .82, key === '16x9' ? 150 : 120, key === '16x9' ? w * .74 : w * .72);
    const fade = g.createLinearGradient(0, 0, w * .62, 0); fade.addColorStop(0, 'rgba(240,246,251,.96)'); fade.addColorStop(1, 'rgba(240,246,251,0)'); g.fillStyle = fade; g.fillRect(0, 0, w * .56, h);
    const size = key === '16x9' ? 108 : 86;

/* ───────── 声音 ───────── */
function sound(K, c, DUR) {
  K.bed(8.0, DUR, t => t < 29.6 ? 'verse' : t < 46 ? 'chorus' : t < 62 ? 'verse' : t < 94 ? 'chorus' : t < 112 ? 'tense' : 'outro');

  K.wrong(3.6); [11.6 + .3, 11.6 + 6.5, 11.6 + 12.5].forEach(K.wrong);
  [29.6 + 1.2, 29.6 + 8.6, 29.6 + 9.9, 29.6 + 10.9, 29.6 + 12.2, 46 + 8.5, 62 + 6.9, 74 + 14.4].forEach(K.ding);
  [[46, 62, 0], [74 + 15, 74 + 19.8, 1]].forEach(([a, b, off]) => { for (let t = a; t < b; t += .02) { const s1 = (t - a + off) * SPD, s0 = s1 - .02 * SPD, ph1 = ((CX + s1) / WL) % 1, ph0 = ((CX + s0) / WL) % 1; if (ph0 < .5 && ph1 >= .5) K.tone(330, t, .18, .05, 'sine'); } });
  for (let i = 1; i <= 2; i++) K.ding(74 + 2.6 + i * 2.48);
  [94 + .3, 100 + .3, 106 + .3].forEach(K.wrong);
  for (let t = 100 + .6 * 2.2; t < 106; t += 2.2) K.thud(t, .35);
  for (let i = 0; i < 3; i++) K.tone(880 + i * 110, 112 + .8 + i * 1.2, .25, .07, 'triangle');

}
