<script>
/*
 * 滑雪不难 EP.07 双板《搓雪还是刻滑：双板的两种痕迹》（约 2 分 05 秒）
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 28.0, 44.0, 60.0, 74.0, 94.0, 112.0, 119.0, 125.5];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '滑完回头看看：\n雪上留下了什么？', y: YH, size: 80, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '一大片{a}刮痕{/}，\n还是{g}两条细线{/}？', y: YH, size: 84, w: 900 },
  { in: 8.25, out: 11.35, text: '搓雪还是刻滑：\n双板的两种痕迹', y: .3, size: 100, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '看痕迹，就知道你是怎么转的', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 19.8, text: '{a}搓雪{/}：板横着\n往下蹭。', y: YH, size: 84, w: 900 },
  { in: 12.6, out: 19.8, text: '板头指的方向，和你走的方向不一样。\n板刃刮着雪往外推，留下宽宽一片。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 20.2, out: 27.8, text: '搓雪不是错，\n它是{g}控速{/}的本事。', y: YH, size: 80, w: 900 },
  { in: 21.0, out: 27.8, text: '窄道、陡坡、人多的时候，\n都靠它把速度稳住。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 28.2, out: 35.8, text: '{g}刻滑{/}：两块板立在刃上，\n切出{g}两条线{/}。', y: YH, size: 76, w: 900 },
  { in: 29.0, out: 35.8, text: '像两条铁轨：板尾跟着板头，\n走在同一条线上。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 36.2, out: 43.8, text: '速度{a}留得住{/}，\n弯也更干净。', y: YH, size: 80, w: 900 },
  { in: 37.0, out: 43.8, text: '刻滑不靠刮雪减速，\n所以要在宽、人少的雪道上练。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 44.2, out: 51.8, text: '差别在哪？\n板{a}立得够不够{/}。', y: YH, size: 80, w: 900 },
  { in: 45.0, out: 51.8, text: '板放得平，就容易横着滑开；\n立得够高，刃就咬进雪里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 52.2, out: 59.8, text: '还有：是{r}拧{/}，\n还是{g}立{/}？', y: YH, size: 80, w: 900 },
  { in: 53.0, out: 59.8, text: '搓雪多是把两块板拧过去；\n刻滑是把两块板一起立起来，让板自己转。', y: YB, size: 40, w: 500, sub: 1 },
  { in: 60.2, out: 67.8, text: '板为什么会自己转？\n板刃本来就是{g}一段弧线{/}。', y: YH, size: 76, w: 900 },
  { in: 61.0, out: 67.8, text: '板立起来、被压弯，\n就会顺着这条弧走，这就是刻滑的弯。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 68.2, out: 73.8, text: '立得越高，\n弯就{a}越小{/}。', y: YH, size: 84, w: 900 },
  { in: 69.0, out: 73.8, text: '板压得越弯，转弯半径越小。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 74.2, out: 76.4, text: '怎么练？\n三步。', y: YH, size: 80, w: 900 },
  { in: 76.7, out: 82.8, text: '① 先把搓雪练稳', y: YH, size: 80, w: 900 },
  { in: 77.4, out: 82.8, text: '能随时用搓雪把速度控住，\n才有底气去练刻滑。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 83.2, out: 88.8, text: '② 铁轨练习', y: YH, size: 84, w: 900 },
  { in: 83.9, out: 88.8, text: '缓坡上，脚踝和膝盖一起往一边倒，两块板同时立刃。\n回头看：是不是两条细线？', y: YB, size: 38, w: 500, sub: 1 },
  { in: 89.2, out: 93.8, text: '③ 转弯时少拧多立', y: YH, size: 80, w: 900 },
  { in: 89.9, out: 93.8, text: '让板自己转，痕迹会一点点变细。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 94.2, out: 99.8, text: '误区一：\n搓雪就是{r}不会滑{/}', y: YH, size: 80, w: 900 },
  { in: 95.0, out: 99.8, text: '不是。高手也搓雪，需要控速的时候它最好用。', y: YB, size: 40, w: 500, sub: 1 },
  { in: 100.2, out: 105.8, text: '错误二：\n上身{r}往弯里倒{/}', y: YH, size: 80, w: 900 },
  { in: 101.0, out: 105.8, text: '只靠倒身体去立刃，刃一滑就摔。\n用脚踝、膝盖去立刃，上身保持稳。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 106.2, out: 111.8, text: '错误三：一上来\n就在{r}陡坡{/}上练', y: YH, size: 80, w: 900 },
  { in: 107.0, out: 111.8, text: '刻滑会把速度留着。先在宽、缓、人少的雪道上练。', y: YB, size: 40, w: 500, sub: 1 },
  { in: 119.2, out: 999, text: '回头看看，\n你的痕迹是哪一种？', y: .37, size: 88, w: 900, st: .06 },
  { in: 120.2, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const STEPS = ['① 搓雪练稳', '② 铁轨练习', '③ 少拧多立'];
const SW = 44; // 两块板中心到人中心的距离（俯视，s=1）

/* ───────── 俯视：两块板沿局部 +x 方向 ───────── */
function topSkis(x, y, ang, s, o = {}) {
  g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.lineCap = 'round';
  [-1, 1].forEach(sd => {
    if (o.edge) { g.strokeStyle = o.edge; g.lineWidth = 30 * s; g.globalAlpha = .45; g.beginPath(); g.moveTo(-105 * s, sd * SW * s); g.lineTo(125 * s, sd * SW * s); g.stroke(); g.globalAlpha = 1; }
    g.strokeStyle = o.mono || COL.ski; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(-105 * s, sd * SW * s); g.lineTo(125 * s, sd * SW * s); g.stroke();
    g.fillStyle = COL.boot; rrect(-20 * s, sd * SW * s - 13 * s, 40 * s, 26 * s, 8 * s); g.fill();
  });
  // 雪杖（向后拖着一点）
  g.strokeStyle = '#7d8ea3'; g.lineWidth = 5 * s; [-1, 1].forEach(sd => { g.beginPath(); g.moveTo(30 * s, sd * 78 * s); g.lineTo(-90 * s, sd * 118 * s); g.stroke(); });
  g.fillStyle = o.mono || COL.jacket; g.beginPath(); g.ellipse(-4 * s, 0, 26 * s, 54 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(4 * s, 0, 17 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = COL.amber; g.beginPath(); g.arc(16 * s, 0, 6 * s, 0, Math.PI * 2); g.fill();
  g.restore();
}
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - (scroll || 0)) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}
const cPath = (cx, y0, y1, A, n) => k => { const ph = k * n * Math.PI, yy = ph / 2 - Math.sin(2 * ph) / 4, ymax = n * Math.PI / 2; return [cx + A * Math.sin(ph), lerp(y0, y1, yy / ymax)]; };
const heading = (f, k) => { const a = f(Math.max(0, k - .002)), b = f(Math.min(1, k + .002)); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
const turnSign = (f, k) => { let d = heading(f, Math.min(1, k + .01)) - heading(f, Math.max(0, k - .01)); d = Math.atan2(Math.sin(d), Math.cos(d)); return d >= 0 ? 1 : -1; };
const yawOf = (f, k, n, amt) => amt * Math.pow(Math.sin(((k * n) % 1) * Math.PI), .7) * turnSign(f, k);
function ghostPath(f, color) { g.save(); g.strokeStyle = color; g.lineWidth = 6; g.setLineDash([14, 12]); g.beginPath(); for (let i = 0; i <= 160; i++) { const p = f(i / 160); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke(); g.restore(); }
function skidTrack(f, k1, n, amt, s) {
  g.save();
  for (let i = 0; i <= 220; i++) {
    const kk = k1 * i / 220, p = f(kk), a = heading(f, kk) + yawOf(f, kk, n, typeof amt === 'function' ? amt(kk) : amt);
    g.translate(p[0], p[1]); g.rotate(a); g.fillStyle = 'rgba(150,172,192,.06)';
    [-1, 1].forEach(sd => g.fillRect(-100 * s, (sd * SW - 10) * s, 220 * s, 20 * s));
    g.fillStyle = 'rgba(150,172,192,.03)'; g.fillRect(-100 * s, -SW * s, 220 * s, SW * 2 * s);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  g.restore();
}
// 刻滑：两条平行的细线（铁轨）
function railTrack(f, k1, s, w) {
  [-1, 1].forEach(sd => {
    g.save(); g.lineCap = 'round'; g.beginPath();
    for (let i = 0; i <= 160; i++) { const kk = k1 * i / 160, p = f(kk), h = heading(f, kk), q = [p[0] - Math.sin(h) * sd * SW * s, p[1] + Math.cos(h) * sd * SW * s]; i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
    g.strokeStyle = 'rgba(96,118,140,.22)'; g.lineWidth = (w || 5) + 6; g.stroke(); g.strokeStyle = '#7d93a8'; g.lineWidth = w || 5; g.stroke(); g.restore();
  });
}
function sprayOut(p, ang, side, t, amt, s) {
  if (amt < .02) return; const nx = -Math.sin(ang) * side, ny = Math.cos(ang) * side;
  g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 16; i++) { const ph = (t * 1.6 + hash(i + 11)) % 1, along = (hash(i + 3) - .5) * 160 * s, d = (60 + ph * 110) * s;
    const x = p[0] + Math.cos(ang) * along + nx * d, y = p[1] + Math.sin(ang) * along + ny * d; g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(x, y, (6 + hash(i) * 8) * s, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}
function rideSkid(f, k, n, amt, s, t, o = {}) { const p = f(k), h = heading(f, k), y = yawOf(f, k, n, amt), sg = turnSign(f, k); sprayOut(p, h + y, -sg, t, Math.abs(y) / Math.max(amt, .01), s); topSkis(p[0], p[1], h + y, s, o); return { p, h, y }; }
function rideCarve(f, k, s, o = {}) { const p = f(k), h = heading(f, k); topSkis(p[0], p[1], h, s, o); return { p, h }; }

/* 横截面：从板头方向看两块板（加上小腿、大腿） */
function crossSkis(cx, sy, deg, slide, t, o = {}) {
  g.save(); g.fillStyle = '#ffffff'; g.fillRect(0, sy, W, H * .25); g.strokeStyle = '#c8d7e5'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, sy); g.lineTo(W, sy); g.stroke(); g.restore();
  const a = deg * D2R, bw = 110, bt = 22, gap = 230, groove = deg > 25 ? Math.min(26, (deg - 25) * 1.4) : 0;
  const knees = [];
  [-1, 1].forEach(sd => {
    const ex = cx + sd * gap / 2 + 50 + slide; // 接触的刃（右下角）
    if (groove) { g.fillStyle = '#e3ebf2'; g.beginPath(); g.moveTo(ex - 40, sy); g.lineTo(ex - 4, sy + groove); g.lineTo(ex + 4, sy); g.closePath(); g.fill(); }
    g.save(); g.translate(ex, sy + groove * .8); g.rotate(-a);
    g.fillStyle = COL.ski; rrect(-bw, -bt, bw, bt, 6); g.fill(); g.fillStyle = '#2a2f3a'; g.fillRect(-5, -bt, 5, bt);
    // 鞋 + 小腿（垂直于板面）
    g.fillStyle = COL.boot; rrect(-bw / 2 - 28, -bt - 60, 56, 60, 10); g.fill();
    const kn = [-bw / 2, -bt - 60 - 100]; g.strokeStyle = COL.pants; g.lineWidth = 34; g.lineCap = 'round'; g.beginPath(); g.moveTo(-bw / 2, -bt - 60); g.lineTo(kn[0], kn[1]); g.stroke();
    const m = g.getTransform(); knees.push([m.a * kn[0] + m.c * kn[1] + m.e, m.b * kn[0] + m.d * kn[1] + m.f]);
    g.restore();
  });
  // 大腿 → 髋，上身保持直立（o.leanIn：上身往里倒）
  const hip = [(knees[0][0] + knees[1][0]) / 2 + (o.leanIn ? -30 : 20), Math.min(knees[0][1], knees[1][1]) - 100];
  g.save(); g.lineCap = 'round'; g.strokeStyle = COL.pants; g.lineWidth = 38; knees.forEach(k => { g.beginPath(); g.moveTo(k[0], k[1]); g.lineTo(hip[0] + (k[0] < hip[0] ? -30 : 30), hip[1]); g.stroke(); });
  const tl = o.leanIn ? -deg * 1.1 * D2R : 0, S2 = [hip[0] + Math.sin(tl) * 170, hip[1] - Math.cos(tl) * 170];
  g.strokeStyle = COL.jacket; g.lineWidth = 96; g.beginPath(); g.moveTo(hip[0], hip[1] - 20); g.lineTo(S2[0], S2[1]); g.stroke();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 8; g.beginPath(); g.arc(S2[0] + Math.sin(tl) * 90, S2[1] - Math.cos(tl) * 90, 40, 0, Math.PI * 2); g.fill(); g.stroke();
  g.restore();
  const ex = cx + gap / 2 + 50 + slide;
  g.save(); g.strokeStyle = COL.amber; g.lineWidth = 5; g.beginPath(); g.arc(ex, sy, 90, Math.PI, Math.PI + a, false); g.stroke(); g.restore();
  label(`${Math.round(deg)}°`, ex + 70, sy - 40, 44, COL.amber, 900);
  if (slide !== 0) { g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; for (let i = 0; i < 10; i++) { const ph = (t * 2 + hash(i)) % 1; g.globalAlpha = 1 - ph; g.beginPath(); g.arc(ex + 20 + ph * 140, sy - 10 - ph * 50 - hash(i + 2) * 30, 6 + hash(i) * 6, 0, Math.PI * 2); g.fill(); g.stroke(); } g.restore(); }
  return { hip };
}

/* 侧切：一块雪板的俯视轮廓，刃是一段弧 */
function sidecut(cx, e, R, a) {
  const half = 360, cy = e + Math.sqrt(R * R - half * half), yb = x => cy - Math.sqrt(R * R - x * x), wd = x => 60 + 34 * Math.pow(x / half, 2);
  g.save(); g.globalAlpha = a;
  g.strokeStyle = 'rgba(18,166,121,.55)'; g.lineWidth = 6; g.setLineDash([16, 12]); g.beginPath(); g.arc(cx, cy, R, Math.PI * 1.02, Math.PI * 1.98); g.stroke(); g.setLineDash([]);
  g.fillStyle = COL.ski; g.beginPath();
  for (let i = 0; i <= 60; i++) { const x = -half + i / 60 * half * 2; g.lineTo(cx + x, yb(x) - wd(x)); }
  for (let i = 60; i >= 0; i--) { const x = -half + i / 60 * half * 2; g.lineTo(cx + x, yb(x)); }
  g.closePath(); g.fill();
  g.strokeStyle = COL.amber; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); for (let i = 0; i <= 60; i++) { const x = -half + i / 60 * half * 2; i ? g.lineTo(cx + x, yb(x)) : g.moveTo(cx + x, yb(x)); } g.stroke();
  g.fillStyle = COL.boot; rrect(cx - 60, yb(0) - wd(0) / 2 - 26, 120, 52, 10); g.fill();
  const ry0 = Math.min(cy, H * .69);
  g.strokeStyle = COL.green; g.lineWidth = 4; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(cx, yb(0) + 10); g.lineTo(cx, ry0); g.stroke(); g.setLineDash([]);
  if (cy < H * .69) { g.fillStyle = COL.green; g.beginPath(); g.arc(cx, cy, 10, 0, Math.PI * 2); g.fill(); }
  label('转弯半径', cx + 30, Math.min((yb(0) + ry0) / 2 + 40, H * .67), 34, COL.green, 900, 'left');
  g.restore();
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：两条痕迹
const fA1 = cPath(W * .28, H * .27, H * .7, 130, 3), fA2 = cPath(W * .72, H * .27, H * .7, 130, 3);
S.push(lt => {
  slopeTop(lt * 30);
  const k = clamp((lt - .3) / 7, 0, 1);
  skidTrack(fA1, k, 3, .7, .7); railTrack(fA2, k, .7, 4);
  rideSkid(fA1, k, 3, .7, .7, lt); rideCarve(fA2, k, .7);
  if (lt > 4.2) { const a = sm((lt - 4.2) / .4); g.save(); g.globalAlpha = a; label('刮痕', W * .28, H * .245, 44, COL.amber, 900); label('两条细线', W * .72, H * .245, 44, COL.green, 900); g.restore(); }
});
// B 标题
S.push(lt => {
  slopeTop(0); g.fillStyle = 'rgba(247,250,252,.6)'; g.fillRect(0, 0, W, H);
  pill('滑雪不难 · EP.07 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  const f = cPath(CX, H * .52, H * .84, 230, 2), k = clamp(lt / 3.4, 0, 1);
  railTrack(f, k, .9); rideCarve(f, k, .9);
});
// C 搓雪
const fC = cPath(CX, H * .25, H * .66, 260, 2);
S.push(lt => {
  slopeTop(lt * 30);
  const k = clamp((lt - .4) / 15, 0, 1);
  skidTrack(fC, k, 2, .75, 1.0);
  const r = rideSkid(fC, k, 2, .75, 1.0, lt);
  if (lt > 2 && lt < 8.5) {
    const a = win(lt, 2, 8.4, .4, .3); g.save(); g.globalAlpha = a;
    arrow(r.p[0], r.p[1], r.p[0] + Math.cos(r.h) * 220, r.p[1] + Math.sin(r.h) * 220, COL.green, 7, 24);
    g.setLineDash([10, 8]); g.strokeStyle = COL.amber; g.lineWidth = 5; g.beginPath(); g.moveTo(r.p[0] - Math.cos(r.h + r.y) * 170, r.p[1] - Math.sin(r.h + r.y) * 170); g.lineTo(r.p[0] + Math.cos(r.h + r.y) * 190, r.p[1] + Math.sin(r.h + r.y) * 190); g.stroke(); g.setLineDash([]);
    g.restore();
    g.save(); g.globalAlpha = a; pill('走的方向', W * .27, H * .67, 30, COL.green, '#fff'); pill('板指的方向', W * .73, H * .67, 30, COL.amber, '#fff'); g.restore();
  }
  if (lt > 8.6) { const a = sm((lt - 8.6) / .4), v = Math.round(lerp(22, 14, sm((lt - 9) / 4))); g.save(); g.globalAlpha = a; label(`${v} km/h`, W * .8, H * .24, 48, COL.green, 900); label('沙沙 · 把速度刮掉', W * .8, H * .275, 30, COL.sub, 700); g.restore(); }
});
// D 刻滑
S.push(lt => {
  slopeTop(lt * 30);
  const k = clamp((lt - .4) / 14, 0, 1);
  railTrack(fC, k, 1.0, 5);
  const r = rideCarve(fC, k, 1.0, { edge: lt > 2 && lt < 8 ? COL.green : null });
