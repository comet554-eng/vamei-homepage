<script>
/*
 * 滑雪不难 EP.02 双板版《摔倒也是一门技术》（约 2 分 10 秒）
 * 侧面小人（skirig.js）讲伤膝盖的后坐摔；正面小人（本页 frontSkier）讲侧身倒向山上一侧。
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 24.0, 33.0, 42.0, 72.0, 90.0, 104.0, 110.5, 117.0, 124.0, 130.5];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.9, text: '双板摔倒，\n最怕的是{r}硬撑{/}。', y: YH, size: 84, w: 900, st: .05 },
  { in: 4.1, out: 7.8, text: '你是不是也想伸手撑住、\n马上站起来？', y: YH, size: 76, w: 900 },
  { in: 8.25, out: 11.35, text: '摔倒\n也是一门技术', y: .3, size: 110, w: 900, st: .06 },
  { in: 9.0, out: 11.35, text: '双板新手的第一课', y: .415, size: 42, w: 500, sub: 1 },
  { in: 11.8, out: 23.8, text: '双板摔倒，\n最容易伤到两个地方。', y: YH, size: 80, w: 900 },
  { in: 13.0, out: 23.8, text: '一个是大拇指，一个是膝盖。\n它们都和"硬撑"有关。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 24.2, out: 32.8, text: '握着雪杖{r}用手撑{/}，\n伤的是大拇指。', y: YH, size: 76, w: 900 },
  { in: 25.0, out: 32.8, text: '雪杖会把大拇指往外掰，\n拇指根部的韧带最容易受伤。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 33.2, out: 41.8, text: '往后坐着摔，\n伤的是{r}膝盖{/}。', y: YH, size: 80, w: 900 },
  { in: 34.0, out: 41.8, text: '屁股低过膝盖时，长长的雪板像杠杆，\n别着小腿去扭膝盖。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 42.2, out: 44.2, text: '安全地摔，\n记住四步。', y: YH, size: 80, w: 900 },
  { in: 44.5, out: 50.8, text: '① 别硬撑', y: YH, size: 80, w: 900 },
  { in: 45.2, out: 50.8, text: '真要倒了，就让它倒。\n滑行中硬撑着不倒，往往伤得更重。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 51.2, out: 56.8, text: '② 双手往前', y: YH, size: 80, w: 900 },
  { in: 51.9, out: 56.8, text: '手放在身前，摔的时候松开雪杖，\n别往后、往侧面撑。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 57.2, out: 62.8, text: '③ 侧身倒向山上一侧', y: YH, size: 76, w: 900 },
  { in: 57.9, out: 62.8, text: '用屁股和大腿外侧着地，\n别正着往后坐。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 63.2, out: 71.8, text: '④ 腿并拢，停稳再起', y: YH, size: 76, w: 900 },
  { in: 63.9, out: 71.8, text: '板放在身体下坡一侧，\n完全停下来，再动。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 72.2, out: 77.8, text: '摔完，\n怎么站起来？', y: YH, size: 80, w: 900 },
  { in: 73.0, out: 77.8, text: '两块板并拢，横在身体的下坡一侧。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 78.2, out: 89.8, text: '屁股靠近板，\n手撑山上那侧{g}站起来{/}。', y: YH, size: 76, w: 900 },
  { in: 79.0, out: 89.8, text: '两根雪杖并在一起往下撑，会省力很多。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 90.2, out: 95.8, text: '板掉了，\n先穿{g}山下那只{/}。', y: YH, size: 80, w: 900 },
  { in: 91.0, out: 95.8, text: '把板横在坡上放稳，\n站稳了再穿另一只。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 96.2, out: 103.8, text: '敲掉鞋底的雪，\n脚尖先进，脚跟踩下去。', y: YH, size: 76, w: 900 },
  { in: 97.0, out: 103.8, text: '鞋底有雪，固定器就扣不牢。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 104.2, out: 110.3, text: '摔完别停在\n{r}坡顶下面{/}。', y: YH, size: 80, w: 900 },
  { in: 105.0, out: 110.3, text: '上面的人看不见你，\n挪到雪道边上再休息。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 110.7, out: 116.8, text: '还有三样准备。', y: YH, size: 80, w: 900 },
  { in: 111.4, out: 116.8, text: '固定器的脱离值，要让雪具店\n按你的体重和水平来调。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 124.2, out: 999, text: '你摔得最狠的一次，\n是怎么摔的？', y: .37, size: 84, w: 900, st: .06 },
  { in: 125.2, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];

const withP = (p, ch) => Object.assign({}, p, ch);
const PH = { // 侧面：屁股低过膝盖的后坐摔
  phantom: { shin: 10, thigh: -122, torso: 0, head: 10, uarm: 205, farm: 192, pole: 230 },
  reachBack: { shin: -10, thigh: -125, torso: -40, head: -25, uarm: 222, farm: 214, pole: 250 }
};

/* ───────── 正面小人：镜头顺着雪板方向看，雪坡向右下倾斜，左边是山上 ─────────
 * hipS / hipH 髋部位置，lean 上身倾角（正 = 倒向山下），armU / armD 山上侧、山下侧手臂角度。*/
const FP = {
  stand: { hipS: 0, hipH: 1.6, lean: 0, armU: -160, armD: 160, poles: 1 },
  low: { hipS: -.05, hipH: 1.25, lean: -4, armU: -150, armD: 150, poles: 1 },
  wobble: { hipS: .1, hipH: 1.5, lean: 14, armU: -60, armD: 70, poles: 1 },
  handsFwd: { hipS: -.05, hipH: 1.25, lean: -4, armU: 165, armD: -165, poles: 0 },
  postSide: { hipS: -.45, hipH: .9, lean: -35, armU: -125, armD: 100, poles: 1 },
  sideFall: { hipS: -.72, hipH: .3, lean: -62, armU: 150, armD: -160, poles: 0 },
  sideLie: { hipS: -.78, hipH: .26, lean: -78, armU: 170, armD: -175, poles: 0 },
  close: { hipS: -.45, hipH: .32, lean: -40, armU: -160, armD: 175, poles: 1 },
  push: { hipS: -.3, hipH: .7, lean: -18, armU: -150, armD: -170, poles: 1 },
  up: { hipS: 0, hipH: 1.5, lean: 0, armU: -155, armD: 155, poles: 1 }
};
function frontSkier(F, th, p, u, o = {}) {
  const fr = frameOf(th), col = c => o.mono || c;
  const P = (s, h) => [F[0] + (fr.d[0] * s + fr.n[0] * h) * u, F[1] + (fr.d[1] * s + fr.n[1] * h) * u];
  const add = (q, deg, l) => { const v = dirOf(fr, deg); return [q[0] + v[0] * l * u, q[1] + v[1] * l * u]; };
  const D = [-.16 * u, -.3 * u], sh = (q, k) => [q[0] + D[0] * k, q[1] + D[1] * k];
  const feet = [-.2, .2], Hc = P(p.hipS, p.hipH), S = add(Hc, p.lean, 1.1), Hd = add(S, p.lean, .4);
  const hips = [[Hc[0] - fr.d[0] * .17 * u, Hc[1] - fr.d[1] * .17 * u], [Hc[0] + fr.d[0] * .17 * u, Hc[1] + fr.d[1] * .17 * u]];
  const sv = dirOf(fr, p.lean + 90), shs = [[S[0] - sv[0] * .27 * u, S[1] - sv[1] * .27 * u], [S[0] + sv[0] * .27 * u, S[1] + sv[1] * .27 * u]];
  const arms = [p.armU, p.armD].map((a, i) => { const E = add(shs[i], a, .55), Hn = add(E, a + (i ? 18 : -18), .5); return { E, Hn, a }; });
  const J = { fr, P, Hc, S, Hd, hips, shs, arms, u };
  g.save(); g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.lineCap = 'round'; g.lineJoin = 'round';
  const seg = (a, b, w, c) => { g.strokeStyle = col(c); g.lineWidth = w * u; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const poly = (pts, fill) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = col(fill); g.fill(); };
  // 两块雪板（向画面深处延伸）
  feet.forEach(s => {
    const a = P(s - .1, .07), b = P(s + .1, .07);
    poly([sh(a, -.6), sh(b, -.6), sh(b, 3.2), sh(a, 3.2)], '#5b9cf2');
    poly([sh(P(s - .1, 0), -.6), sh(P(s + .1, 0), -.6), sh(b, -.6), sh(a, -.6)], COL.ski);
  });
  // 雪杖（在手臂后面）
  if (p.poles) arms.forEach((ar, i) => { const v = dirOf(fr, ar.a + (i ? 18 : -18)); seg(ar.Hn, [ar.Hn[0] + v[0] * 1.5 * u, ar.Hn[1] + v[1] * 1.5 * u], .045, '#8a9bb0'); });
  // 腿
  feet.forEach((s, i) => {
    const A = P(s, .32), Hj = hips[i], m = mid(A, Hj), dl = Math.hypot(Hj[0] - A[0], Hj[1] - A[1]) / u, b = Math.sqrt(Math.max(0, 1 - (dl / 2) ** 2)) * .3;
    const K = [m[0] + fr.d[0] * (i ? b : -b) * u, m[1] + fr.d[1] * (i ? b : -b) * u];
    seg(A, K, .25, COL.pants); seg(K, Hj, .29, COL.pants);
    poly([P(s - .15, .07), P(s + .15, .07), P(s + .13, .45), P(s - .13, .45)], COL.boot);
  });
  seg(hips[0], hips[1], .32, COL.pants);
  // 上身、头
  seg(Hc, S, .58, COL.jacket); seg(shs[0], shs[1], .3, COL.jacket);
  g.fillStyle = col('#fff'); g.strokeStyle = col(COL.pants); g.lineWidth = .05 * u; g.beginPath(); g.arc(Hd[0], Hd[1], .22 * u, 0, Math.PI * 2); g.fill(); g.stroke();
  g.save(); g.translate(Hd[0], Hd[1]); g.rotate(Math.atan2(fr.d[1], fr.d[0]) + p.lean * D2R); g.fillStyle = col(COL.amber); rrect(-.17 * u, -.07 * u, .34 * u, .13 * u, .06 * u); g.fill(); g.restore();
  // 手臂
  arms.forEach((ar, i) => { seg(shs[i], ar.E, .17, i ? '#ff8a4f' : COL.jacket2); seg(ar.E, ar.Hn, .15, i ? '#ff8a4f' : COL.jacket2); g.fillStyle = col(COL.pants); g.beginPath(); g.arc(ar.Hn[0], ar.Hn[1], .1 * u, 0, Math.PI * 2); g.fill(); });
  g.restore();
  return J;
}
function topSkis(x, y, ang, s, bodySide) { // 俯视：两块板 + 人（bodySide=-1 人在板的上坡一侧）
  g.save(); g.translate(x, y); g.rotate(ang);
  g.fillStyle = COL.ski; rrect(-130 * s, -24 * s, 260 * s, 16 * s, 8 * s); g.fill(); rrect(-130 * s, 8 * s, 260 * s, 16 * s, 8 * s); g.fill();
  g.restore();
  if (bodySide) {
    g.save(); g.translate(x, y);
    const by = -80 * s; g.fillStyle = COL.jacket; g.beginPath(); g.ellipse(0, by, 34 * s, 28 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(0, by - 34 * s, 18 * s, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = COL.pants; g.lineWidth = 20 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(-12 * s, by + 12 * s); g.lineTo(-30 * s, -14 * s); g.moveTo(12 * s, by + 12 * s); g.lineTo(30 * s, 14 * s); g.stroke();
    g.restore();
  }
}
function topBg(lt) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = (i * 260 + lt * 40) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}
function spark(q, lt) { const a = Math.max(0, 1 - lt / .5); g.save(); g.globalAlpha = a; g.strokeStyle = COL.red; g.lineWidth = 6; g.lineCap = 'round'; for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2, r1 = 18 + lt * 60, r2 = 50 + lt * 120; g.beginPath(); g.moveTo(q[0] + Math.cos(an) * r1, q[1] + Math.sin(an) * r1); g.lineTo(q[0] + Math.cos(an) * r2, q[1] + Math.sin(an) * r2); g.stroke(); } g.restore(); }

/* ───────── 场景 ───────── */
const S = [];
const hookV = t => t < 2.6 ? lerp(950, 1200, t / 2.6) : t < 3.8 ? lerp(1200, 1700, ein((t - 2.6) / 1.2)) : lerp(1700, 0, eout((t - 3.8) / 2.0));
const hookScroll = makeScroll(hookV, 0, 8.2);
// A 钩子
S.push(lt => {
  const th = 24, F = [CX + 30, H * .62], sc = hookScroll(lt);
  drawSky(sc); drawSnowfall(lt, .8); drawSlope(F, th, sc);
  const sp = clamp(hookV(lt) / 1700, 0, 1); speedLines(F, th, lt, sp);
  let p;
  if (lt < 2.0) p = lerpPose(POSES.neutral, POSES.tense, sm(lt / 2));
  else if (lt < 2.6) p = lerpPose(POSES.tense, POSES.back, sm((lt - 2) / .6));
  else p = lerpPose(POSES.back, PH.reachBack, ein((lt - 2.6) / 1.2));
  const shake = lt > 3.8 ? Math.max(0, 1 - (lt - 3.8) / .6) * 22 : 0;
  g.save(); g.translate((hash(Math.floor(lt * 30)) - .5) * shake, (hash(Math.floor(lt * 30) + 7) - .5) * shake);
  const J = drawSkier(F, th, p, 140);
  sprayTrail(J, lt, lt < 3.8 ? sp : 0); burst(J.Hp[0], J.Hp[1], lt - 3.8);
  g.restore();
  if (lt > 4.3) { const a = win(lt, 4.3, 7.9, .3, .3); ring(J.Hn[0], J.Hn[1], 54, COL.red, a, true); ring(J.K[0], J.K[1], 60, COL.red, a, true); g.save(); g.globalAlpha = a; label('大拇指', J.Hn[0] - 30, J.Hn[1] + 95, 40, COL.red, 900); label('膝盖', J.K[0] + 30, J.K[1] - 100, 40, COL.red, 900); g.restore(); }
});
// B 标题
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 8, .8);
  pill('滑雪不难 · EP.02 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  const F = [CX + 40, H * .66], th = 14;
  drawSlope(F, th, lt * 60, { noProps: true });
  const J = frontSkier(F, th, FP.sideFall, 125, { alpha: eout((lt - .2) / .4) });
  const k = pop(lt - 1.1); if (k > 0) markV(J.Hd[0] - 40, J.Hd[1] - 130, 46, 1, k);
});
// C 两处伤：大拇指、膝盖
function thumbIcon(x, y, s, bend) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round';
  g.strokeStyle = '#8a9bb0'; g.lineWidth = 12; g.beginPath(); g.moveTo(-20, -170); g.lineTo(30, 170); g.stroke();
  g.fillStyle = COL.pants; rrect(-60, -60, 110, 120, 40); g.fill();
  g.save(); g.translate(40, -40); g.rotate(-.3 - bend * 1.1); g.fillStyle = '#3a5778'; rrect(-14, -70, 28, 80, 14); g.fill(); g.restore();
  g.restore();
}
function kneeIcon(x, y, s, red) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round';
  g.strokeStyle = '#e8d9bd'; g.lineWidth = 60; g.beginPath(); g.moveTo(-30, -170); g.lineTo(0, -20); g.stroke(); g.beginPath(); g.moveTo(0, 20); g.lineTo(10, 170); g.stroke();
  g.fillStyle = '#f3e7d1'; g.beginPath(); g.ellipse(0, -10, 60, 44, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = COL.red; g.lineWidth = 12; g.globalAlpha = red; g.beginPath(); g.moveTo(20, 20); g.lineTo(-24, -24); g.stroke();
  g.restore();
}
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 11.6, .5);
  [['大拇指', '握着雪杖撑地', 0], ['膝盖', '往后坐着摔', 1]].forEach(([name, why, i]) => {
    const a = eout((lt - .8 - i * .8) / .4); if (a <= 0) return;
    const x = W * (.27 + i * .46), y = H * .26, cw = 420, ch = 720;
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40);
    g.fillStyle = '#fff'; g.shadowColor = 'rgba(27,40,56,.12)'; g.shadowBlur = 40; rrect(x - cw / 2, y, cw, ch, 36); g.fill(); g.shadowBlur = 0;
    const pulse = .5 + .5 * Math.sin(lt * 5);
    glow(x, y + 300, 150, '240,71,60', .35 * pulse);
    if (i === 0) thumbIcon(x, y + 300, 1.05, .6 + .3 * pulse); else kneeIcon(x, y + 300, 1.05, .6 + .4 * pulse);
    label(name, x, y + 560, 60, COL.red, 900); label(why, x, y + 640, 36, COL.sub, 700);
    g.restore();
  });
});
// D1 大拇指特写
S.push(lt => {
  drawSky(0);
  const gy = H * .62; g.fillStyle = '#fff'; g.fillRect(0, gy, W, H - gy); g.strokeStyle = '#c3d4e4'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke();
  const tImp = 1.3, k = ein(clamp(lt / tImp, 0, 1)), bend = eout(clamp((lt - tImp) / .4, 0, 1));
  const hx = CX - 40 + k * 40, hy = lerp(H * .3, gy - 230, k);
  // 手臂
  g.lineCap = 'round'; g.strokeStyle = '#ff8a4f'; g.lineWidth = 96; g.beginPath(); g.moveTo(hx - 520, hy - 360); g.lineTo(hx - 50, hy - 30); g.stroke();
  // 雪杖：撞到雪后杖尖停住，杖身往回压
  const tipX = hx + 120 + bend * 40, tipY = gy;
  g.strokeStyle = '#8a9bb0'; g.lineWidth = 16; g.beginPath(); g.moveTo(hx - 60 - bend * 40, hy - 140 + bend * 40); g.lineTo(lt < tImp ? hx + 130 : tipX, lt < tImp ? hy + 230 : tipY); g.stroke();
  g.fillStyle = COL.pants; rrect(hx - 75, hy - 70, 150, 140, 50); g.fill();
  g.save(); g.translate(hx + 55, hy - 50); g.rotate(-.4 - bend * 1.2); g.fillStyle = '#3a5778'; rrect(-18, -90, 36, 100, 18); g.fill(); g.restore();
  if (lt > tImp) {
    const a = clamp((lt - tImp) / .2, 0, 1), pul = .55 + .45 * Math.sin(lt * 9);
    glow(hx + 50, hy - 40, 130, '240,71,60', a * pul);
    g.save(); g.globalAlpha = a; label('大拇指被往外掰', hx + 230, hy - 200, 44, COL.red, 900); g.restore();
    burst(tipX, tipY, lt - tImp, 20, .4);
  }
});
// D2 膝盖：屁股低过膝盖
S.push(lt => {
  const th = 14, F = [CX + 60, H * .62];
  drawSky(0); drawSnowfall(lt + 33, .4); drawSlope(F, th, 0, { noProps: true });
  const p = lerpPose(POSES.neutral, PH.phantom, sm((lt - .4) / 1.2));
  const J = drawSkier(F, th, p, 160);
  if (lt > 1.8) {
    const a = win(lt, 1.8, 99, .3, .3), pul = .55 + .45 * Math.sin(lt * 8);
