function parseRich(line, base) {
  const out = []; let col = base, hl = false;
  for (let i = 0; i < line.length;) {
    if (line[i] === '{') { const j = line.indexOf('}', i); const tag = line.slice(i + 1, j); if (tag === '/') { col = base; hl = false; } else { col = TAGC[tag] || base; hl = true; } i = j + 1; continue; }
    const ch = String.fromCodePoint(line.codePointAt(i)); out.push([ch, col, hl]); i += ch.length;
  }
  return out;
}
function drawCaption(b, t) {
  const lt = t - b.in; if (lt < 0 || t > b.out + .3) return;
  const outK = t > b.out ? 1 - (t - b.out) / .3 : 1;

  g.font = `${b.w} ${size}px ${SANS}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const base = b.note ? COL.faint : b.sub ? COL.sub : COL.ink;
  const lines = b.text.split('\n'), y0 = b.y * H - (lines.length - 1) * lh / 2;
  let k = 0;
  lines.forEach((line, li) => {
    const chars = parseRich(line, base), ws = chars.map(c => g.measureText(c[0]).width);
    const total = ws.reduce((s, v) => s + v + ls, 0) - ls; let x = W / 2 - total / 2;
    chars.forEach(([ch, col, hl], ci) => {
      const ct = lt - (k++) * st, cx = x + ws[ci] / 2; x += ws[ci] + ls;
      if (ct < 0) return;
      const e = eout(ct / .35), a = e * outK; if (a < .01) return;
      const y = y0 + li * lh + (1 - e) * size * .35;
      g.globalAlpha = a;
      if (hl) { g.fillStyle = col; g.globalAlpha = a * .16; g.fillRect(cx - ws[ci] / 2 - ls / 2 - .5, y + size * .02, ws[ci] + ls + 1, size * .42); g.globalAlpha = a; }
      g.fillStyle = col; g.fillText(ch, cx, y);
    });
  });
  g.globalAlpha = 1;
}

const lerpPose = (a, b, k) => { const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; };
const frameOf = th => { const r = th * D2R; return { d: [Math.cos(r), Math.sin(r)], n: [Math.sin(r), -Math.cos(r)] }; };

function joints(F, th, pose, u) {
  const fr = frameOf(th);
  const P = (s, h) => [F[0] + (fr.d[0] * s + fr.n[0] * h) * u, F[1] + (fr.d[1] * s + fr.n[1] * h) * u];

const BOOT_LEAN = 18;
function drawBoot(J, col, cutaway) {
  const { fr, P, A, u } = J;
  const c = dirOf(fr, BOOT_LEAN), pf = dirOf(fr, BOOT_LEAN + 90);
  const Q = (p, a, ka, b, kb) => [p[0] + (a[0] * ka + b[0] * kb) * u, p[1] + (a[1] * ka + b[1] * kb) * u];
  const pts = [P(-.38, .05), P(.64, .05), P(.68, .18), P(.46, .3), Q(A, pf, .26, c, .26), Q(A, pf, .24, c, .7), Q(A, pf, -.24, c, .7), Q(A, pf, -.3, c, .16), P(-.42, .22)];
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  g.fillStyle = col(COL.boot); const a0 = g.globalAlpha;
  if (cutaway) g.globalAlpha = a0 * .38;

  g.strokeStyle = col('#22303f'); g.lineWidth = .045 * u; g.stroke();
  g.strokeStyle = col('#8fa3b8'); g.lineWidth = .035 * u;
  [.36, .56].forEach(k => { const p1 = Q(A, pf, .24, c, k), p2 = Q(A, pf, -.18, c, k); g.beginPath(); g.moveTo(...p1); g.lineTo(...p2); g.stroke(); });

}
function drawSki(J, col) {

  g.strokeStyle = col(COL.ski); g.lineWidth = .085 * u; g.lineCap = 'round';
  const a = P(-1.65, .04), b = P(1.72, .04), c1 = P(1.98, .05), tip = P(2.06, .26);

function drawSkier(F, th, pose, u, o = {}) {
  const J = joints(F, th, pose, u), { fr } = J;

function drawPressure(J, center, a = 1, showTip = true) {
  const { P, u } = J;
