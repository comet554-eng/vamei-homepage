const STEPS = ['① 调脱离值', '② 热身', '③ 练重心'];

/* ───────── 姿势 ───────── */
const PH = { // 屁股低过膝盖、坐在板尾上（同 EP.02）
  phantom: { shin: 10, thigh: -122, torso: 0, head: 10, uarm: 205, farm: 192, pole: 230 },
  reachBack: { shin: -10, thigh: -125, torso: -40, head: -25, uarm: 222, farm: 214, pole: 250 }
};
const GO = { shin: 22, thigh: -64, torso: 42, head: 18, uarm: 96, farm: 78, pole: 150 };      // 手往前、身体团起来
const SIT = { shin: -30, thigh: -150, torso: -20, head: -10, uarm: 168, farm: 118, pole: 190 }; // 坐在雪上
const SQ = { shin: 32, thigh: -66, torso: 40, head: 18, uarm: 120, farm: 90, pole: 205 };      // 热身下蹲

function spark(q, lt, col) { const a = Math.max(0, 1 - lt / .5); if (a <= 0 || lt < 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col || COL.red; g.lineWidth = 6; g.lineCap = 'round'; for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2, r1 = 18 + lt * 60, r2 = 50 + lt * 120; g.beginPath(); g.moveTo(q[0] + Math.cos(an) * r1, q[1] + Math.sin(an) * r1); g.lineTo(q[0] + Math.cos(an) * r2, q[1] + Math.sin(an) * r2); g.stroke(); } g.restore(); }
function kneeHurt(J, a, t) { const pul = .55 + .45 * Math.sin(t * 8); glow(J.K[0], J.K[1], 110, '240,71,60', a * pul); ring(J.K[0], J.K[1], 56, COL.red, a, true); }
// 椭圆箭头（表示"拧"）
function ellArrow(cx, cy, rx, ry, a0, a1, col, w, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  const n = 32, pts = []; for (let i = 0; i <= n; i++) { const an = lerp(a0, a1, i / n); pts.push([cx + Math.cos(an) * rx, cy + Math.sin(an) * ry]); }
  g.beginPath(); for (let i = 0; i <= n - 3; i++) i ? g.lineTo(pts[i][0], pts[i][1]) : g.moveTo(pts[i][0], pts[i][1]); g.stroke();

  g.restore();
}
function chipRow(items, y, a, colr, size) {
  size = size || 34; g.save(); g.font = '700 ' + size + 'px ' + SANS;

}

/* ───────── 特写卡：地面上的长板 + 小腿（"杠杆"） ─────────
 * tw：板在雪面上被别着转的角度（弧度，示意）。小腿跟着板转，大腿基本不动 → 拧在膝盖。 */
function leverCard(tw, o) {
  const x0 = W * .07, y0 = H * .215, cw = W * .86, ch = H * .47, gy = H * .55;
  g.save(); g.fillStyle = '#fff'; g.shadowColor = 'rgba(27,40,56,.13)'; g.shadowBlur = 44; rrect(x0, y0, cw, ch, 40); g.fill(); g.restore();
  g.save(); rrect(x0, y0, cw, ch, 40); g.clip();
  const gr = g.createLinearGradient(0, gy - 170, 0, y0 + ch); gr.addColorStop(0, '#e9f1f8'); gr.addColorStop(1, '#ffffff'); g.fillStyle = gr; g.fillRect(x0, gy - 170, cw, y0 + ch - gy + 170);
  g.strokeStyle = '#d6e2ed'; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, gy - 170); g.lineTo(x0 + cw, gy - 170); g.stroke();
  const a = .2 + tw, L = 390, B = [CX, gy];
  const P = s => [B[0] + s * L * Math.cos(a), B[1] + s * L * Math.sin(a) * .34];
  // 板的影子与板
  g.save(); g.globalAlpha = .12; g.strokeStyle = '#1b2838'; g.lineWidth = 34; g.lineCap = 'round'; const s1 = P(-1), s2 = P(1); g.beginPath(); g.moveTo(s1[0], s1[1] + 16); g.lineTo(s2[0], s2[1] + 16); g.stroke(); g.restore();
  g.lineCap = 'round'; g.strokeStyle = COL.ski; g.lineWidth = 30; const t1 = P(1), t2 = P(1.08);
  g.beginPath(); g.moveTo(...P(-1)); g.lineTo(...t1); g.quadraticCurveTo(t2[0], t2[1], t2[0] + 4, t2[1] - 26); g.stroke();
  g.strokeStyle = '#1d5fbf'; g.lineWidth = 10; g.beginPath(); g.moveTo(...P(-.26)); g.lineTo(...P(.3)); g.stroke();
  // 固定器
  [-.24, .27].forEach(s => { const q = P(s); g.fillStyle = '#4a5566'; rrect(q[0] - 26, q[1] - 26, 52, 32, 8); g.fill(); });
  // 雪鞋
  const sa = P(-.2), sb = P(.24);
  g.strokeStyle = COL.boot; g.lineWidth = 40; g.beginPath(); g.moveTo(sa[0], sa[1] - 26); g.lineTo(sb[0], sb[1] - 26); g.stroke();
  g.fillStyle = COL.boot; rrect(CX - 52, gy - 170, 104, 150, 22); g.fill();
  g.strokeStyle = '#8fa3b8'; g.lineWidth = 5; [gy - 130, gy - 90].forEach(y => { g.beginPath(); g.moveTo(CX - 40, y); g.lineTo(CX + 40, y); g.stroke(); });
  // 小腿、膝盖、大腿
  const K = [CX, gy - 400], top = [CX - 8, y0 - 80];
  g.strokeStyle = COL.pants; g.lineWidth = 74; g.beginPath(); g.moveTo(CX, gy - 160); g.lineTo(K[0], K[1]); g.stroke();
  g.lineWidth = 88; g.beginPath(); g.moveTo(K[0], K[1]); g.lineTo(top[0], top[1]); g.stroke();
  const so = 24 * Math.sin(clamp(tw * 2.4, -1.3, 1.3)), to = 24 * Math.sin(tw * .35);
  g.strokeStyle = '#4b6c93'; g.lineWidth = 8; g.beginPath(); g.moveTo(CX + so, gy - 175); g.lineTo(K[0] + so, K[1] + 40); g.stroke();
  g.beginPath(); g.moveTo(K[0] + to, K[1] - 40); g.lineTo(top[0] + to, top[1]); g.stroke();
  g.fillStyle = '#2f4b6b'; g.beginPath(); g.arc(K[0], K[1], 48, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3d5d82'; g.beginPath(); g.ellipse(K[0] + so * .4, K[1], 26, 30, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  return { P, K, B, gy, tip: P(1), tail: P(-1), a };
}

/* ───────── 正面小人：右边那只板可以被"卡住"往外跑（catchR 0~1） ───────── */
function frontV2(F, p, u, o = {}) {
  const col = c => o.mono || c, J = { u };
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  const seg = (a, b, w, c) => { g.strokeStyle = col(c); g.lineWidth = w * u; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const poly = (pts, c) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = col(c); g.fill(); };
  const cr = p.catchR || 0;
  const boots = [-1, 1].map(sd => [F[0] + sd * p.stance * u + p.sway * u * .3 + (sd > 0 ? cr * .2 * u : 0), F[1]]);
  boots.forEach((b, i) => {
    const sd = i ? 1 : -1, tipX = lerp(b[0], F[0] + sd * .12 * u, p.wedge);
    let tip = [tipX, F[1] + 1.05 * u], tail = [b[0] + (b[0] - tipX) * .85, F[1] - .9 * u];
    if (i === 1) { tip = [tip[0] + cr * .8 * u, tip[1] - cr * .08 * u]; tail = [tail[0] - cr * .62 * u, tail[1]]; }
    const wn = .2 * u, wf = .12 * u, eg = p.edge * .07 * u * sd;
    poly([[tail[0] - wf / 2 - eg, tail[1]], [tail[0] + wf / 2 - eg, tail[1]], [tip[0] + wn / 2 - eg, tip[1]], [tip[0] - wn / 2 - eg, tip[1]]], COL.ski);
    if (p.edge > .05) poly([[tail[0] - sd * wf / 2 - eg, tail[1]], [tail[0] - sd * wf / 2, tail[1] + .03 * u], [tip[0] - sd * wn / 2, tip[1] + .05 * u], [tip[0] - sd * wn / 2 - eg, tip[1]]], '#1d5fbf');
    J['tip' + i] = tip; J['tail' + i] = tail;
  });
  J.boots = boots;
  const hipC = [F[0] + p.sway * u, F[1] - p.hipH * u], hips = [[hipC[0] - .18 * u, hipC[1]], [hipC[0] + .18 * u, hipC[1]]];
  const knees = boots.map((b, i) => { const a = [b[0], b[1] - .4 * u], m = mid(a, hips[i]); const kin = p.kneeIn + (i ? cr * .3 : 0) - (i ? 0 : (p.stiffL || 0) * p.kneeIn); return [m[0] - (i ? 1 : -1) * kin * u, m[1]]; });
  J.knees = knees;
  const S = [hipC[0] + (p.lean || 0) * u, hipC[1] - 1.1 * u], sh = [[S[0] - .28 * u, S[1]], [S[0] + .28 * u, S[1]]];
  const hands = sh.map((q, i) => [q[0] + (i ? 1 : -1) * .42 * u, q[1] + .8 * u]);
  hands.forEach((h, i) => seg(h, [h[0] + (i ? 1 : -1) * .35 * u, F[1] + .25 * u], .04, '#8a9bb0'));
  boots.forEach((b, i) => {
    const a = [b[0], b[1] - .4 * u];
    seg(a, knees[i], .26, COL.pants); seg(knees[i], hips[i], .3, COL.pants);
    poly([[b[0] - .15 * u, b[1] + .02 * u], [b[0] + .15 * u, b[1] + .02 * u], [b[0] + .13 * u, b[1] - .45 * u], [b[0] - .13 * u, b[1] - .45 * u]], COL.boot);
  });
  seg(hips[0], hips[1], .34, COL.pants);
  seg(hipC, S, .6, COL.jacket); seg(sh[0], sh[1], .32, COL.jacket);
  sh.forEach((q, i) => { const e = [q[0] + (i ? 1 : -1) * .3 * u, q[1] + .45 * u]; seg(q, e, .17, i ? '#ff8a4f' : COL.jacket2); seg(e, hands[i], .15, i ? '#ff8a4f' : COL.jacket2); g.fillStyle = col(COL.pants); g.beginPath(); g.arc(hands[i][0], hands[i][1], .1 * u, 0, Math.PI * 2); g.fill(); });
  const Hd = [S[0], S[1] - .4 * u]; J.Hd = Hd; J.hipC = hipC; J.S = S;
  g.fillStyle = col('#fff'); g.strokeStyle = col(COL.pants); g.lineWidth = .05 * u; g.beginPath(); g.arc(Hd[0], Hd[1], .22 * u, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = col(COL.amber); rrect(Hd[0] - .17 * u, Hd[1] - .06 * u, .34 * u, .13 * u, .06 * u); g.fill();
  g.restore();
  return J;
}
function snowPuff(q, lt, amt) {
  if (amt < .02) return; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 12; i++) { const ph = (lt * 1.3 + hash(i + 40)) % 1, an = -Math.PI * (.05 + hash(i + 2) * .5); const x = q[0] + Math.cos(an) * ph * 140, y = q[1] + Math.sin(an) * ph * 90 + ph * ph * 60; g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(x, y, 6 + hash(i) * 9, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

/* ───────── 固定器特写（侧面）：rel 0~1 鞋从板上脱开；din 0~1 脱离值指针（示意） ───────── */
function bindingView(cx, gy, rel, din, o = {}) {
  g.save();
  g.fillStyle = 'rgba(27,40,56,.08)'; g.beginPath(); g.ellipse(cx, gy + 4, 470, 16, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = COL.ski; rrect(cx - 440, gy - 34, 880, 30, 12); g.fill();
  g.strokeStyle = COL.ski; g.lineWidth = 30; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx + 425, gy - 19); g.quadraticCurveTo(cx + 490, gy - 19, cx + 505, gy - 70); g.stroke();
  g.fillStyle = '#1d5fbf'; rrect(cx - 300, gy - 44, 600, 12, 6); g.fill();
  // 雪鞋
  const bx = cx - 20 - rel * 50 + (o.shake || 0), by = gy - 104 - rel * 100, ang = -rel * .32;
  g.save(); g.translate(bx, by); g.rotate(ang);
  g.fillStyle = COL.boot; rrect(-160, -190, 230, 190, 30); g.fill(); rrect(-200, -10, 400, 64, 16); g.fill();
  g.strokeStyle = '#8fa3b8'; g.lineWidth = 7; g.lineCap = 'round'; [-140, -85].forEach(y => { g.beginPath(); g.moveTo(-145, y); g.lineTo(55, y); g.stroke(); });
  g.fillStyle = COL.pants; rrect(-140, -330, 190, 150, 20); g.fill();
  g.restore();
  // 后跟座、前头座 + 脱离值窗口
  g.fillStyle = '#4a5566'; rrect(cx - 285, gy - 104, 100, 72, 14); g.fill(); rrect(cx + 165, gy - 100, 125, 68, 14); g.fill();
