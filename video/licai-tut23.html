<script>
(() => {

  [0.0, 2.6, 'W', ''],
  [19.2, 23.4, 'W', '一壶水，一点吃的'],

];

  [2.7, 5.4, '包里带这几样，心里不慌。'],

  [10.0, 14.4, '再带一个{o}多功能工具{/}，螺丝松了能自己拧。'],
  [14.6, 18.8, '{o}手机{/}充好电，带一点现金或者交通卡。'],
  [19.2, 23.4, '{o}水和吃的{/}：一壶水，一根香蕉或者能量棒。'],

function icon(name, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = C.ink; g.lineWidth = 5;

  if (name === 'tool') { g.fillStyle = C.red; g.beginPath(); g.roundRect(-30, -10, 60, 80, 12); g.fill(); g.stroke(); g.fillStyle = C.gray; [-.5, 0, .5].forEach(a => { g.save(); g.rotate(a); g.beginPath(); g.roundRect(-6, -80, 12, 80, 4); g.fill(); g.stroke(); g.restore(); }); }

  if (name === 'bottle') { g.fillStyle = C.blue; g.beginPath(); g.roundRect(-28, -55, 56, 120, 16); g.fill(); g.stroke(); g.fillStyle = C.ink; g.fillRect(-14, -72, 28, 18); }
  if (name === 'banana') { g.strokeStyle = C.gold; g.lineWidth = 26; g.beginPath(); g.arc(0, -40, 70, .5, 2.6); g.stroke(); }
  if (name === 'light') { g.fillStyle = C.ink; g.beginPath(); g.roundRect(-50, -24, 70, 48, 10); g.fill(); g.strokeStyle = C.gold; g.lineWidth = 6; [-.4, 0, .4].forEach(a => { g.beginPath(); g.moveTo(30 + Math.cos(a) * 10, Math.sin(a) * 10); g.lineTo(30 + Math.cos(a) * 60, Math.sin(a) * 60); g.stroke(); }); }

function card(name, label, x, y, a, col) { if (a <= 0) return; boxNote(x, y, 280, 290, 2200 + x + y, col || C.ink, a); g.save(); g.globalAlpha = a; icon(name, x + 140, y + 120, 1); g.restore(); txt(label, x + 140, y + 250, 44, C.ink, { align: 'center', a: a }); }

    [14.5, 19.2, (lt, t) => {

    }],
    [19.2, 23.5, () => {}],
    [23.5, 28.0, (lt, t) => {
      card('light', '前后车灯', 230, 600, k01(t, 23.6, 23.9), C.gold);
      const k = k01(t, 24.6, 26.0); g.save(); g.fillStyle = k < .5 ? C.orange : C.ink; g.globalAlpha = k01(t, 24.4, 24.7); g.beginPath(); g.arc(720, 740, 70, 0, 6.283); g.fill(); if (k >= .5) { g.fillStyle = PAPER; g.beginPath(); g.arc(750, 715, 62, 0, 6.283); g.fill(); } g.restore();
      txt(k < .5 ? '白天出门' : '骑到天黑', 720, 880, 48, C.ink, { align: 'center', a: k01(t, 24.4, 24.7) });
    }],
    [28.0, 41.3, (lt, t) => {
      if (t < 32.5) { card('jacket', '薄外套 / 雨衣', 400, 600, k01(t, 28.3, 28.6), C.blue); txt('天气不好时', 540, 500, 54, C.ink, { align: 'center', a: k01(t, 28.3, 28.6) }); return; }
      if (t < 37.0) {
        g.save(); g.translate(540, 840); bike(0, 0, 2.3, 0, C.ink); g.restore();
        g.save(); g.fillStyle = C.green; g.strokeStyle = C.ink; g.lineWidth = 4; g.globalAlpha = k01(t, 32.8, 33.1); g.beginPath(); g.roundRect(380, 640, 90, 60, 14); g.fill(); g.stroke(); g.restore();
        txt('座包', 300, 600, 50, C.green, { align: 'center', a: k01(t, 33.0, 33.3) }); tick(300, 680, 30, k01(t, 33.3, 33.6));

        txt('挂车把', 860, 560, 50, C.red, { align: 'center', a: k01(t, 34.6, 34.9) }); bigX(990, 560, 28, k01(t, 35.0, 35.3));
        return;
      }
      tutList(t, [['备用内胎', 37.2, C.green, 'tick'], ['打气筒', 37.8, C.green, 'tick'], ['手机', 38.4, C.green, 'tick'], ['水', 39.0, C.green, 'tick']], { x: 160, w: 560, dy: 140, h: 100 });
      cat('背包出发2', 860, 1000, 260, t - 37.4);
    }],
    [41.3, 45.4, () => {}],
    [45.4, 50.6, (lt, t) => tutSlogan(t, 46.4, ['修车的', '联系的', '吃喝的'])],
    [50.6, 58.4, (lt, t) => tutEnd(lt, t, 50.6, '一定带啥？')]
  ]),
  cues: [['whoosh', .05], ['pop', 2.8], ['pop', 3.3], ['pop', 3.8], ['pop', 4.3], ['pop', 6.2], ['pop', 7.0], ['pop', 7.8], ['ding', 10.1], ['pop', 14.8], ['pop', 16.0], ['whoosh', 19.2], ['pop', 23.6], ['whoosh', 24.6],
    ['pop', 28.3], ['ding', 33.3], ['wrong', 35.0], ['pop', 37.2], ['pop', 37.8], ['pop', 38.4], ['ding', 39.0], ['whoosh', 41.3], ['stamp', 46.4], ['stamp', 47.3], ['stamp', 48.2], ['pop', 50.8], ['ding', 51.2]],
  cover: (key, w, h) => epCover(key, w, h, { tag: '李财骑行小课堂', l1: '半路扎胎没水？', l2: '包里带这几样', sub: '修车的 · 联系的 · 吃喝的', emo: '期待星星眼', emoScale: .8,
    art: (x, y, s) => { icon('tube', x - 60 * s, y + 50 * s, .5 * s); icon('pump', x + 60 * s, y + 50 * s, .5 * s); } })
});

})();
</script>
