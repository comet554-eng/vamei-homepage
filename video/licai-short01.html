<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李财爱骑行 · 开门杀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b2621;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;cursor:pointer}
  body.render canvas{width:1080px;height:1920px;max-width:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="snowkit.js"></script>
<script src="licai-assets.js"></script>
<script src="licai-emo.js"></script>
<!-- seq:begin -->
<script>var LICAI_SEQ = {};</script>
<script src="licai-seq/侧面骑车.js"></script>
<script src="licai-seq/吓一跳.js"></script>
<script src="licai-seq/打招呼.js"></script>
<script src="licai-seq/擦汗.js"></script>
<script src="licai-seq/放大镜2.js"></script>
<script src="licai-seq/点头指向.js"></script>
<!-- seq:end -->
<script src="licaikit.js"></script>
<script src="licai-move.js"></script>
<script src="shortkit.js"></script>
<script>
(() => {
'use strict';
const SRC = document.currentScript.textContent;
// 李财爱骑行 · 竖版短视频 01《开门杀》（先出画面，后期配音；字幕即配音稿）
const k01 = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const CAR = '#9cc0e4', CAR2 = '#7fa6cf', GLASS = '#dcecf6';
// 侧视小汽车（车头朝右），(x, y) = 车底中心贴地；o.door 0~1 车门打开程度，o.person 车里有人，o.brake 刹车灯亮
function carSide(x, y, s, o) {
  o = o || {}; g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = 'round'; g.lineCap = 'round';
  const poly = (pts, fill, lw) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } g.strokeStyle = C.ink; g.lineWidth = lw || 4; g.stroke(); };
  if (o.brake) { const gr = g.createRadialGradient(-208, -92, 4, -208, -92, 70); gr.addColorStop(0, 'rgba(230,40,30,.9)'); gr.addColorStop(1, 'rgba(230,40,30,0)'); g.fillStyle = gr; g.beginPath(); g.arc(-208, -92, 70 * o.brake, 0, 6.283); g.fill(); }
  poly([[-140, -120], [-95, -196], [92, -196], [150, -120]], CAR);
  g.beginPath(); g.roundRect(-212, -122, 424, 80, 26); g.fillStyle = CAR; g.fill(); g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke();
  poly([[-124, -126], [-86, -184], [-6, -184], [-6, -126]], GLASS, 3);
  poly([[6, -126], [6, -184], [86, -184], [132, -126]], GLASS, 3);
  if (o.person) { g.save(); g.globalAlpha = o.person; g.fillStyle = C.ink; g.beginPath(); g.arc(62, -158, 17, 0, 6.283); g.fill(); g.beginPath(); g.ellipse(62, -128, 32, 16, 0, PI_, 0); g.fill(); g.restore(); }
  g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -192); g.lineTo(0, -46); g.moveTo(140, -122); g.lineTo(142, -46); g.stroke();
  g.fillStyle = C.ink; g.fillRect(14, -104, 26, 7);
  g.fillStyle = C.gold; g.beginPath(); g.ellipse(204, -96, 8, 12, 0, 0, 6.283); g.fill();
  g.fillStyle = o.brake ? '#ff3b2f' : C.red; g.beginPath(); g.ellipse(-206, -94, 7, 12, 0, 0, 6.283); g.fill();
  [-130, 130].forEach(wx => { g.fillStyle = C.ink; g.beginPath(); g.arc(wx, -38, 38, 0, 6.283); g.fill(); g.fillStyle = '#b9b0a3'; g.beginPath(); g.arc(wx, -38, 17, 0, 6.283); g.fill(); });
  const k = o.door || 0;
  if (k > 0) {
    poly([[3, -190], [86, -190], [134, -124], [140, -48], [3, -48]], 'rgba(43,38,33,.85)', 3);
    const th = k * 1.2, fx = 140 - 140 * Math.cos(th), dy = 125 * Math.sin(th);
    poly([[140, -124], [140, -48], [fx, -48 + dy], [fx, -190 + dy * .9]], CAR2);
    poly([[136, -128], [fx + 6, -186 + dy * .9], [fx + 6, -130 + dy * .95], [136, -126]], GLASS, 3);
  }
  g.restore();
}
const PI_ = Math.PI;
// 俯视小汽车（车头朝上），左上角 (x, y)，100 像素 = 1 米；door 0~1：左前门打开（铰链在前）
function carTop(x, y, door) {
  g.save(); g.lineJoin = 'round';
  g.beginPath(); g.roundRect(x, y, 180, 440, 40); g.fillStyle = CAR; g.fill(); g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke();
  g.beginPath(); g.roundRect(x + 22, y + 95, 136, 70, 16); g.fillStyle = GLASS; g.fill(); g.stroke();
  g.beginPath(); g.roundRect(x + 26, y + 300, 128, 55, 14); g.fillStyle = GLASS; g.fill(); g.stroke();
  g.fillStyle = C.gold; g.fillRect(x + 22, y + 4, 34, 10); g.fillRect(x + 124, y + 4, 34, 10);
  const hy = y + 135, a = (door || 0) * 1.15;
  if (door > 0) { g.strokeStyle = CAR2; g.lineWidth = 18; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - 6, hy); g.lineTo(x - 6 - 110 * Math.sin(a), hy + 110 * Math.cos(a)); g.stroke();
    g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 16, hy); g.lineTo(x - 16 - 100 * Math.sin(a), hy + 100 * Math.cos(a)); g.stroke(); }
  g.restore();
}
// 俯视骑车的李财：车身 + 车把 + 头像，(x, y) 为中心，车头朝上
function riderTop(x, y, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a;
  g.strokeStyle = C.ink; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y - 80); g.lineTo(x, y + 80); g.stroke();
  g.lineWidth = 9; g.beginPath(); g.moveTo(x - 36, y - 56); g.lineTo(x + 36, y - 56); g.stroke(); g.restore();
  if (a > .5) badge('眯眼开心', x, y + 6, 42, 1, 41);
}
// 俯视路面：右侧人行道 + 两辆停着的车 + 红色开门区
const CURB = 860, CL = CURB - 180, ZONE = CL - 100, PATH = CL - 160;
function streetTop(doorA, zone) {
  g.save(); g.beginPath(); g.rect(0, 420, W, 790); g.clip();
  g.fillStyle = '#ebe4d6'; g.fillRect(CURB, 420, W - CURB, 790);
  hline(CURB, 420, CURB, 1210, 501, C.ink, 4, 1);
  g.setLineDash([40, 34]); g.strokeStyle = C.faint; g.lineWidth = 6; g.beginPath(); g.moveTo(330, 420); g.lineTo(330, 1210); g.stroke(); g.setLineDash([]);
  if (zone > 0) hatchBar(ZONE, 420, 100, 790 * zone, C.red, 77, { dashed: true });
  carTop(CL, 470, doorA); carTop(CL, 950, 0);
  g.restore();
}
function dimV(x, y1, y2, col, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 5;
  g.beginPath(); g.moveTo(x, y1); g.lineTo(x, y2); g.moveTo(x - 16, y1); g.lineTo(x + 16, y1); g.moveTo(x - 16, y2); g.lineTo(x + 16, y2); g.stroke(); g.restore();
}
function dimH(x1, x2, y, col, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 5;
  g.beginPath(); g.moveTo(x1, y); g.lineTo(x2, y); g.moveTo(x1, y - 16); g.lineTo(x1, y + 16); g.moveTo(x2, y - 16); g.lineTo(x2, y + 16); g.stroke(); g.restore();
}

// ───── 字幕 = 配音稿（开始秒, 结束秒, 句子）─────
const LINES = [
  [0.15, 2.9, '骑车最怕的，不是车多。'],
  [3.0, 4.3, '是这扇门！'],
  [4.5, 8.0, '路边停着的车，车门随时可能打开。'],
  [8.2, 12.4, '正常骑，一秒就冲出{r}四米多{/}，根本来不及躲。'],
  [12.7, 18.1, '所以经过停着的车，离它至少{g}一个车门宽{/}，大概一米。'],
  [18.5, 23.2, '看到车里有人，或者刹车灯亮着，再离远一点。'],
  [23.5, 27.6, '实在太挤，就放慢速度，手放在刹车上。'],
  [28.0, 31.6, '你被开门杀吓到过吗？评论区说说。']
];
const HIT = .75, GROUND = 1010, LANE = 1180, CS = 1.9, CX0 = 640;
const DOOR_X = CX0 + CS * (140 - 140 * Math.cos(1.2));

shortRun({ src: SRC, seed: 901, lines: LINES,
  title: { text: '{r}开门杀{/}', t: 3.0, small: '骑车最怕的' },
  scenes: [
    // 1 撞门（第 1 秒就出事）
    [0, 4.4, (lt, t) => {
      shake(t, HIT, 22);
      hline(0, GROUND + 2, W, GROUND - 2, 11, C.faint, 4, 1); hline(0, LANE + 6, W, LANE + 2, 12, C.ink, 5, 1);
      carSide(CX0, GROUND, CS, { door: k01(t, .4, .66) });
      if (t < HIT) {
        const x = -260 + (DOOR_X - 215 + 260) * eout(t / HIT);
        for (let i = 0; i < 4; i++) hline(x - 340 - i * 50, LANE - 300 + i * 60, x - 230 - i * 36, LANE - 300 + i * 60, 300 + i, C.faint, 5, 1);
        cat('侧面骑车', x, LANE - 215, 430, 1, { noPop: true });
      } else {
        const k = k01(t, HIT, HIT + .45);
        g.save(); g.translate(DOOR_X - 230, LANE); g.rotate(-.32 * eout(k)); bikeType(0, -92 * 1.35, 1.35, 'road', 0, C.red); g.restore();
        seqDraw('吓一跳', t - HIT, 8, DOOR_X - 300 - 150 * eout(k), LANE - 10, 400, { frames: [2, 3, 4, 5, 6], once: true });
        bang('砰！', DOOR_X + 20, 590, t - HIT, 110);
      }
      if (t > 3.0) { hcircle(DOOR_X + 50, GROUND - 120, 150, 230, 9001, C.red, 7, k01(t, 3.0, 3.35)); harrow(1010, 470, 1000, 560, 950, 650, C.red, k01(t, 3.1, 3.4), 7); }
    }],
    // 2 俯视：开门区 + 一秒四米
    [4.4, 12.6, (lt, t) => {
      const doorA = k01(t, 5.6, 6.0) * (1 - k01(t, 8.0, 8.3)) + k01(t, 9.2, 9.6), zone = k01(t, 6.3, 7.0);
      g.save(); g.globalAlpha = k01(t, 4.4, 4.8); streetTop(doorA, zone); g.restore();
      if (t > 6.4 && t < 8.1) { dimH(ZONE, CL, 600, C.red, k01(t, 6.4, 6.7)); txt('车门一开', 120, 560, 50, C.red, { a: k01(t, 6.5, 6.8) }); txt('伸出来约 1 米', 120, 630, 50, C.red, { a: k01(t, 6.7, 7.0) }); }
      const ry = t < 9 ? 1150 : 1150 - 420 * Math.min(t - 9, 1);
      riderTop(ZONE + 50, ry, k01(t, 8.4, 8.7));
      if (t > 10.0) { dimV(ZONE - 50, 650, 1070, C.blue, k01(t, 10.1, 10.4)); txt('1 秒', 120, 820, 60, C.blue, { a: k01(t, 10.2, 10.5) }); txt('≈ 4 米', 120, 900, 60, C.blue, { a: k01(t, 10.3, 10.6) }); bang('砰', ZONE + 40, 600, t - 10.0, 64); }
      if (t > 10.9) { txt('开门只要', 120, 520, 46, C.red, { a: k01(t, 10.9, 11.2) }); txt('不到 1 秒', 120, 588, 46, C.red, { a: k01(t, 11.0, 11.3) }); }
      txt('按 15 公里/时：每秒约 4.2 米', 120, 1170, 30, C.sub, { font: BODY, a: k01(t, 10.4, 10.7) });
      cat('擦汗', 210, 1050, 190, t - 11.3);
    }],
    // 3 留出一个车门宽
    [12.6, 18.4, (lt, t) => {
      const doorA = k01(t, 15.4, 15.8), path = k01(t, 13.0, 14.0);
      streetTop(doorA, 1);
      g.save(); g.setLineDash([22, 16]); g.strokeStyle = C.green; g.lineWidth = 9; g.beginPath(); g.moveTo(PATH, 1210); g.lineTo(PATH, 1210 - 790 * path); g.stroke(); g.restore();
      riderTop(PATH, 1150 - 640 * k01(t, 13.4, 18.0), 1);
      dimH(PATH, CL, 1060, C.green, k01(t, 14.2, 14.5)); txt('≥ 1 米', (PATH + CL) / 2, 1010, 46, C.green, { align: 'center', a: k01(t, 14.3, 14.6) });
      if (t > 15.9) { tick(110, 540, 34, k01(t, 15.9, 16.2)); txt('门开了', 160, 520, 50, C.green, { a: k01(t, 16.0, 16.3) }); txt('也碰不到你', 160, 590, 50, C.green, { a: k01(t, 16.1, 16.4) }); }
      cat('点头指向', 200, 860, 260, lt - .4);
    }],
    // 4 两个信号：车里有人、刹车灯亮
    [18.4, 23.4, (lt, t) => {
      const s = 1.75, x0 = 560, gy = 1020, br = t > 20.6 ? (.75 + .25 * Math.sin((t - 20.6) * 9)) : 0;
      hline(0, gy + 2, W, gy - 2, 21, C.ink, 4, 1);
      carSide(x0, gy, s, { person: k01(t, 19.0, 19.3), brake: br });
      if (t > 19.3) { hcircle(x0 + 62 * s, gy - 145 * s, 72, 72, 9101, C.red, 6, k01(t, 19.3, 19.6)); txt('车里有人', x0 + 62 * s, 560, 54, C.red, { align: 'center', a: k01(t, 19.4, 19.7) }); }
      if (t > 20.6) { txt('刹车灯亮', 80, 760, 54, C.red, { a: k01(t, 20.6, 20.9) }); harrow(170, 800, 175, 820, 190, 840, C.red, k01(t, 20.7, 21.0), 6); }
      if (t > 21.8) { harrow(x0, gy + 30, x0 - 120, gy + 110, x0 - 260, gy + 130, C.green, k01(t, 21.8, 22.2), 8); txt('再离远一点', 80, gy + 150, 54, C.green, { a: k01(t, 22.0, 22.3) }); }
      cat('放大镜2', 190, 520, 230, lt - .3);
    }],
    // 5 太挤：减速 + 手放刹车
    [23.4, 28.0, (lt, t) => {
      const cx = 540, cy = 720, r = 220, v = 22 - 12 * eout(k01(t, 24.2, 25.6)), a = PI_ + PI_ * v / 30;
      g.save(); g.lineCap = 'round'; g.strokeStyle = C.grid; g.lineWidth = 30; g.beginPath(); g.arc(cx, cy, r, PI_, 0); g.stroke();
      g.strokeStyle = C.green; g.beginPath(); g.arc(cx, cy, r, PI_, PI_ + PI_ * 15 / 30); g.stroke();
      g.strokeStyle = C.red; g.lineWidth = 10; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * (r - 40), cy + Math.sin(a) * (r - 40)); g.stroke();
      g.fillStyle = C.ink; g.beginPath(); g.arc(cx, cy, 14, 0, 6.283); g.fill(); g.restore();
      txt(Math.round(v) + ' 公里/时', cx, cy + 70, 58, C.ink, { align: 'center' });
      if (t > 25.6) txt('慢下来', cx, cy - r - 70, 60, C.green, { align: 'center', a: k01(t, 25.6, 25.9) });
      // 车把右端：握把 + 刹车把手 + 李财的爪子
      const by = 1000, pr = k01(t, 26.0, 26.4);
      g.save(); g.lineCap = 'round'; g.strokeStyle = '#8c8478'; g.lineWidth = 20; g.beginPath(); g.moveTo(180, by); g.lineTo(760, by); g.stroke();
      g.fillStyle = C.ink; g.beginPath(); g.roundRect(740, by - 24, 170, 48, 22); g.fill();
      g.translate(735, by + 10); g.rotate(.45 - .3 * pr); g.strokeStyle = C.blue; g.lineWidth = 16; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(80, 20, 170, 14); g.stroke(); g.restore();
      paw(850, by + 52 - 22 * pr, 2.2, k01(t, 25.7, 26.0), C.pink);
      if (t > 26.4) txt('手放在刹车上', cx, by + 150, 52, C.blue, { align: 'center', a: k01(t, 26.4, 26.7) });
    }],
    // 6 结尾提问
    [28.0, 32.0, (lt, t) => {
      cat('打招呼', 520, 790, 560, lt - .1);
      g.save(); g.globalAlpha = k01(t, 28.6, 28.9); g.fillStyle = '#fff'; g.strokeStyle = C.ink; g.lineWidth = 5;
      g.beginPath(); g.roundRect(700, 470, 220, 130, 40); g.fill(); g.stroke(); g.beginPath(); g.moveTo(740, 598); g.lineTo(720, 650); g.lineTo(790, 598); g.fill(); g.stroke();
      txt('？', 810, 538, 80, C.orange, { align: 'center' }); g.restore();
      txt('关注李财，骑车不踩坑', 520, 1150, 46, C.sub, { align: 'center', a: k01(t, 29.6, 30.0) });
    }]
  ],
  cues: [['whoosh', .05], ['thud', HIT, .9], ['wrong', HIT + .05], ['stamp', 3.0], ['pop', 4.8], ['whoosh', 5.6], ['pop', 6.4], ['whoosh', 9.0], ['pop', 9.2], ['thud', 10.0, .5], ['pop', 10.2], ['pen', 13.0], ['pop', 14.2], ['pop', 15.4], ['ding', 15.9], ['pop', 19.0], ['ding', 19.3], ['bell', 20.6], ['pop', 21.8], ['grow', 24.2], ['ding', 25.6], ['pop', 26.0], ['pop', 28.1], ['ding', 28.6]],
  cover: (key, w, h) => epCover(key, w, h, { tag: '李财爱骑行 · 安全篇', l1: '骑车最怕的', l2: '开门杀！', sub: '离停着的车至少 1 米', emo: '被吓一跳', emoScale: .8,
    art: (x, y, s) => { carSide(x + 40 * s, y + 60 * s, .55 * s, { door: 1 }); } })
});

})();
</script>
</body>
</html>
