const k01 = tk01;
const SHOTS = [

  [14.6, 18.8, 'W', '每周骑三到五次'],

const withShots = tutFrames(SHOTS);
const LINES = [
  [0.1, 2.6, '天天骑车，怎么体重没变？'],
  [2.7, 5.4, '想靠骑车减脂，记住这几点。'],
  [5.8, 9.8, '{o}别骑太猛{/}：能说话、微微喘的强度最合适。'],
  [10.0, 14.4, '这样能骑得久，一次骑 40 分钟到一个小时。'],
  [14.6, 18.8, '{o}每周骑三到五次{/}，比周末一次骑很久更有用。'],
  [19.2, 23.4, '{o}坚持比强度重要{/}，一周一周慢慢加量。'],

  [32.5, 36.8, '{o}睡够觉{/}，减脂才稳。'],
  [37.0, 41.2, '{o}看长期{/}：别每天称体重，一个月看一次变化。'],
  [41.3, 45.2, '慢慢来，骑得开心，才能坚持下去。'],
  [45.6, 50.4, '口诀：{o}微微喘、常常骑、别吃回{/}。'],

function cup(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = '#d9b48a'; g.strokeStyle = C.ink; g.lineWidth = 5; g.beginPath(); g.moveTo(-50, -70); g.lineTo(50, -70); g.lineTo(38, 80); g.lineTo(-38, 80); g.closePath(); g.fill(); g.stroke(); g.beginPath(); g.moveTo(10, -70); g.lineTo(30, -120); g.stroke(); g.fillStyle = C.ink; [[-15, 50], [5, 60], [20, 45]].forEach(p => { g.beginPath(); g.arc(p[0], p[1], 8, 0, 6.283); g.fill(); }); g.restore(); }

  scenes: withShots([

    }],
    [14.5, 19.2, () => {}],
    [19.2, 28.0, (lt, t) => {
      if (t < 23.5) {
        const D = [30, 35, 40, 45, 50, 55]; D.forEach((d, i) => { const a = eout(k01(t, 19.4 + i * .3, 19.9 + i * .3)); if (a <= 0) return; const h = d * 8 * a; hatchBar(110 + i * 145, 1060 - h, 110, h, C.green, 2910 + i); txt('第' + (i + 1) + '周', 165 + i * 145, 1100, 32, C.sub, { align: 'center', a: a }); });

        return;

      g.save(); g.translate(260, 820); bike(0, 0, 1.3, t * 4, C.ink); g.restore(); txt('骑车消耗', 260, 1000, 46, C.green, { align: 'center' });
      txt('≈', 540, 820, 90, C.ink, { align: 'center', a: k01(t, 24.4, 24.7) });

    }],
    [28.0, 41.3, (lt, t) => {
      if (t < 32.5) {
        const S = [['蛋白质', .33, C.orange], ['蔬菜', .42, C.green], ['主食', .25, C.gold]]; let a0 = -Math.PI / 2;
        S.forEach((s, i) => { const a = k01(t, 28.4 + i * .5, 28.8 + i * .5); const a1 = a0 + 6.283 * s[1]; if (a > 0) { g.save(); g.globalAlpha = a; g.fillStyle = s[2]; g.beginPath(); g.moveTo(540, 800); g.arc(540, 800, 250, a0, a1); g.closePath(); g.fill(); g.restore(); const m = (a0 + a1) / 2; txt(s[0], 540 + Math.cos(m) * 150, 800 + Math.sin(m) * 150, 46, '#fff', { align: 'center', a: a }); } a0 = a1; });
        hcircle(540, 800, 260, 260, 2930, C.ink, 5, 1); txt('正常吃饭', 540, 490, 56, C.ink, { align: 'center', a: k01(t, 28.3, 28.6) });

    [45.4, 50.6, (lt, t) => tutSlogan(t, 46.4, ['微微喘', '常常骑', '别吃回'])],

});

})();
