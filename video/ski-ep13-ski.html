/* ───────── 俯视：双板，两块板沿局部 x，板头 +x，人朝 +x ─────────

    g.fillStyle = '#2a2f3a'; rrect(cx - 34, cy - 160, 68, 150, 24); g.fill();
    g.strokeStyle = COL.red; g.lineWidth = 12; g.beginPath(); g.ellipse(cx, cy - 210, 70, 60, 0, 0, Math.PI * 2); g.stroke(); g.restore();

  }

// D 魔毯
S.push(lt => {

// E 拖牵
