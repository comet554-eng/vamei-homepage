const T = [0, 8.0, 11.6, 30.0, 38.0, 46.0, 76.0, 97.0, 103.0, 110.0, 118.0, 124.5, 131.0, 138.0, 144.5];

/* ───────── 字幕 ───────── */

  { in: 11.8, out: 16.8, text: '为什么单板\n摔得这么突然？', y: YH, size: 80, w: 900 },
  { in: 12.6, out: 16.8, text: '单板有两条刃：\n脚尖一侧是前刃，脚跟一侧是后刃。', y: .235, size: 42, w: 500, sub: 1 },
  { in: 17.2, out: 22.8, text: '山下那条刃一碰到雪，\n就会被{r}"吃住"{/}。', y: YH, size: 76, w: 900 },
  { in: 18.2, out: 22.8, text: '板子瞬间停下，人却还在往前冲。', y: .235, size: 42, w: 500, sub: 1 },

/* ───────── 单板小人 ─────────
 * 视角：顺着雪板长度方向看过去（看到雪板的横截面 + 一点透视）。
 * 角度以雪面法线为 0°，向"面朝方向"为正；facing=1 面朝右（山下），-1 面朝左。*/
const RL = { ank: .25, shin: 1.0, thigh: 1.05, torso: 1.15, head: .37, headR: .21, uarm: .58, farm: .52 };
const RP = {
  ride: { shin: 22, thigh: -34, torso: 22, head: 12, uarm: 150, farm: 105 },
  low: { shin: 38, thigh: -84, torso: 38, head: 18, uarm: 145, farm: 100 },
  catchBack: { shin: 15, thigh: -40, torso: -10, head: -15, uarm: 205, farm: 198 },
  fallFwd: { shin: 30, thigh: -20, torso: 45, head: 20, uarm: 112, farm: 112 },
  sit: { shin: -25, thigh: -150, torso: -12, head: 40, uarm: 160, farm: 45 },
  sitPost: { shin: -25, thigh: -150, torso: -32, head: -40, uarm: 214, farm: 210 },
  sitFar: { shin: -80, thigh: -100, torso: -25, head: 15, uarm: 200, farm: 190 },
  sitPush: { shin: -25, thigh: -150, torso: -35, head: 20, uarm: 188, farm: 182 },
  kneel: { shin: 100, thigh: -5, torso: 22, head: 15, uarm: 140, farm: 95 },
  plank: { shin: 100, thigh: 55, torso: 86, head: 118, uarm: 180, farm: 90 },
  reach: { shin: 100, thigh: 30, torso: 75, head: 60, uarm: 160, farm: 160 }
};
const lerpPose = (a, b, k) => { const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; };
const withP = (p, ch) => Object.assign({}, p, ch);

function rider(F, th, pose, u, o = {}) {
  const facing = o.facing || 1, f0 = frameOf(th), fr = { d: [f0.d[0] * facing, f0.d[1] * facing], n: f0.n };
  const P = (s, h) => [F[0] + (fr.d[0] * s + fr.n[0] * h) * u, F[1] + (fr.d[1] * s + fr.n[1] * h) * u];
  const add = (p, deg, l) => { const v = dirOf(fr, deg); return [p[0] + v[0] * l * u, p[1] + v[1] * l * u]; };
  const sh = (p, k) => [p[0] + D[0] * k, p[1] + D[1] * k];
  const D = [-facing * .46 * u, -.3 * u]; // 指向画面深处的方向（雪板长度方向）
  const A = P(0, RL.ank + .03), K = add(A, pose.shin, RL.shin), Hp = add(K, pose.thigh, RL.thigh);
  const B = sh(Hp, .6), S = add(B, pose.torso, RL.torso), Hd = add(S, pose.head, RL.head), E = add(S, pose.uarm, RL.uarm), Hn = add(E, pose.farm, RL.farm);
  let piv = B;
  if (o.pivot === 'toe') piv = P(.34, 0); else if (o.pivot === 'heel') piv = P(-.34, 0); else if (Array.isArray(o.pivot)) piv = o.pivot;
  const ang = facing * (o.rot || 0) * D2R, ca = Math.cos(ang), sa = Math.sin(ang);
  const tf = p => [piv[0] + (p[0] - piv[0]) * ca - (p[1] - piv[1]) * sa, piv[1] + (p[0] - piv[0]) * sa + (p[1] - piv[1]) * ca];
  const J = { fr, P, A, K, Hp, B, S, Hd, E, Hn, D, u, facing, tf, pose };
  const col = c => o.mono || c;
  g.save(); g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.lineCap = 'round'; g.lineJoin = 'round';
  g.translate(piv[0], piv[1]); g.rotate(ang); g.translate(-piv[0], -piv[1]);
  const seg = (a, b, w, c) => { g.strokeStyle = col(c); g.lineWidth = w * u; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const poly = (pts, fill, stroke, lw) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); if (fill) { g.fillStyle = col(fill); g.fill(); } if (stroke) { g.strokeStyle = col(stroke); g.lineWidth = lw * u; g.stroke(); } };
  // 雪板顶面（向画面深处延伸）
  const a0 = sh(P(-.34, .1), -.75), b0 = sh(P(.34, .1), -.75), c0 = sh(b0, 2.75), d0 = sh(a0, 2.75);
  poly([a0, b0, c0, d0], COL.boardTop, '#5a4fd6', .03);
  const boot = (off, dark) => {
    const Ao = sh(A, off), c = dirOf(fr, pose.shin), pf = dirOf(fr, pose.shin + 90);
    const Q = (ka, kb) => [Ao[0] + (pf[0] * ka + c[0] * kb) * u, Ao[1] + (pf[1] * ka + c[1] * kb) * u];
    seg(sh(P(-.27, .11), off), Q(-.27, .62), .07, dark ? '#1c2028' : '#2a2f3a');
    poly([sh(P(-.22, .1), off), sh(P(.3, .1), off), sh(P(.33, .19), off), Q(.2, .12), Q(.19, .45), Q(-.19, .45), Q(-.22, .05), sh(P(-.24, .16), off)], dark ? '#27384c' : COL.boot, '#1d2a38', .03);
    seg(sh(P(.04, .2), off), Q(.2, .16), .06, '#1d222b');
  };
  // 远侧的腿和手臂
  seg(sh(S, .3), sh(E, .3), .17, COL.jacket2); seg(sh(E, .3), sh(Hn, .3), .15, COL.jacket2);
  g.fillStyle = col(COL.pants2); g.beginPath(); g.arc(...sh(Hn, .3), .09 * u, 0, Math.PI * 2); g.fill();
  seg(sh(A, 1.2), sh(K, 1.2), .25, COL.pants2); seg(sh(K, 1.2), sh(Hp, 1.2), .28, COL.pants2);
  boot(1.2, true);
  seg(Hp, sh(Hp, 1.2), .32, COL.pants);
  // 近侧的腿
  seg(A, K, .26, COL.pants); seg(K, Hp, .3, COL.pants);
  boot(0, false);
  // 躯干、头
  seg(B, S, .48, COL.jacket);
  g.fillStyle = col('#ffffff'); g.strokeStyle = col(COL.pants); g.lineWidth = .05 * u;
  g.beginPath(); g.arc(Hd[0], Hd[1], RL.headR * u, 0, Math.PI * 2); g.fill(); g.stroke();
  const fv = dirOf(fr, pose.head + 90), fa = Math.atan2(fv[1], fv[0]);
  g.strokeStyle = col(COL.amber); g.lineWidth = .1 * u; g.beginPath(); g.arc(Hd[0], Hd[1], RL.headR * u * .78, fa - .55, fa + .55); g.stroke();
  // 近侧手臂
  seg(S, E, .18, '#ff8a4f'); seg(E, Hn, .16, '#ff8a4f');
  g.fillStyle = col(COL.pants); g.beginPath(); g.arc(Hn[0], Hn[1], .1 * u, 0, Math.PI * 2); g.fill();
  // 雪板截面（离镜头最近）
  const fa0 = sh(P(-.34, 0), -.75), fb0 = sh(P(.34, 0), -.75);
  poly([fa0, fb0, b0, a0], COL.board, COL.boardDark, .025);
  g.fillStyle = col('#c9d3de'); [fa0, fb0].forEach(p => { g.beginPath(); g.arc(p[0], p[1], .04 * u, 0, Math.PI * 2); g.fill(); });
  g.restore();
  J.toeEdge = tf(fb0); J.heelEdge = tf(fa0);
  return J;
}

/* ───────── 场景 ───────── */
const S = [];
const ROT_EASE = x => ein(x);

// A 钩子：侧滑 → 后刃挂刃 → 往后摔、手去撑
const hookV = t => t < 2.4 ? lerp(650, 900, t / 2.4) : Math.max(0, 900 - (t - 2.4) * 6000);
const hookScroll = makeScroll(hookV, 0, 8.2);
S.push(lt => {
  const th = 20, F = [CX - 90, H * .58], sc = hookScroll(lt);
  drawSky(sc); drawSnowfall(lt, .8); drawSlope(F, th, sc);
  speedLines(F, th, lt, clamp(hookV(lt) / 900, 0, 1) * .7);
  const k = clamp((lt - 2.4) / .55, 0, 1);
  const pose = lt < 2.4 ? RP.ride : lerpPose(RP.ride, RP.catchBack, sm(k * 1.4));
  const shake = lt > 2.95 ? Math.max(0, 1 - (lt - 2.95) / .6) * 22 : 0;
  g.save(); g.translate((hash(Math.floor(lt * 30)) - .5) * shake, (hash(Math.floor(lt * 30) + 7) - .5) * shake);
  const J = rider(F, th, pose, 140, { facing: -1, rot: -84 * ROT_EASE(k), pivot: 'heel' });
  if (lt > 2.35 && lt < 2.9) spark(J.heelEdge, lt - 2.35);
  burst(...J.tf(J.Hd), lt - 2.95, 36, .7);
  g.restore();
  if (lt > 4.3) {
    const a = win(lt, 4.3, 7.9, .3, .3), hd = J.tf(J.Hd), hn = J.tf(J.Hn);
    ring(hn[0], hn[1], 52, COL.red, a, true); ring(hd[0], hd[1], 58, COL.red, a, true);
    g.save(); g.globalAlpha = a; label('手腕', hn[0] - 10, hn[1] - 90, 40, COL.red, 900); label('后脑勺', hd[0] + 20, hd[1] + 100, 40, COL.red, 900); g.restore();
  }
});
function spark(p, lt) {
  const a = Math.max(0, 1 - lt / .5);
  g.save(); g.globalAlpha = a; g.strokeStyle = COL.red; g.lineWidth = 6; g.lineCap = 'round';
  for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2, r1 = 18 + lt * 60, r2 = 50 + lt * 120; g.beginPath(); g.moveTo(p[0] + Math.cos(an) * r1, p[1] + Math.sin(an) * r1); g.lineTo(p[0] + Math.cos(an) * r2, p[1] + Math.sin(an) * r2); g.stroke(); }
  g.restore();
}
// B 标题
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 8, .8);
  pill('滑雪不难 · EP.02 · 单板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  const F = [CX - 20, H * .7], th = 12;
  drawSlope(F, th, lt * 60, { noProps: true });
  const J = rider(F, th, RP.sit, 125, { rot: -22 * sm((lt - .4) / .8), alpha: eout((lt - .2) / .4) });
  const k = pop(lt - 1.1); if (k > 0) markV(J.tf(J.Hd)[0] + 120, J.tf(J.Hd)[1] - 70, 46, 1, k);
});
// C 为什么突然
const cV = lt => lt < 5.6 ? 0 : lt < 7.6 ? 520 : 0;
const cScroll = makeScroll(cV, 0, 19);
S.push(lt => {
  if (lt < 11.4) {
    const th = 16, F = [CX - 90, H * .6], sc = cScroll(lt);
    drawSky(sc); drawSnowfall(lt + 11.6, .5); drawSlope(F, th, sc, { noProps: lt < 5.4 });
    speedLines(F, th, lt, cV(lt) ? .35 : 0);
    const k = clamp((lt - 7.7) / .65, 0, 1);
    const pose = lt < 7.6 ? RP.ride : lerpPose(RP.ride, RP.fallFwd, sm(k * 1.5));
    const J = rider(F, th, pose, 165, { rot: 80 * ROT_EASE(k), pivot: 'toe' });
    if (lt > 7.55 && lt < 8.1) spark(J.toeEdge, lt - 7.55);
    burst(...J.tf(J.Hd), lt - 8.35, 36, .7);
    // 两条刃的标注
    const ea = win(lt, 1.0, 5.4, .3, .3), eb = win(lt, 1.6, 5.4, .3, .3);
    if (ea > 0) { const p = J.toeEdge; g.save(); g.globalAlpha = ea; g.strokeStyle = COL.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + 120, p[1] + 150); g.stroke(); label('前刃', p[0] + 150, p[1] + 190, 44, COL.ink, 900); label('脚尖一侧', p[0] + 150, p[1] + 240, 32, COL.sub, 700); g.restore(); }
    if (eb > 0) { const p = J.heelEdge; g.save(); g.globalAlpha = eb; g.strokeStyle = COL.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] - 120, p[1] + 150); g.stroke(); label('后刃', p[0] - 150, p[1] + 190, 44, COL.ink, 900); label('脚跟一侧', p[0] - 150, p[1] + 240, 32, COL.sub, 700); g.restore(); }
    const da = win(lt, 6.4, 7.9, .3, .2);
    if (da > 0) { const p = J.toeEdge; g.save(); g.globalAlpha = da; arrow(p[0] + 90, p[1] + 150, p[0] + 12, p[1] + 20, COL.red, 6, 22); label('山下的刃', p[0] + 120, p[1] + 190, 38, COL.red, 900); g.restore(); }
    const ca = win(lt, 7.6, 11.3, .15, .3);
    if (ca > 0) { const p = J.toeEdge; g.save(); g.globalAlpha = ca; label('挂刃！', p[0] + 40, p[1] + 110, 52, COL.red, 900); g.restore(); }
    const ia = win(lt, 7.7, 9.6, .2, .4);
    if (ia > 0) { const s0 = [CX - 40, H * .36], fr = frameOf(th); g.save(); g.globalAlpha = ia; arrow(s0[0], s0[1], s0[0] + fr.d[0] * 280, s0[1] + fr.d[1] * 280, COL.amber, 8, 28); label('人还在往前冲', s0[0] + 170, s0[1] - 30, 36, COL.amber, 900); g.restore(); }
  } else {
    const l2 = lt - 11.4;
    drawSky(0); drawSnowfall(lt + 11.6, .5);
    const panel = (x, facing, title, sub, delay) => {
      const a = eout((l2 - delay) / .4); if (a <= 0) return;
      const pw = 450, ph = 640, px = x - pw / 2, py = H * .26;
      g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40);
      g.fillStyle = '#fff'; g.shadowColor = 'rgba(27,40,56,.12)'; g.shadowBlur = 40; rrect(px, py, pw, ph, 36); g.fill(); g.shadowBlur = 0;
      g.save(); rrect(px, py, pw, ph, 36); g.clip(); g.fillStyle = '#e9f1f8'; g.fillRect(px, py, pw, ph);
      const th = 12, F = [x - facing * 30, py + ph * .72];

    g.fillStyle = COL.pants; g.beginPath(); g.moveTo(-120, -80); g.lineTo(120, -80); g.lineTo(130, 60); g.lineTo(20, 70); g.lineTo(0, 0); g.lineTo(-20, 70); g.lineTo(-130, 60); g.closePath(); g.fill();
    g.fillStyle = COL.amber; g.beginPath(); g.ellipse(-60, -10, 46, 52, 0, 0, Math.PI * 2); g.fill(); g.beginPath(); g.ellipse(60, -10, 46, 52, 0, 0, Math.PI * 2); g.fill();
    rrect(-14, -78, 28, 60, 12); g.fill();
  }
  g.restore();
}
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 124.5, .5);
  const items = [['头盔', '护住后脑勺'], ['护腕', '护住手腕'], ['护臀', '护住尾骨']];
  items.forEach(([name, desc], i) => {
    const a = eout((lt - .3 - i * .5) / .4); if (a <= 0) return;
    const cw = 300, ch = 470, x = W * (.2 + i * .3), y = H * .27;
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40);
    g.fillStyle = '#fff'; g.shadowColor = 'rgba(27,40,56,.12)'; g.shadowBlur = 40; rrect(x - cw / 2, y, cw, ch, 32); g.fill(); g.shadowBlur = 0;
    gearIcon(i, x, y + 180, .95);
    label(name, x, y + 340, 52, COL.ink, 900); label(desc, x, y + 405, 32, COL.sub, 700);
    g.restore();
    const k = pop(lt - 1.2 - i * .6); if (k > 0) markV(x + cw / 2 - 40, y + 40, 30, 1, k);
  });
});
// I 口诀卡
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 131, .5);
  const a = eout(lt / .4), x = W * .08, y = H * .24, w = W * .84, h = H * .46;

});
// J 结尾
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 138, .7);

});

/* ───────── 封面 ───────── */
function coverArt(key, w, h) {
  drawSky(0); drawSnowfall(3, .7);
  const portrait = h > w;
  const title = (cx, y1, y2, size, subY, subSize, pillY, pillSize) => {
    pill('滑雪不难 · EP.02 · 单板', cx, pillY, pillSize, COL.amber, '#fff');
    label('单板摔跤', cx, y1, size, COL.ink, 900);
    g.font = `900 ${size}px ${SANS}`;
    const parts = [['别', COL.ink], ['用手撑', COL.red], ['！', COL.ink]], ws = parts.map(p => g.measureText(p[0]).width);
    let x = cx - ws.reduce((s, v) => s + v, 0) / 2;
    parts.forEach((p, i) => { label(p[0], x + ws[i] / 2, y2, size, p[1], 900); x += ws[i]; });
    label('向后摔 · 向前扑 · 起身，一次讲清', cx, subY, subSize, COL.sub, 700);
  };
  // 钩子里"往后倒、伸手去撑"的那一瞬间
  const art = (F, u) => {
    drawSlope(F, 16, 0, { noProps: true });
    const J = rider(F, 16, lerpPose(RP.ride, RP.catchBack, .85), u, { facing: -1, rot: -38, pivot: 'heel' });
    const hn = J.tf(J.Hn); ring(hn[0], hn[1], u * .34, COL.red, 1, true); markX(hn[0] + u * .62, hn[1] - u * .2, u * .26);
  };
  if (key === '9x16') { art([w * .2, h * .7], 170); title(CX, h * .27, h * .365, 160, h * .44, 44, h * .17, 42); }
  else if (key === '3x4') { art([w * .2, h * .85], 150); title(CX, h * .25, h * .375, 160, h * .475, 44, h * .11, 40); }
  else {
    art([w * .56, h * .74], key === '16x9' ? 160 : 135);
    const fade = g.createLinearGradient(0, 0, w * .6, 0); fade.addColorStop(0, 'rgba(248,251,253,.92)'); fade.addColorStop(.75, 'rgba(248,251,253,.75)'); fade.addColorStop(1, 'rgba(248,251,253,0)');
    g.fillStyle = fade; g.fillRect(0, 0, w * .6, h);
    const size = key === '16x9' ? 140 : 118;
    title(w * .29, h * .42, h * .58, size, h * .71, key === '16x9' ? 40 : 34, h * .25, key === '16x9' ? 38 : 34);
  }
}

/* ───────── 声音 ───────── */
function sound(K, c, DUR) {
  K.bed(8.0, DUR, t => t < 30 ? 'verse' : t < 46 ? 'tense' : t < 118 ? 'chorus' : t < 131 ? 'verse' : 'outro');
  K.wind(DUR, t => t < 2.4 ? .45 : t < 3 ? .45 * (1 - (t - 2.4) / .6) : (t > 17.2 && t < 19.2) ? .25 : 0);
  const scrape = t0 => K.noise(t0, .3, .5, 'bandpass', 3200, K.out, 1.5);
  scrape(2.4); K.wrong(2.45); K.thud(2.95); K.wrong(4.3);
  scrape(19.2); K.wrong(19.25); K.thud(19.95);
  K.thud(31.4, .8); K.tone(2600, 31.45, .05, .08, 'square'); K.wrong(31.6);
  K.thud(40.0, .9); K.wrong(40.1);
  [46 + 4.0, 46 + 10.4, 46 + 16.4, 46 + 23.6, 76 + 4.2, 76 + 10.6, 76 + 16.4, 97 + 3.4, 103 + 5.3, 110 + 5.6, 118 + 4.2, 124.5 + 1.2, 124.5 + 1.8, 124.5 + 2.4].forEach(K.ding);
  [97 + 2.4, 118 + .9, 76 + 10.2].forEach(K.wrong);
  K.noise(46 + 22.6, .6, .35, 'lowpass', 700); K.noise(46 + 22.9, 1.2, .12, 'bandpass', 900);
  K.noise(76 + 3.6, .5, .3, 'lowpass', 700);
  for (let i = 0; i < 4; i++) K.tone(780 + i * 90, 46 + .4 + i * .15, .15, .05, 'triangle');
  for (let i = 0; i < 3; i++) K.tone(780 + i * 90, 76 + .4 + i * .15, .15, .05, 'triangle');
  for (let i = 0; i < 3; i++) K.tone(880 + i * 110, 131 + .8 + i * 1.2, .25, .07, 'triangle');
  K.riser(44.6, 46.0, .12);
}

kitRun({
