/*

 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 29.6, 45.6, 61.6, 77.6, 93.6, 111.6, 118.6, 125.1];
const YH = .135, YB = .745;

const TX = [

  { in: 4.0, out: 7.8, text: '雪况变了，\n滑法也要{g}跟着变{/}。', y: YH, size: 84, w: 900 },
  { in: 8.25, out: 11.35, text: '雪况：硬雪、粉雪、\n烂雪怎么滑', y: .3, size: 92, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '读懂雪，滑得更稳', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 17.4, text: '早上：压雪车刚压过，\n{g}最好滑{/}。', y: YH, size: 80, w: 900 },
  { in: 12.6, out: 17.4, text: '雪面平整，像一道道灯芯绒。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 17.8, out: 23.4, text: '中午：被滑开、变软，\n堆成{a}雪包{/}。', y: YH, size: 80, w: 900 },
  { in: 18.6, out: 23.4, text: '天暖的时候更明显，雪变得又软又沉。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 23.8, out: 29.4, text: '下午、背阴处：\n变硬，甚至{r}结冰{/}。', y: YH, size: 80, w: 900 },
  { in: 24.6, out: 29.4, text: '温度一降，软雪冻住，发亮、发硬。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 29.8, out: 37.4, text: '硬雪、冰面：\n动作要{g}柔{/}。', y: YH, size: 84, w: 900 },

  { in: 105.8, out: 111.4, text: '常见错误三：\n烂雪里{r}腿伸直{/}', y: YH, size: 80, w: 900 },
  { in: 106.6, out: 111.4, text: '雪包一绊，整个人被顶起来。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 118.8, out: 999, text: '你最怕\n哪一种雪？', y: .37, size: 88, w: 900, st: .06 },
  { in: 119.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];

/* ───────── 雪面 ───────── */
const TH = 10;
function surface(type, F, th, sc, t) {
  const fr = frameOf(th), at = s => [F[0] + fr.d[0] * s, F[1] + fr.d[1] * s], dn = (p, h) => [p[0] - fr.n[0] * h, p[1] - fr.n[1] * h];
  g.save();
  if (type === 'groom') {
    g.strokeStyle = '#d3e0ea'; g.lineWidth = 5; g.lineCap = 'round';
    const off = ((sc % 28) + 28) % 28; for (let k = -80; k <= 80; k++) { const p = at(k * 28 - off); for (let r = 0; r < 4; r++) { const a = dn(p, 8 + r * 34), b = dn(p, 22 + r * 34); g.globalAlpha = 1 - r * .22; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }
  } else if (type === 'ice') {
    const p0 = at(-3000), p1 = at(3000); g.fillStyle = 'rgba(150,200,240,.4)'; g.beginPath(); g.moveTo(...p0); g.lineTo(...p1); g.lineTo(p1[0], p1[1] + 900); g.lineTo(p0[0], p0[1] + 900); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 6; g.lineCap = 'round';
    for (let k = -20; k <= 20; k++) { const s = k * 170 - ((sc % 170) + 170) % 170 + hash(k) * 40, a = dn(at(s), 14 + hash(k + 3) * 40), b = dn(at(s + 70 + hash(k) * 60), 14 + hash(k + 3) * 40); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
    for (let k = 0; k < 10; k++) { const s = ((k * 230 - sc * .9) % 2000 + 2000) % 2000 - 1000, p = dn(at(s), 8), tw = .5 + .5 * Math.sin(t * 6 + k * 2); g.globalAlpha = tw; g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 4 : 14, a = i * Math.PI / 4; g.lineTo(p[0] + Math.cos(a) * r, p[1] - 14 + Math.sin(a) * r); } g.closePath(); g.fill(); }

    const off = ((sc % 120) + 120) % 120;
    for (let k = -30; k <= 30; k++) { const kk = k + Math.floor(sc / 120), s = k * 120 - off + hash(kk) * 50, p = at(s), r = 34 + hash(kk + 5) * 34;
      g.fillStyle = '#efe9df'; g.strokeStyle = '#cfc6b8'; g.lineWidth = 3; g.beginPath(); g.ellipse(p[0], p[1] + 4, r * 1.3, r * .7, th * D2R, Math.PI, 0); g.closePath(); g.fill(); g.stroke(); }
  }

}
function powderFront(F, th, u, depth, sc, t) { // 盖在板和鞋上的粉雪
  const fr = frameOf(th), at = s => [F[0] + fr.d[0] * s, F[1] + fr.d[1] * s];
  g.save(); g.fillStyle = '#ffffff'; g.strokeStyle = '#dbe6ef'; g.lineWidth = 4; g.beginPath();
  for (let i = 0; i <= 120; i++) { const s = -1400 + i * 24, p = at(s), h = depth * u * (.85 + .15 * Math.sin((s + sc) / 60) + .1 * Math.sin((s + sc) / 23)); const q = [p[0] + fr.n[0] * h, p[1] + fr.n[1] * h]; i ? g.lineTo(...q) : g.moveTo(...q); }
  const e = at(1500), b = at(-1400); g.lineTo(e[0], e[1] + 900); g.lineTo(b[0], b[1] + 900); g.closePath(); g.fill(); g.stroke();
  // 扬起的粉雪
  for (let i = 0; i < 26; i++) { const ph = (t * 1.2 + hash(i)) % 1, p = at(-1.6 * u - ph * 300), h = depth * u + ph * (60 + hash(i + 2) * 140); g.globalAlpha = (1 - ph) * .9; g.fillStyle = '#fff'; g.beginPath(); g.arc(p[0] + fr.n[0] * h, p[1] + fr.n[1] * h, 14 + hash(i + 4) * 22 + ph * 20, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
const SNOWLABEL = { groom: ['压过的雪 · 灯芯绒', COL.green], slush: ['烂雪 · 雪包', COL.amber], ice: ['硬雪 · 冰面', COL.blue] };
function sideScene(type, lt, o = {}) {
  const th = TH, F = o.F || [CX - 20, H * .6], sc = lt * (o.spd || 220), u = o.u || 160;
  drawSky(0); drawSnowfall(lt, type === 'powder' ? 1 : .3); drawSlope(F, th, sc, { noProps: true });
  if (type !== 'powder') surface(type, F, th, sc, lt);
  let J;
  if (type === 'slush') { const v = .5 + .35 * Math.sin(lt * 5.3) + .15 * Math.sin(lt * 8.1), p = o.pose || lerpPose(POSES.deep, POSES.neutral, v); J = drawSkier([F[0], F[1] - Math.abs(Math.sin(lt * 5.3)) * 4], th, p, u); }
  else J = drawSkier(F, th - (o.pitch || 0), o.pose || POSES.neutral, u);
  if (type === 'powder') powderFront(F, th, u, o.depth || .5, sc, lt);
  return J;
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：同一条道，三种样子
S.push(lt => {
  const type = lt < 2.6 ? 'groom' : lt < 5.2 ? 'slush' : 'ice';
  sideScene(type, lt, { pose: POSES.neutral });
  const [t1, c] = SNOWLABEL[type]; pill(['早上', '中午', '下午'][type === 'groom' ? 0 : type === 'slush' ? 1 : 2] + ' · ' + t1, CX, H * .29, 40, c, '#fff');
});
// B 标题
S.push(lt => {
  sideScene('powder', lt + 3, { u: 150, F: [CX, H * .74], depth: .3, pose: POSES.neutral });
  g.fillStyle = 'rgba(247,250,252,.25)'; g.fillRect(0, 0, W, H * .5);
  pill('滑雪不难 · EP.10 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
});
// C 一天里的变化
S.push(lt => {
  const seg = lt < 6 ? 0 : lt < 12 ? 1 : 2, type = ['groom', 'slush', 'ice'][seg];
  sideScene(type, lt, { pose: seg === 1 ? null : POSES.neutral });
  // 时间轴
  const x0 = W * .12, x1 = W * .88, y = H * .27, k = clamp(lt / 18, 0, 1);
  g.save(); g.strokeStyle = 'rgba(27,40,56,.18)'; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  g.strokeStyle = COL.amber; g.beginPath(); g.moveTo(x0, y); g.lineTo(lerp(x0, x1, k), y); g.stroke(); g.restore();
  const sx = lerp(x0, x1, k), sy = y - 60 - Math.sin(k * Math.PI) * 50; glow(sx, sy, 70, '255,190,60', .7); g.fillStyle = '#ffc23d'; g.beginPath(); g.arc(sx, sy, 26, 0, Math.PI * 2); g.fill();
  ['早上', '中午', '下午'].forEach((t, i) => label(t, lerp(x0, x1, i / 2), y + 44, 32, i === seg ? COL.ink : COL.sub, i === seg ? 900 : 700));
  const [t1, c] = SNOWLABEL[type]; pill(t1, CX, H * .7, 34, c, '#fff');
});
// D 冰面：柔
function forceCard(x, y, w, h, k) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.94)'; g.shadowColor = 'rgba(27,40,56,.1)'; g.shadowBlur = 20; rrect(x - 20, y - 50, w + 40, h + 90, 24); g.fill(); g.shadowBlur = 0;
  label('立刃用的力', x, y - 22, 28, COL.sub, 700, 'left');
  const curve = (fn, col, kk) => { g.strokeStyle = col; g.lineWidth = 6; g.beginPath(); for (let i = 0; i <= 60; i++) { const t = i / 60 * kk; const xx = x + t * w, yy = y + h - fn(t) * h; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); };
  curve(t => t < .25 ? 0 : t < .32 ? sm((t - .25) / .07) : 1 - .2 * sm((t - .5) / .3), COL.red, k); curve(t => sm(t / .9) * .85, COL.green, k);
  label('猛：一下咬不住', x + w, y - 22, 26, COL.red, 900, 'right'); label('柔：慢慢加力', x + w, y + h + 22, 26, COL.green, 900, 'right');
  g.restore();
}
S.push(lt => {
  if (lt < 8) {
    const J = sideScene('ice', lt, { spd: 200 }); forceCard(W * .14, H * .66 - 40, W * .72, 90, clamp((lt - .6) / 5, 0, 1));
    label('嘎嘎…', J.Hd[0] + 220, J.Hd[1] + 60, 40, COL.blue, 900);
  } else {
    const l2 = lt - 8, J = sideScene('ice', lt, { spd: 140, pose: POSES.neutral }); { const a = sm((l2 - .4) / .4), c = J.P(.1, 0); g.save(); g.globalAlpha = a; g.setLineDash([10, 8]); g.strokeStyle = COL.green; g.lineWidth = 4; g.beginPath(); g.moveTo(J.com[0], J.com[1]); g.lineTo(c[0], c[1]); g.stroke(); g.setLineDash([]); g.fillStyle = COL.green; g.beginPath(); g.arc(J.com[0], J.com[1], 14, 0, Math.PI * 2); g.fill(); label('重心在脚掌中间 · 上身安静', c[0] + 20, c[1] + 70, 32, COL.green, 900); g.restore(); }
    label(`${Math.round(lerp(26, 16, sm((l2 - .3) / 2)))} km/h`, W * .8, H * .27, 52, COL.green, 900);
  }
});
// E 粉雪
const BACKP = POSES.neutral;
S.push(lt => {
  if (lt < 8) {
    snowFront(lt * 160);
    const F = [CX, H * .58], u = 200; frontV(F, Object.assign({}, FV.parallel, { stance: .22 }), u);
    // 粉雪埋到小腿
    g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#dbe6ef'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) g.lineTo(x, F[1] - .38 * u + Math.sin((x + lt * 200) / 70) * 10 + Math.sin(x / 23) * 5); g.lineTo(W, H); g.closePath(); g.fill(); g.stroke();
    for (let i = 0; i < 18; i++) { const ph = (lt * 1.1 + hash(i)) % 1, x = CX + (hash(i + 3) - .5) * 600, y = F[1] - .4 * u - ph * 160; g.globalAlpha = (1 - ph) * .8; g.beginPath(); g.arc(x, y, 14 + hash(i) * 20 + ph * 16, 0, Math.PI * 2); g.fill(); }
    g.restore();
    const a = sm((lt - .8) / .4); [-1, 1].forEach(sd => { const x = F[0] + sd * .22 * u; g.save(); g.globalAlpha = a; arrow(x + sd * 120, F[1] - 1.9 * u, x + sd * 40, F[1] - 1.0 * u, COL.green, 8, 26); label('50%', x + sd * 160, F[1] - 2.0 * u, 52, COL.green, 900); g.restore(); });
    const a2 = sm((lt - 3) / .4); g.save(); g.globalAlpha = a2; pill('两块板当成一块', CX, H * .66, 38, COL.green, '#fff'); g.restore();
  } else {
    const l2 = lt - 8, slow = sm((l2 - 3) / 1.5), spd = lerp(260, 40, slow), depth = lerp(.5, .95, slow);
    sideScene('powder', lt, { pose: BACKP, pitch: 3 * (1 - slow), depth, spd });
    label(`${Math.round(lerp(22, 4, slow))} km/h`, W * .8, H * .27, 52, slow > .5 ? COL.red : COL.green, 900);
    if (slow > .5) { g.save(); g.globalAlpha = sm((slow - .5) / .3); label('陷住了', CX, H * .33, 48, COL.red, 900); g.restore(); }
  }
});
// F 烂雪
S.push(lt => {
  if (lt < 8) { const J = sideScene('slush', lt); ring(J.K[0], J.K[1], 46, COL.green, 1); label('腿放软', J.K[0] + 80, J.K[1] - 70, 36, COL.green, 900, 'left'); }
  else {

  }
});
// G 怎么判断
S.push(lt => {
  drawSky(0); drawSnowfall(lt + 77, .4);
  const items = [
    ['看颜色', '发亮、发蓝', '多半是冰', COL.blue, 0],
    ['听声音', '"嘎嘎"响', '硬雪', COL.blue, 1.4],
    ['看时间', '中午软、下午硬', '背阴处更硬', COL.amber, 2.8],
    ['先试一趟', '简单道上', '摸清今天的雪', COL.green, 8.4]

  items.forEach(([t1, t2, t3, c, d], i) => {
    const a = eout((lt - .4 - d) / .4); if (a <= 0) return; const col = i % 2, row = Math.floor(i / 2), x = W * (.27 + col * .46), y = H * (.3 + row * .2);
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 30); g.fillStyle = '#fff'; g.shadowColor = 'rgba(27,40,56,.12)'; g.shadowBlur = 30; rrect(x - 220, y - 150, 440, 300, 34); g.fill(); g.shadowBlur = 0;
    pill(t1, x, y - 90, 36, c, '#fff'); label(t2, x, y, 44, COL.ink, 900); label(t3, x, y + 70, 34, COL.sub, 700); g.restore();
  });
});
// H 三个错误
S.push(lt => {
  const seg = lt < 6 ? 0 : lt < 12 ? 1 : 2, l2 = lt - seg * 6;
  if (seg === 0) {
    const k = ein(clamp((l2 - 1) / 1.2, 0, 1)), J = sideScene('ice', lt, { spd: 200 * (1 - k * .6), pose: lerpPose(POSES.neutral, POSES.fallen, k) });
    if (l2 > .6 && l2 < 2) { g.save(); g.globalAlpha = win(l2, .6, 2, .2, .3); label('急刹！', CX + 200, H * .3, 52, COL.red, 900); g.restore(); }
    if (k > .3) label('刃一滑', J.P(0, 0)[0] + 200, J.P(0, 0)[1] + 90, 36, COL.red, 900);
  } else if (seg === 1) {
    const k = sm((l2 - .6) / 1.2), J = sideScene('powder', lt, { spd: 220, pose: lerpPose(POSES.neutral, POSES.back, k), pitch: 8 * k, depth: .5 });
    const m = mid(J.K, J.Hp); glow(m[0], m[1], 100, '240,71,60', .7 * k); if (k > .5) label('大腿烧起来', m[0] - 250, m[1] - 40, 36, COL.red, 900);
  } else {
    const ph = (l2 % 1.6) / 1.6, hop = 70 * Math.max(0, Math.sin(Math.min(1, Math.max(0, ph - .2) / .4) * Math.PI));
    drawSky(0); const F = [CX - 20, H * .6], sc = lt * 220; drawSlope(F, TH, sc, { noProps: true }); surface('slush', F, TH, sc, lt);
    const fr = frameOf(TH); drawSkier([F[0] + fr.n[0] * hop, F[1] + fr.n[1] * hop], TH, { shin: 4, thigh: -4, torso: 6, head: 6, uarm: 165, farm: 140, pole: 195 }, 160);

  else if (key === '3x4') { art(CX, h * .7, 125); title(CX, h * .17, h * .265, 112, h * .325, 36, h * .07, 40); }
  else {

function sound(K, c, DUR) {

  const slush = (a, b) => { for (let t = a; t < b; t += .3) K.noise(t, .35, .06, 'lowpass', 900); };

  slush(2.6, 5.2); scrape(5.2, 8); puff(8, 11.6);
  slush(17.6, 23.6); scrape(23.6, 29.6); scrape(29.6, 45.6); puff(45.6, 61.6); slush(61.6, 77.6);
  K.ding(5.0); [29.6 + 1.2, 45.6 + 1.6, 61.6 + 1.2, 77.6 + 1, 77.6 + 2.4, 77.6 + 3.8, 77.6 + 9.4].forEach(K.ding);
  K.wrong(45.6 + 8 + 3.6);
  [93.6 + .3, 99.6 + .3, 105.6 + .3].forEach(K.wrong); K.thud(93.6 + 2.3, .6); K.thud(99.6 + 3.1, .5);
  for (let i = 0; i < 3; i++) K.tone(880 + i * 110, 111.6 + .8 + i * 1.2, .25, .07, 'triangle');
  K.riser(92.2, 93.6, .12);
}
