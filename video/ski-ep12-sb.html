(() => {
'use strict';
const T = [0, 8.0, 11.6, 25.6, 41.6, 61.6, 83.6, 93.6, 111.6, 118.6, 125.1];
const YH = .135, YB = .745;

/* ───────── 俯视：单板，板沿局部 x，板头 +x，前刃 +y ─────────
 * o.back：后脚位置 'bound' | 'pad' | [x, y]（局部，单位 s）。*/
function topSB(x, y, ang, s, o = {}) {
  g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  g.fillStyle = COL.board; rrect(-110 * s, -30 * s, 220 * s, 60 * s, 28 * s); g.fill();
  g.fillStyle = '#2a2f3a'; rrect(42 * s, -24 * s, 30 * s, 48 * s, 8 * s); g.fill(); rrect(-72 * s, -24 * s, 30 * s, 48 * s, 8 * s); g.fill();
  if (o.pad) { g.fillStyle = 'rgba(18,166,121,.85)'; rrect(-34 * s, -16 * s, 30 * s, 32 * s, 6 * s); g.fill(); }
  const back = o.back || 'bound', boot = (bx, by, c) => { g.fillStyle = c || COL.boot; g.beginPath(); g.ellipse(bx, by, 16 * s, 26 * s, 0, 0, Math.PI * 2); g.fill(); };
  boot(57 * s, 0);
  const bp = back === 'bound' ? [-57, 0] : back === 'pad' ? [-19, 0] : back; boot(bp[0] * s, bp[1] * s, back === 'bound' || back === 'pad' ? null : '#4a5f78');
  const cx = back === 'bound' || back === 'pad' ? (57 + bp[0]) / 2 * s : 20 * s;
  g.fillStyle = o.jacket || COL.jacket; g.beginPath(); g.ellipse(cx, back === 'bound' || back === 'pad' ? 0 : bp[1] * s * .4, 30 * s, 16 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 3 * s; g.beginPath(); g.arc(cx, 0, 12 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = COL.amber; g.beginPath(); g.arc(cx, 10 * s, 5 * s, 0, Math.PI * 2); g.fill();
  g.restore();
}
function bg() { g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H); g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } }

/* 魔毯（俯视）：竖着的一条传送带，往画面上方走 */
function carpet(x, w, sc, y0, y1) {
  y0 = y0 == null ? H * .22 : y0; y1 = y1 == null ? H * .7 : y1;
  g.save(); g.fillStyle = '#3c4a5c'; g.fillRect(x - w / 2, y0, w, y1 - y0); g.beginPath(); g.rect(x - w / 2, y0, w, y1 - y0); g.clip(); g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 6;
  const off = ((sc % 60) + 60) % 60; for (let y = y1 + 60 - off; y > y0 - 60; y -= 60) { g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x + w / 2, y); g.stroke(); } g.restore();
  g.save(); g.fillStyle = '#c9d6e2'; g.fillRect(x - w / 2 - 16, y0, 16, y1 - y0); g.fillRect(x + w / 2, y0, 16, y1 - y0); g.restore();
}

/* 侧面：缆车椅子 + 坐着的人（面朝右，板朝前挂在前脚上） */
function chair(cx, cy, s, o = {}) {
  const u = s; g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = '#6f7f92'; g.lineWidth = 10 * u; g.beginPath(); g.moveTo(cx, cy - 330 * u); g.lineTo(cx, cy - 240 * u); g.quadraticCurveTo(cx - 120 * u, cy - 220 * u, cx - 110 * u, cy - 40 * u); g.lineTo(cx - 110 * u, cy); g.stroke();
  g.fillStyle = '#6f7f92'; rrect(cx - 18 * u, cy - 346 * u, 36 * u, 24 * u, 6 * u); g.fill();
  g.fillStyle = '#4f5f73'; rrect(cx - 110 * u, cy - 8 * u, 190 * u, 22 * u, 8 * u); g.fill(); rrect(cx - 124 * u, cy - 150 * u, 22 * u, 150 * u, 8 * u); g.fill();
  if (o.person !== false) {
    const hip = [cx - 70 * u, cy - 30 * u], knee = [cx + 60 * u, cy - 36 * u], ank = [cx + 70 * u, cy + 110 * u], sh = [cx - 82 * u, cy - 210 * u];
    g.strokeStyle = COL.pants; g.lineWidth = 46 * u; g.beginPath(); g.moveTo(...hip); g.lineTo(...knee); g.lineTo(...ank); g.stroke();
    g.strokeStyle = COL.jacket; g.lineWidth = 70 * u; g.beginPath(); g.moveTo(...hip); g.lineTo(...sh); g.stroke();
    g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 7 * u; g.beginPath(); g.arc(sh[0] + 16 * u, sh[1] - 66 * u, 36 * u, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = COL.amber; rrect(sh[0] + 26 * u, sh[1] - 76 * u, 28 * u, 16 * u, 6 * u); g.fill();
    g.strokeStyle = '#ff8a4f'; g.lineWidth = 24 * u; g.beginPath(); g.moveTo(sh[0], sh[1] + 20 * u); g.lineTo(sh[0] + 90 * u, sh[1] + 90 * u); g.stroke();
    // 板：挂在前脚上，朝前
    const bd = o.boardAng || 0; g.save(); g.translate(ank[0], ank[1] + 16 * u); g.rotate(bd); g.fillStyle = COL.board; rrect(-60 * u, -10 * u, 300 * u, 20 * u, 10 * u); g.fill(); g.restore();
    g.fillStyle = COL.boot; rrect(ank[0] - 26 * u, ank[1] - 30 * u, 64 * u, 46 * u, 10 * u); g.fill();
  }
  // 护栏
  const b = o.bar == null ? 0 : o.bar, piv = [cx - 6 * u, cy - 250 * u], ang = lerp(-1.25, .75, b), end = [piv[0] + Math.cos(ang) * 170 * u, piv[1] + Math.sin(ang) * 170 * u];
  g.strokeStyle = '#2a3442'; g.lineWidth = 9 * u; g.beginPath(); g.moveTo(...piv); g.lineTo(end[0], end[1]); g.lineTo(end[0] + 10 * u, end[1] + 190 * u * b); g.stroke();
  g.restore();
}
function cable(y0, y1) { g.save(); g.strokeStyle = '#4a5768'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, y0); g.lineTo(W, y1); g.stroke(); g.restore(); }

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：下缆车板一转就摔
S.push(lt => {
  bg(); const k = clamp(lt / 3, 0, 1), x = lerp(W * .3, W * .55, k), rot = lt < 1.2 ? 0 : ein(clamp((lt - 1.2) / 1, 0, 1)) * 1.4;
  g.fillStyle = '#e8eef4'; g.fillRect(0, H * .3, W, H * .45); label('下车坡道', W * .2, H * .33, 30, '#9aabbb', 700);
  topSB(x, H * .5, rot, 1.4, { back: rot > .1 ? [-20, 90] : [-19, 0] });
  if (lt > 2.2) { burst(x, H * .5, lt - 2.2); label('板一转……', x, H * .62, 44, COL.red, 900); }
});
// B 标题
S.push(lt => {
  drawSky(0); cable(H * .58, H * .48); chair(W * .55 + Math.sin(lt) * 4, H * .72, 1.2, { bar: 1 });
  pill('滑雪不难 · EP.12 · 单板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
});
// C 只绑前脚 / 防滑垫
S.push(lt => {
  bg();
  if (lt < 7) {
    const push = Math.sin(lt * 3), x = W * .32 + lt * 60;
    topSB(x, H * .46, 0, 2.2, { back: [-30 + push * 60, 110], pad: true });
    label('前脚：绑好', x + 125, H * .46 - 110, 36, COL.green, 900); label('后脚：松开，推着走', x - 80, H * .46 + 200, 34, COL.sub, 900);
  } else {
    const l2 = lt - 7, k = sm((l2 - .6) / .8), bx = lerp(-30, -19, k), by = lerp(110, 0, k);
    topSB(CX, H * .46, 0, 2.6, { back: k > .98 ? 'pad' : [bx, by], pad: true });
    if (k > .9) { ring(CX - 19 * 2.6, H * .46, 70, COL.green, 1); label('防滑垫', CX - 50, H * .46 + 150, 38, COL.green, 900); }
  }
});
// D 魔毯
S.push(lt => {
  bg(); carpet(CX, 300, lt * 160, lt < 8 ? H * .22 : H * .3, H * .7);
  if (lt < 8) {
    const y = H * .62 - (lt % 4) * 40;
    topSB(CX - 0, y, -Math.PI / 2, 1.4, { back: 'pad' }); markV(CX + 220, y - 60, 32, 1); label('板朝前', CX + 220, y + 20, 36, COL.green, 900);
    topSB(CX, H * .3, 0, 1.2, { back: 'pad', alpha: .9 }); markX(CX + 220, H * .3, 32, 1); label('横着站', CX + 220, H * .3 + 70, 34, COL.red, 900);
  } else {
    const l2 = lt - 8, k = clamp(l2 / 6, 0, 1); g.fillStyle = '#eef3f8'; g.fillRect(0, 0, W, H * .3); label('魔毯顶', CX, H * .27, 30, '#9aabbb', 700);
    const p = k < .5 ? [CX, lerp(H * .6, H * .28, k / .5)] : [lerp(CX, W * .82, sm((k - .5) / .4)), lerp(H * .28, H * .2, sm((k - .5) / .4))];
    topSB(p[0], p[1], k < .5 ? -Math.PI / 2 : lerp(-Math.PI / 2, 0, sm((k - .5) / .3)), 1.3, { back: 'pad' });
    topSB(CX, H * .62, -Math.PI / 2, 1.3, { back: 'pad', jacket: COL.blue });
    if (k > .7) label('马上让开 →', W * .66, H * .34, 36, COL.green, 900);
  }
});
// E 拖牵
function dragScene(lt, o = {}) {
  const th = -14, F = [CX - 40, H * .62], sc = lt * (o.spd == null ? 140 : o.spd); drawSky(0); drawSlope(F, th, -sc, { noProps: true });
  const fr = frameOf(th), u = 150, cabH = 3.6 * u;
  // 缆绳与立柱
  g.save(); g.strokeStyle = '#4a5768'; g.lineWidth = 5; const c0 = [F[0] - fr.d[0] * 2000 + fr.n[0] * cabH, F[1] - fr.d[1] * 2000 + fr.n[1] * cabH], c1 = [F[0] + fr.d[0] * 2000 + fr.n[0] * cabH, F[1] + fr.d[1] * 2000 + fr.n[1] * cabH]; g.beginPath(); g.moveTo(...c0); g.lineTo(...c1); g.stroke(); g.restore();
  const J = sbRider(F, th, o.pose || { hipS: .1, hipH: 1.55, lean: 4, armF: 150, armB: -125, look: .9 }, u);
  if (o.pole !== false) { const top = [J.Hc[0] + fr.d[0] * 1.6 * u + fr.n[0] * (cabH - J.u * 1.5), J.Hc[1] + fr.d[1] * 1.6 * u + fr.n[1] * (cabH - J.u * 1.5)];
    g.save(); g.strokeStyle = '#7a8899'; g.lineWidth = 8; g.beginPath(); g.moveTo(J.Hc[0], J.Hc[1]); g.lineTo(...top); g.stroke(); g.fillStyle = '#e04a3a'; g.beginPath(); g.ellipse(J.Hc[0] - fr.d[0] * 18, J.Hc[1] - fr.d[1] * 18, 34, 34, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  return J;
}
S.push(lt => {
  if (lt < 8) {
    const J = dragScene(lt); const a = sm((lt - .8) / .4); g.save(); g.globalAlpha = a; ring(J.Hc[0], J.Hc[1], 60, COL.green, a); label('盘子在两腿之间', J.Hc[0] - 260, J.Hc[1] + 30, 34, COL.green, 900); label('上坡 →', W * .82, H * .38, 30, '#9aabbb', 700); g.restore();
  } else if (lt < 14) {
    const l2 = lt - 8, J = dragScene(lt); const a = sm((l2 - .4) / .4); g.save(); g.globalAlpha = a; label('站着，别坐', J.Hd[0] + 230, J.Hd[1] + 40, 38, COL.green, 900); const fF = J.P(.55, .4); arrow(fF[0], fF[1] - 200, fF[0], fF[1] - 40, COL.amber, 7, 24); label('重心放前脚', fF[0] + 30, fF[1] - 240, 32, COL.amber, 900); g.restore();
  } else {
    const l2 = lt - 14; bg(); g.fillStyle = '#eef3f8'; g.fillRect(CX - 60, 0, 120, H * .62); label('拖牵道', CX, H * .64, 30, '#9aabbb', 700);
    const k = clamp(l2 / 5, 0, 1), p = [lerp(CX, W * .8, sm((k - .2) / .6)), lerp(H * .5, H * .3, sm(k / .6))]; topSB(p[0], p[1], lerp(-Math.PI / 2, -.3, sm((k - .2) / .5)), 1.3, { back: 'pad' });
    if (k > .6) label('往旁边滑开', W * .74, H * .4, 36, COL.green, 900);
  }
});
// F 缆车
S.push(lt => {
  if (lt < 6) {
    bg(); g.fillStyle = '#eef3f8'; g.fillRect(0, H * .5, W, 8); label('上车线', W * .14, H * .5 + 40, 30, COL.amber, 900); g.fillStyle = COL.amber; g.fillRect(0, H * .5, W, 8);
    topSB(CX, H * .46, -Math.PI / 2, 1.5, { back: 'pad' }); topSB(CX + 240, H * .46, -Math.PI / 2, 1.5, { back: 'pad', jacket: COL.blue });
    const cy = lerp(H * .9, H * .58, sm(lt / 5)); g.save(); g.fillStyle = 'rgba(79,95,115,.85)'; rrect(CX - 220, cy, 500, 60, 14); g.fill(); g.restore(); label('椅子从后面过来', CX + 30, cy + 110, 32, COL.sub, 900);
    label('板朝前', CX - 240, H * .4, 36, COL.green, 900);
  } else if (lt < 12) {
    const l2 = lt - 6; drawSky(0); cable(H * .5, H * .38); chair(W * .52, H * .66, 1.3, { bar: sm((l2 - 1) / 1.2) });
    if (l2 > 2.2) label('护栏放下', W * .52 + 220, H * .4, 38, COL.green, 900);
  } else if (lt < 18) {
    const l2 = lt - 12, th = 12, F = [lerp(W * .3, W * .62, sm(l2 / 5)), H * .6]; drawSky(0); drawSlope(F, th, l2 * 120, { noProps: true });
    const st = sm((l2 - .8) / 1), J = sbRider(F, th, lerpPose({ hipS: -.3, hipH: .9, lean: 10, armF: 120, armB: -120, look: .8 }, SP.neutral, st), 140);
    label('后脚踩在板上 · 站起来 · 直着滑', CX, H * .3, 36, COL.green, 900);
    g.save(); g.globalAlpha = 1 - st; chair(F[0] - 20, F[1] - 140 * (1 - st) - 60, 1, { person: false, bar: 0 }); g.restore();
  } else {
    bg(); g.fillStyle = '#e8eef4'; g.fillRect(CX - 200, 0, 400, H * .5); label('出口', CX, H * .2, 34, '#9aabbb', 700);
    const l2 = lt - 18, k = clamp(l2 / 3.4, 0, 1), p = [lerp(CX, W * .82, sm((k - .3) / .5)), lerp(H * .3, H * .6, sm(k / .5))]; topSB(p[0], p[1], Math.PI / 2 - .4 * sm(k), 1.3, { back: 'pad' });
    if (k > .7) label('到旁边再绑后脚', W * .7, H * .68, 34, COL.green, 900);
  }
});
// G 跟工作人员说 / 心里过一遍
S.push(lt => {

// H 三个错误

/* ───────── 封面 ───────── */
function coverArt(key, w, h) {
  drawSky(0);
  const art = (cx, cy, s) => { g.save(); g.strokeStyle = '#4a5768'; g.lineWidth = 5; g.beginPath(); g.moveTo(w > h ? w * .5 : 0, cy - 330 * s + 20); g.lineTo(w, cy - 330 * s - 50); g.stroke(); g.restore(); chair(cx, cy, s, { bar: 1 }); };
  const title = (cx, y1, y2, size, subY, subSize, pillY, pillSize) => {
    pill('滑雪不难 · EP.12 · 单板', cx, pillY, pillSize, COL.amber, '#fff');
    label('一下缆车就摔？', cx, y1, size, COL.ink, 900);
    g.font = `900 ${size * .6}px ${SANS}`; const parts = [['后脚', COL.ink], ['踩上板', COL.green], ['再站起来', COL.ink]], ws = parts.map(q => g.measureText(q[0]).width);
    let x = cx - ws.reduce((s, v) => s + v, 0) / 2; parts.forEach((q, i) => { label(q[0], x + ws[i] / 2, y2, size * .6, q[1], 900); x += ws[i]; });
    label('魔毯 · 拖牵 · 缆车 · 三个错误', cx, subY, subSize, COL.sub, 700);
  };
  if (key === '9x16') { title(CX, h * .24, h * .31, 116, h * .36, 40, h * .16, 42); art(w * .5, h * .78, 1.3); }
  else if (key === '3x4') { title(CX, h * .17, h * .26, 108, h * .32, 38, h * .07, 40); art(w * .5, h * .84, 1.05); }
  else {
    art(w * .74, h * .82, key === '16x9' ? 1.05 : .9);
    const fade = g.createLinearGradient(0, 0, w * .62, 0); fade.addColorStop(0, 'rgba(240,246,251,.96)'); fade.addColorStop(1, 'rgba(240,246,251,0)'); g.fillStyle = fade; g.fillRect(0, 0, w * .56, h);
    const size = key === '16x9' ? 104 : 82;
    title(w * .29, h * .43, h * .58, size, h * .7, key === '16x9' ? 36 : 30, h * .26, key === '16x9' ? 38 : 34);
  }
}
