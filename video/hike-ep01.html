<canvas id="c" width="1080" height="1920"></canvas>

<script>
/*
 * 徒步不难 EP.01《第一次徒步：选什么路线？》（约 2 分 06 秒）
 * 看懂三个数：距离、累计爬升、预计耗时。估时用的是常见的粗略算法（平路 4 公里 1 小时，每爬 300 米加 1 小时）。
 */
(() => {
'use strict';
const SRC = document.currentScript.textContent;
const T = [0, 8.0, 11.6, 17.6, 30.6, 50.6, 68.6, 78.6, 94.6, 112.6, 119.6, 126.1];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '看到一条路线：\n“才 {g}10 公里{/}嘛！”', y: YH, size: 84, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '结果爬了一整天，\n{r}天黑了还没下山{/}。', y: YH, size: 80, w: 900 },
  { in: 8.25, out: 11.35, text: '第一次徒步：\n选什么路线？', y: .3, size: 96, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '看懂三个数：距离、爬升、耗时', y: .415, size: 42, w: 600, sub: 1 },
  // C 三个数
  { in: 11.8, out: 17.4, text: '路线介绍里，\n先找这{a}三个数{/}。', y: YH, size: 80, w: 900 },
  { in: 12.6, out: 17.4, text: '徒步 App、攻略帖、景区指示牌上，一般都有。', y: YB, size: 42, w: 500, sub: 1 },
  // D 距离
  { in: 17.8, out: 23.6, text: '{g}距离{/}：一共要走多远。', y: YH, size: 80, w: 900 },
  { in: 18.6, out: 23.6, text: '平路上，普通人一小时\n大约走 {g}4 公里{/}。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 24.0, out: 30.4, text: '第一次，\n{g}5～10 公里{/}就够了。', y: YH, size: 84, w: 900 },
  { in: 24.8, out: 30.4, text: '注意是不是原路返回：\n“单程 5 公里”，来回就是 10 公里。', y: YB, size: 42, w: 500, sub: 1 },
  // E 爬升
  { in: 30.8, out: 36.6, text: '{a}爬升{/}：一共要往上爬多高。', y: YH, size: 76, w: 900 },
  { in: 31.6, out: 36.6, text: '累不累，主要看它。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 37.0, out: 43.6, text: '同样 10 公里，\n爬 {g}100 米{/}和爬 {r}800 米{/}', y: YH, size: 80, w: 900 },
  { in: 37.8, out: 43.6, text: '800 米，差不多是一口气\n爬 {r}260 多层楼{/}。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 44.0, out: 50.4, text: '新手先选\n{g}累计爬升 300 米以内{/}。', y: YH, size: 80, w: 900 },
  { in: 44.8, out: 50.4, text: '“累计”是把每一段上坡都加起来，\n常常比“山顶减山脚”还多。', y: YB, size: 42, w: 500, sub: 1 },
  // F 耗时
  { in: 50.8, out: 57.6, text: '{a}耗时{/}：自己估一估。', y: YH, size: 80, w: 900 },
  { in: 51.6, out: 57.6, text: '平路 {g}4 公里{/}算 1 小时，\n每往上爬 {a}300 米{/}，再加 1 小时。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 58.0, out: 63.6, text: '再多留出\n{a}一半{/}的时间。', y: YH, size: 84, w: 900 },
  { in: 58.8, out: 63.6, text: '休息、拍照、吃东西都要时间；\n新手下坡也快不起来。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 64.0, out: 68.4, text: '最要紧：\n{g}天黑前一小时{/}回到山下。', y: YH, size: 80, w: 900 },
  { in: 64.8, out: 68.4, text: '出发前查一下当天几点日落。', y: YB, size: 42, w: 500, sub: 1 },
  // G 再看三件事
  { in: 68.8, out: 78.4, text: '数字之外，\n再看{g}三件事{/}。', y: YH, size: 80, w: 900 },
  { in: 69.6, out: 78.4, text: '新手别走没人走的野路，也别一个人去。', y: YB, size: 42, w: 500, sub: 1 },
  // H 实际挑一条
  { in: 78.8, out: 84.6, text: '来，两条路线，\n第一次{a}挑哪条{/}？', y: YH, size: 80, w: 900 },
  { in: 85.0, out: 89.4, text: '套公式算一下：', y: YH, size: 80, w: 900 },
  { in: 85.6, out: 89.4, text: 'A：2 + 0.8 ≈ 3 小时\nB：3 + 3 = 6 小时，还没算休息', y: YB, size: 42, w: 500, sub: 1 },
  { in: 89.8, out: 94.4, text: '第一次，{g}选 A{/}。\nB 留到下次。', y: YH, size: 84, w: 900 },
  { in: 90.6, out: 94.4, text: '走得轻松，下次才还想来。', y: YB, size: 42, w: 500, sub: 1 },
  // I 三个错误
  { in: 94.8, out: 100.4, text: '常见错误一：\n{r}只看距离{/}', y: YH, size: 80, w: 900 },
  { in: 95.6, out: 100.4, text: '5 公里的陡坡，\n可能比 10 公里的平路还累。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 100.8, out: 106.4, text: '常见错误二：\n{r}中午才出发{/}', y: YH, size: 80, w: 900 },
  { in: 101.6, out: 106.4, text: '走到一半，太阳就下山了。\n山里比城里黑得早。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 106.8, out: 112.4, text: '常见错误三：\n{r}照搬别人的用时{/}', y: YH, size: 80, w: 900 },
  { in: 107.6, out: 112.4, text: '攻略里的“3 小时”，往往是常走的人的速度。\n新手按多一半来算。', y: YB, size: 42, w: 500, sub: 1 },
  // K 结尾
  { in: 119.8, out: 999, text: '你第一次徒步，\n走了多远？', y: .37, size: 84, w: 900, st: .06 },
  { in: 120.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const BLUE = COL.blue, GREEN = COL.green, AMB = COL.amber, RED = COL.red;
const CAD = 1.7; // 步伐：每秒相位（弧度/秒）的倍数
const walkPh = (t, k) => t * Math.PI * 2 * (k || .85);

/* ───────── A 钩子：山脚的牌子 → 大山与天黑 ───────── */
const GY = H * .66;
const bigMtn = x => GY - 980 * Math.exp(-Math.pow((x - W * 1.3) / (W * .42), 2)) - 120 * Math.exp(-Math.pow((x - W * .95) / (W * .14), 2));
function mtnTrail(hy, x0, x1, a) {
  g.save(); g.globalAlpha = a; g.strokeStyle = '#a77a4c'; g.lineWidth = 7; g.setLineDash([16, 12]); g.lineCap = 'round';
  g.beginPath(); for (let x = x0; x <= x1; x += 10) { const y = hy(x) + 16 + 10 * Math.sin(x * .03); x > x0 ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore();
}
function flag(x, y, s, t, c) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#5b4636'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -90); g.stroke();
  g.fillStyle = c || RED; g.beginPath(); g.moveTo(0, -90); for (let i = 1; i <= 10; i++) g.lineTo(i * 5.5, -90 + Math.sin(t * 6 + i * .7) * 4 * (i / 10)); for (let i = 10; i >= 0; i--) g.lineTo(i * 5.5, -58 + Math.sin(t * 6 + i * .7) * 4 * (i / 10)); g.closePath(); g.fill(); g.restore();
}
const S = [];
S.push(lt => {
  const dusk = sm((lt - 4.4) / 3.2), z = lerp(1, .5, sm((lt - 3.6) / 1.6)), px = W * .3, py = GY;
  hikeSky(dusk);
  const sun = [lerp(W * .78, W * .9, dusk), lerp(H * .3, H * .5, dusk)];
  hikeSun(sun[0], sun[1], 62, lt, dusk);
  hikeClouds(lt, 1 - dusk * .4, .2);
  hikeRidges(0, dusk, H * .56);
  g.save(); g.translate(px, py); g.scale(z, z); g.translate(-px, -py);
  hikeGround(bigMtn, 0, lt, { dusk, treeGap: 230, x0: -W * 1.2, x1: W * 2.2, yb: H * 2.2 });
  mtnTrail(bigMtn, W * .58, W * 1.3, sm((lt - 4) / .6));
  flag(W * 1.3, bigMtn(W * 1.3) + 6, 1.4, lt, RED);
  if (lt < 4.6) {
    signpost(W * .62, GY + 10, ['环线', '10 公里'], 1);
    drawHiker(W * .3, GY + 12, { s: 1.5, walk: 0, t: lt, ph: 0 });
    if (lt > 1.4) { const b = pop(lt - 1.4); g.save(); g.translate(W * .3 + 120, GY - 300); g.scale(b, b); g.fillStyle = '#fff'; rrect(-80, -50, 200, 90, 40); g.fill(); label('轻松～', 20, -5, 44, GREEN, 900); g.restore(); }
  } else {
    const xw = W * .66 + (lt - 4.6) * 40;
    hikerOn(bigMtn, xw, 0, { s: 1.5, ph: walkPh(lt, .55), walk: .8, tired: 1, t: lt, pole: true, lamp: sm((lt - 6.4) / .6) });
  }
  g.restore();
  if (dusk > 0) { g.fillStyle = `rgba(40,30,90,${dusk * .25})`; g.fillRect(0, 0, W, H); }
  if (lt > 5.8) { const a = sm((lt - 5.8) / .4); clockIcon(W * .16, H * .3, 56, 18.5 + (lt - 5.8) * .3, a); g.save(); g.globalAlpha = a; label('18:30', W * .16, H * .3 + 96, 42, '#fff', 900); g.restore(); }
});
// B 标题
S.push(lt => {
  hikeSky(0); hikeSun(W * .82, H * .5, 56, lt, 0); hikeClouds(lt + 8, 1, .14); birds(lt + 3, 1, 4, H * .44);
  hikeRidges(lt * 120, 0, H * .66);
  const hy = x => H * .8 + 22 * Math.sin(x * .004);
  hikeGround(hy, lt * 120, lt, {});
  hikerOn(hy, CX + lt * 120, lt * 120, { s: 1.3, ph: walkPh(lt), t: lt, pole: true });
  pill('徒步不难 · EP.01', CX, H * .19, 40, AMB, '#fff', eout(lt / .3));
});

/* ───────── C 路线卡片：三个数 ───────── */
const ROUTE = k => .5 + .4 * Math.sin(k * 7) * Math.sin(k * 2.2 + .4);
function routeCard(x, y, w, h, lt, hi, nums) {
  card(x, y, w, h, 40);
  const mh = h * .56;
  g.save(); rrect(x, y, w, h, 40); g.clip();
  g.fillStyle = '#e4f3e1'; g.fillRect(x, y, w, mh);
  // 等高线
  g.strokeStyle = 'rgba(80,150,90,.25)'; g.lineWidth = 3;
  for (let r = 1; r <= 5; r++) { g.beginPath(); g.ellipse(x + w * .62, y + mh * .45, r * 60, r * 38, -.3, 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = 'rgba(110,195,244,.6)'; g.beginPath(); g.moveTo(x, y + mh * .8); g.bezierCurveTo(x + w * .3, y + mh * .7, x + w * .5, y + mh, x + w * .9, y + mh); g.lineTo(x, y + mh); g.closePath(); g.fill();
  // 轨迹
  const pt = k => [x + w * (.14 + .72 * k), y + mh * (.78 - .52 * Math.sin(k * Math.PI) + .08 * Math.sin(k * 14))];
  const pr = clamp(lt / 2.4, 0, 1);
  g.strokeStyle = RED; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i <= 80; i++) { const p = pt(i / 80 * pr); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke();
  const s0 = pt(0); g.fillStyle = GREEN; g.beginPath(); g.arc(s0[0], s0[1], 16, 0, Math.PI * 2); g.fill(); label('起', s0[0], s0[1] - 40, 30, GREEN, 900);
  if (pr >= 1) { const e = pt(1); g.fillStyle = RED; g.beginPath(); g.arc(e[0], e[1], 16, 0, Math.PI * 2); g.fill(); }
  const pk = pt(.5); g.fillStyle = '#5b6b7c'; g.beginPath(); g.moveTo(pk[0], pk[1] - 50); g.lineTo(pk[0] - 26, pk[1] - 12); g.lineTo(pk[0] + 26, pk[1] - 12); g.closePath(); g.fill();
  g.restore();
  label('后山环线（示意）', x + 40, y + mh + 58, 40, COL.ink, 900, 'left');
  const items = [['距离', nums[0], '公里', GREEN], ['累计爬升', nums[1], '米', AMB], ['预计耗时', nums[2], '小时', BLUE]];
  const bw = (w - 80 - 40) / 3;
  items.forEach(([nm, v, u, c], i) => {
    const bx = x + 40 + i * (bw + 20), by = y + mh + 110, bh = h - mh - 140, on = hi === i || hi === 3;
    g.save(); g.fillStyle = on ? c : '#f2f6f9'; rrect(bx, by, bw, bh, 24); g.fill(); g.restore();
    label(v, bx + bw / 2, by + bh * .4, 64, on ? '#fff' : COL.ink, 900);
    label(u, bx + bw / 2, by + bh * .4 + 54, 30, on ? 'rgba(255,255,255,.9)' : COL.sub, 700);
    label(nm, bx + bw / 2, by + bh - 34, 30, on ? '#fff' : COL.sub, 700);
  });
}
S.push(lt => {
  hikeSky(0); hikeClouds(lt + 20, .9, .3);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, W, H);
  const a = eout(lt / .5);
  g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 80);
  const hi = lt < 2.6 ? -1 : lt < 3.4 ? 0 : lt < 4.2 ? 1 : lt < 5 ? 2 : 3;
  routeCard(W * .09, H * .22, W * .82, H * .47, lt, hi, ['10.2', '820', '6']);
  g.restore();
});

/* ───────── D 距离 ───────── */
S.push(lt => {
  if (lt < 6.2) {
    const cam = lt * 230, hy = x => H * .62 + 14 * Math.sin(x * .005);
    hikeSky(0); hikeSun(W * .85, H * .28, 50, lt, 0); hikeClouds(lt + 40, 1, .12); hikeRidges(cam, 0, H * .52);
    hikeGround(hy, cam, lt, { treeGap: 300 });
    // 公里牌
    const k0 = Math.floor(cam / 520);
    for (let k = k0; k <= k0 + 3; k++) {
      const xw = k * 520 + 300, xs = xw - cam; if (k < 1 || xs < -100 || xs > W + 100) continue;
      g.fillStyle = '#fff'; rrect(xs - 52, hy(xw) - 120, 104, 70, 14); g.fill(); g.strokeStyle = GREEN; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#8b5e3c'; g.fillRect(xs - 5, hy(xw) - 50, 10, 56);
      label(k + ' km', xs, hy(xw) - 85, 32, GREEN, 900);
    }
    hikerOn(hy, W * .34 + cam, cam, { s: 1.45, ph: walkPh(lt, 1.1), t: lt, pole: true });
    subPanel(win(lt, .6, 6.2, .3, .01));
    // 仪表
    const k = clamp((lt - .4) / 5.2, 0, 1);
    card(W * .1, H * .23, W * .8, 170, 40);
    clockIcon(W * .22, H * .23 + 85, 50, 8 + k, 1);
    label(`${Math.floor(k * 60) === 60 ? '1:00' : '0:' + String(Math.floor(k * 60)).padStart(2, '0')}`, W * .3, H * .23 + 85, 58, COL.ink, 900, 'left');
    label('→', W * .55, H * .23 + 85, 54, COL.sub, 900);
    label(`${(k * 4).toFixed(1)} 公里`, W * .63, H * .23 + 85, 58, GREEN, 900, 'left');
  } else {
    const l2 = lt - 6.2;
    hikeSky(0); hikeClouds(lt + 40, .9, .1);
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(0, 0, W, H);
    // 尺子：0～15 km
    const x0 = W * .1, x1 = W * .9, y = H * .3, km = v => lerp(x0, x1, v / 15);
    card(W * .05, H * .215, W * .9, H * .17, 40);
    g.fillStyle = '#e9eff4'; rrect(x0, y - 18, x1 - x0, 36, 18); g.fill();
    const ga = sm((l2 - .3) / .5); g.save(); g.globalAlpha = ga; g.fillStyle = GREEN; rrect(km(5), y - 18, km(10) - km(5), 36, 18); g.fill(); g.restore();
    for (let v = 0; v <= 15; v += 5) { label(v + '', km(v), y + 58, 34, COL.sub, 700); }
    label('公里', x1, y - 52, 30, COL.sub, 700, 'right');
    if (ga > 0) { g.save(); g.globalAlpha = ga; label('新手区', (km(5) + km(10)) / 2, y + 108, 36, GREEN, 900); g.restore(); }
    drawHiker(km(lerp(0, 8, sm((l2 - .2) / 1.4))), y - 22, { s: .6, ph: walkPh(lt, 1.2), walk: l2 < 1.6 ? 1 : 0, t: lt });
    // 原路返回：去 + 回
    const by = H * .62, hx = W * .14, tx = W * .86, hy2 = x => by - 200 * Math.exp(-Math.pow((x - tx) / 200, 2)) - 30 * Math.sin((x - hx) / (tx - hx) * Math.PI);
    card(W * .05, H * .41, W * .9, H * .27, 40);
    g.save(); rrect(W * .05, H * .41, W * .9, H * .27, 40); g.clip();
    g.fillStyle = '#e4f3e1'; g.beginPath(); g.moveTo(W * .05, H); for (let x = W * .05; x <= W * .95; x += 8) g.lineTo(x, hy2(x)); g.lineTo(W * .95, H); g.closePath(); g.fill();
    g.restore();
    // 小房子 = 起点，旗子 = 终点
    g.fillStyle = '#ff9f6b'; g.fillRect(hx - 30, hy2(hx) - 50, 60, 50); g.fillStyle = '#d9602b'; g.beginPath(); g.moveTo(hx - 42, hy2(hx) - 48); g.lineTo(hx, hy2(hx) - 86); g.lineTo(hx + 42, hy2(hx) - 48); g.closePath(); g.fill();
    flag(tx, hy2(tx), .8, lt, RED);
    const goA = sm((l2 - 1.6) / 1.4), backA = sm((l2 - 3.4) / 1.4);
    const arcPath = (kk, off) => { const x = lerp(hx + 50, tx - 30, kk); return [x, hy2(x) - off]; };
    function trailArrow(k0, k1, off, c, rev) {
      if (k1 <= k0) return; g.save(); g.strokeStyle = c; g.lineWidth = 8; g.lineCap = 'round'; g.setLineDash([16, 12]); g.beginPath();
      for (let i = 0; i <= 40; i++) { const kk = lerp(k0, k1, i / 40), p = arcPath(rev ? 1 - kk : kk, off); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke(); g.restore();
    }
    trailArrow(0, goA, 40, GREEN, false); trailArrow(0, backA, -40, BLUE, true);
    if (goA > .9) pill('去 5 公里', W * .38, by - 230, 34, GREEN, '#fff', sm((l2 - 2.9) / .3));
    if (backA > .9) pill('回 5 公里', W * .62, by + 40, 34, BLUE, '#fff', sm((l2 - 4.7) / .3));
    if (l2 > 5.2) { const b = pop(l2 - 5.2); g.save(); g.translate(CX, H * .45); g.scale(b, b); label('= 10 公里', 0, 0, 56, COL.ink, 900); g.restore(); }
  }
});

/* ───────── E 爬升 ───────── */
const flatP = k => .12 + .08 * Math.sin(k * 9) * .5 + .05 * k;
const steepP = k => .05 + .9 * Math.pow(Math.sin(k * Math.PI), 1.4) * (1 - .1 * Math.sin(k * 20));
const wavyP = k => { // 起点 1000 → 1100 → 1050 → 1130 → 1100 → 1200 （0~1 映射 1000~1250）
  const K = [0, .2, .35, .55, .68, .9, 1], V = [1000, 1100, 1050, 1130, 1100, 1200, 1200];
  let i = 0; while (i < K.length - 2 && k > K[i + 1]) i++;
  const f = sm((k - K[i]) / (K[i + 1] - K[i])); return (lerp(V[i], V[i + 1], f) - 980) / 260;
};
function building(x, yb, w, floors, shown, a) {
  g.save(); g.globalAlpha = a; const fh = 2.1, hgt = floors * fh;
