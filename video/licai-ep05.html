<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李财骑行记 EP.05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b2621;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100vw;max-height:100vh;aspect-ratio:16/9;object-fit:contain;cursor:pointer}
  body.render canvas{width:1920px;height:1080px;max-height:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="snowkit.js"></script>
<script src="licai-assets.js"></script>
<script src="licai-emo.js"></script>
<script src="licaikit.js"></script>
<script>
(() => {
'use strict';
const SRC = document.currentScript.textContent;
/*
 * 李财骑行记 EP.05《骑 10 公里，谁最划算？》（76 秒，横版 16:9，无旁白）
 * 开场 → 六位选手 → 时间 → 花费（铜钱）→ 热量（肉包）→ 成绩单 → 但是 → 下集
 */
const T = [0, 6, 14, 26, 38, 50, 62, 70, 76];
const S = [];

// 小图标（以中心为原点，宽约 120）
function icon(kind, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'bike') bikeType(0, 0, .36, 'flat', 0, C.green);
  else if (kind === 'share') { bikeType(0, 0, .36, 'city', 0, C.gold); g.fillStyle = C.ink; g.fillRect(30, -40, 16, 16); g.fillStyle = PAPER; g.fillRect(34, -36, 8, 8); }
  else if (kind === 'ebike') { bikeType(0, 0, .36, 'city', 0, C.blue); g.fillStyle = C.blue; g.fillRect(-16, -10, 22, 12); g.fillStyle = C.gold; g.beginPath(); g.moveTo(-2, -40); g.lineTo(-12, -24); g.lineTo(-4, -24); g.lineTo(-10, -10); g.lineTo(4, -28); g.lineTo(-4, -28); g.closePath(); g.fill(); }
  else if (kind === 'metro') { g.fillStyle = C.purple; g.beginPath(); g.roundRect(-56, -38, 112, 64, 14); g.fill(); g.fillStyle = PAPER; for (let i = 0; i < 3; i++) g.fillRect(-44 + i * 32, -28, 24, 20); g.fillStyle = C.gold; g.beginPath(); g.arc(46, 12, 5, 0, 6.283); g.fill(); g.fillStyle = C.ink; [-32, 32].forEach(wx => { g.beginPath(); g.arc(wx, 30, 9, 0, 6.283); g.fill(); }); }
  else if (kind === 'car') { g.fillStyle = C.orange; g.beginPath(); g.roundRect(-58, -12, 116, 34, 10); g.fill(); g.beginPath(); g.moveTo(-34, -12); g.lineTo(-20, -38); g.lineTo(24, -38); g.lineTo(40, -12); g.closePath(); g.fill(); g.fillStyle = PAPER; g.fillRect(-16, -32, 16, 16); g.fillRect(6, -32, 16, 16); g.fillStyle = C.ink; [-32, 32].forEach(wx => { g.beginPath(); g.arc(wx, 24, 12, 0, 6.283); g.fill(); }); }
  else if (kind === 'walk') { g.fillStyle = C.gray; g.beginPath(); g.moveTo(-50, 14); g.quadraticCurveTo(-52, -26, -22, -30); g.lineTo(-4, -8); g.quadraticCurveTo(40, -4, 52, 10); g.lineTo(52, 22); g.lineTo(-50, 22); g.closePath(); g.fill(); g.strokeStyle = PAPER; g.lineWidth = 3; for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-26 + i * 9, -22 + i * 5); g.lineTo(-16 + i * 9, -22 + i * 5); g.stroke(); } g.fillStyle = PAPER; g.fillRect(-50, 14, 102, 4); }
  g.restore();
}
// 肉包（frac = 显示比例）
function bun(x, y, s, frac, a) {
  g.save(); g.globalAlpha = a == null ? 1 : a; g.translate(x, y); g.scale(s, s);
  const full = clamp(frac, 0, 1);
  for (let pass = 0; pass < 2; pass++) {
  g.save(); if (pass) { g.beginPath(); g.rect(-40, -40, 80 * full, 80); g.clip(); } else g.globalAlpha *= .22;
  g.fillStyle = '#fbf3e2'; g.strokeStyle = '#b89a6a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-34, 18); g.quadraticCurveTo(-38, -24, 0, -28); g.quadraticCurveTo(38, -24, 34, 18); g.closePath(); g.fill(); g.stroke();
  for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(i * 3, -26); g.quadraticCurveTo(i * 9, -10, i * 14, 2); g.stroke(); }
  g.restore(); }
  g.restore();
}
const MD = [
  { n: '自行车', k: 'bike', c: C.green, t: 42, cost: 0, kcal: 240, say: '不花钱、不太慢、还锻炼' },
  { n: '共享单车', k: 'share', c: C.gold, t: 45, cost: 4.5, kcal: 260, say: '不用买车，偶尔骑很方便' },
  { n: '电动车', k: 'ebike', c: C.blue, t: 28, cost: .1, kcal: 20, say: '最快，但几乎不运动' },
  { n: '地铁', k: 'metro', c: C.purple, t: 45, cost: 4, kcal: 60, say: '不怕下雨，要走路换乘' },
  { n: '打车', k: 'car', c: C.orange, t: 30, cost: 30, kcal: 10, say: '舒服，但最贵' },
  { n: '走路', k: 'walk', c: C.gray, t: 120, cost: 0, kcal: 330, say: '最健康，就是太慢' }
];
const RY = i => 300 + i * 104;
function rows(lt) {
  MD.forEach((m, i) => { const a = clamp((lt - .5 - i * .12) / .3, 0, 1); if (a <= 0) return; g.save(); g.globalAlpha = a; icon(m.k, 150, RY(i) - 4, .8); g.restore(); txt(m.n, 240, RY(i), 44, C.ink, { a }); });
}

// A
S.push(lt => openScene(lt, '举旗欢呼', '骑 10 公里，', '谁最{o}划算{/}？', 5));

// B 六位选手
S.push(lt => {
  header(lt, '今天的六位选手', '同样去 10 公里外上班', C.orange);
  MD.forEach((m, i) => {
    const x = 200 + i * 300, ct = lt - .8 - i * .5; if (ct < 0) return;
    g.save(); g.translate(x, 520); g.scale(pop(ct), pop(ct)); icon(m.k, 0, 0, 1.9); g.restore();
    txt(m.n, x, 690, 48, C.ink, { align: 'center', a: clamp(ct / .3, 0, 1) });
  });
  if (lt > 4.4) typeText('比三样：{b}时间{/}、{o}花费{/}、{r}消耗{/}', 960, 840, 60, lt - 4.4, { cps: 12, align: 'center' });
  cat('张开双臂', 1790, 930, 230, lt - 5.6);
  footnote('口径：城市通勤、门到门、普通人；各城市票价不同，数字为示意估算', clamp((lt - 1) / .3, 0, 1));
});

// C 时间
S.push(lt => {
  header(lt, '谁最快到？', '条长 = 门到门要多少分钟（含找车、等车、走路）', C.blue);
  rows(lt);
  const X0 = 560, PX = 9;
  hline(X0, 250, X0, RY(5) + 60, 1311, C.ink, 3.5, (lt - .6) / .4);
  MD.forEach((m, i) => {
    const k = eout((lt - 1.2 - i * .35) / .8), w = m.t * PX * k; if (k <= 0) return;
    hatchBar(X0, RY(i) - 30, w, 60, m.c, 1320 + i * 7);
    txt('≈' + Math.round(m.t * k) + ' 分钟', X0 + w + 18, RY(i), 40, C.ink);
  });
  if (lt > 4.0) crown(X0 + 28 * PX + 50, RY(2) - 44, .9, clamp((lt - 4) / .3, 0, 1));
  if (lt > 4.8) { hcircle(X0 + 42 * PX + 120, RY(0), 140, 40, 1331, C.red, 4, (lt - 4.8) / .4); typeText('自行车只比打车慢 12 分钟', 1260, 240, 40, lt - 5.1, { color: C.red, cps: 12 }); }
  cat('哭着狂奔', 1700, 960, 200, lt - 6.4);
  footnote('口径：自行车按 15 公里/小时、电动车按 25 公里/小时、打车按市区平均车速估算', clamp((lt - 1) / .3, 0, 1));
});

// D 花费（一枚铜钱 = 1 元）
S.push(lt => {
  header(lt, '谁最省钱？', '一枚铜钱 = 1 元（单程）', C.orange);
  rows(lt);
  let idx = 0;
  MD.forEach((m, i) => {
    const n = Math.ceil(m.cost);
    for (let j = 0; j < n; j++, idx++) {
      const ct = lt - 1.0 - idx * .045; if (ct < 0) continue;
      const frac = j === n - 1 && m.cost % 1 ? m.cost % 1 : 1;
      g.save(); g.beginPath(); g.rect(560 + j * 40 - 20, RY(i) - 30, 40 * (frac < 1 ? Math.max(frac, .4) : 1) + (frac < 1 ? 0 : 0), 60); g.clip(); coin(560 + j * 40, RY(i), .62 * pop(ct), 1); g.restore();
    }
    const dt = lt - 1.0 - idx * .045; if (dt > .2) txt(m.cost === 0 ? '0 元' : (m.cost < 1 ? '≈' : '') + m.cost + ' 元', 560 + Math.max(n, 0) * 40 + (n ? 10 : 0), RY(i), 40, m.cost >= 30 ? C.red : C.ink, { a: clamp((dt - .2) / .2, 0, 1) });
  });
  if (lt > 5.0) { typeText('打车一趟 ≈ {r}7 趟{/}共享单车', 1100, 820, 48, lt - 5.0, { cps: 12 }); }
  if (lt > 6.4) txt('自行车：不算买车钱，每趟 0 元', 1104, 890, 34, C.green, { font: BODY, a: clamp((lt - 6.4) / .3, 0, 1) });
  cat('惊恐大哭', 1790, 480, 220, lt - 4.6);
  footnote('口径：共享单车按 1.5 元/15 分钟；地铁按 10 公里左右票价；打车为市区估算；电动车只算电费', clamp((lt - 1) / .3, 0, 1));
});

// E 热量（一个肉包 ≈ 220 千卡）
S.push(lt => {
  header(lt, '顺便消耗了多少？', '一个肉包 ≈ 220 千卡', C.red);
  rows(lt);
  MD.forEach((m, i) => {
    const q = m.kcal / 220, k = eout((lt - 1.2 - i * .4) / .9), shown = q * k; if (k <= 0) return;
    for (let j = 0; j < Math.max(1, Math.ceil(q)); j++) bun(600 + j * 90, RY(i) + 4, 1.05, shown - j, 1);
    txt('≈' + Math.round(m.kcal * k) + ' 千卡', 600 + Math.max(1, Math.ceil(q)) * 90 + 10, RY(i), 38, C.ink);
  });
  if (lt > 4.6) { hcircle(660, RY(0), 100, 42, 1341, C.red, 4, (lt - 4.6) / .4); typeText('骑车上班一趟 ≈ {r}一个肉包{/}', 1100, 760, 50, lt - 4.9, { cps: 12 }); }
  if (lt > 6.4) txt('来回两趟，晚饭可以多吃一个', 1104, 830, 36, C.sub, { font: BODY, a: clamp((lt - 6.4) / .3, 0, 1) });
  cat('啃鲷鱼烧', 1760, 480, 260, lt - 3.6);
  footnote('口径：按体重约 60 公斤估算的示意值；地铁、打车只算走路和上下车的部分', clamp((lt - 1) / .3, 0, 1));
});

// F 成绩单
const TC = [['方式', 110], ['时间', 470], ['花费', 680], ['消耗', 880], ['李财点评', 1110]];
S.push(lt => {
  header(lt, '10 公里通勤成绩单', '黄底 = 该项最好', C.blue);
  TC.forEach(c => txt(c[0], c[1], 262, 32, C.sub, { font: BODY, a: clamp((lt - .6) / .3, 0, 1) }));
  if (lt > .6) hline(100, 292, 1780, 294, 1351, C.ink, 2.5, (lt - .6) / .6);
  const hl = (x, y, w) => { g.save(); g.globalAlpha = .55; g.fillStyle = '#F8DE7E'; g.fillRect(x - 10, y - 30, w, 60); g.restore(); };
  MD.forEach((m, i) => {
    const y = 340 + i * 84, a = clamp((lt - 1.0 - i * .35) / .3, 0, 1); if (a <= 0) return;
    if (lt > 3.6) { if (i === 2) hl(TC[1][1], y, 170); if (i === 0 || i === 5) hl(TC[2][1], y, 130); if (i === 5) hl(TC[3][1], y, 170); }
    if (i === 0 && lt > 4.6) hrect(96, y - 40, 1700, 80, 1361, C.red, 4, (lt - 4.6) / .5);
    g.save(); g.globalAlpha = a;
    icon(m.k, 150, y - 2, .6); txt(m.n, 230, y, 38, C.ink);
    txt(m.t + ' 分', TC[1][1], y, 38, C.ink); txt(m.cost + ' 元', TC[2][1], y, 38, C.ink); txt(m.kcal + ' 千卡', TC[3][1], y, 38, C.ink); txt(m.say, TC[4][1], y, 36, C.ink);
    g.restore();
  });
  if (lt > 5.4) typeText('结论：10 公里通勤，{g}自行车{/}最划算', 110, 900, 52, lt - 5.4, { cps: 12 });
  stamp('性价比冠军', 1520, 940, 56, lt - 7.4, -.08);
  confetti(lt - 7.5, 60, 13);
  cat('坏笑得意', 1830, 930, 220, lt - 7.6);
  footnote('口径：数字为示意估算；你的城市可以自己算一算', clamp((lt - 1) / .3, 0, 1));
});

// G 但是
const BUT = [['下大雨、下雪', '地铁更稳妥'], ['超过 15 公里', '可以骑车 + 地铁'], ['没有自行车道、路况差', '安全比省钱重要']];
S.push(lt => {
  header(lt, '不过，这些时候别硬骑', '', C.purple);
  BUT.forEach((b, i) => {
    const y = 360 + i * 160, ct = lt - .6 - i * 1.4; if (ct < 0) return;
    numDot(i + 1, 170, y, ct, C.purple);
    typeText(b[0], 250, y - 14, 54, ct - .2, { cps: 12 });
    txt('→ ' + b[1], 254, y + 46, 36, C.green, { font: BODY, a: clamp((ct - .9) / .3, 0, 1) });
  });
  if (lt > 5.4) typeText('骑车一定{r}戴头盔{/}', 250, 870, 56, lt - 5.4, { cps: 10 });
  cat('戴头盔骑车', 1500, 620, 560, lt - .6, { bob: false });
});

// H
S.push(lt => nextScene(lt, '累瘫灵魂出窍', '为什么', '越骑越{o}累{/}？', 'road', C.blue));

function coverArt(key, w, h) {
  epCover(key, w, h, { ep: 5, l1: '骑 10 公里', l2: '谁最划算？', sub: '时间 · 花费 · 能吃几个肉包', emo: '举旗欢呼',
    art: (x, y, s, vert) => ['bike', 'metro', 'car'].forEach((k, i) => icon(k, x + (i - 1) * (vert ? 280 : 220) * s, y, (vert ? 2.0 : 1.5) * s)) });
}

function sound(K, c, DUR, T) {
  const X = licaiSound(K, DUR);
  for (let i = 1; i < T.length - 1; i++) { X.whoosh(T[i] - .08); X.ticks(T[i], 8); }
  X.pop(.15); X.ticks(.7, 6, 10); X.ticks(1.4, 6, 8); X.pen(2.0, .4); X.ding(2.4);
  let s = T[1]; for (let i = 0; i < 6; i++) X.pop(s + .8 + i * .5); X.bell(s + .8); K.tone(660, s + 2.3, .3, .04, 'square'); K.tone(330, s + 3.3, .25, .05, 'sawtooth'); X.ticks(s + 4.4, 14, 12); X.pop(s + 5.6);
  s = T[2]; for (let i = 0; i < 6; i++) X.grow(s + 1.2 + i * .35); X.ding(s + 4.0); X.pen(s + 4.8, .4); X.ticks(s + 5.1, 12, 12); X.pop(s + 6.4);
  s = T[3]; let idx = 0; MD.forEach(m => { for (let j = 0; j < Math.ceil(m.cost); j++, idx++) X.coin(s + 1.0 + idx * .045); }); X.wrong(s + 4.6); X.ticks(s + 5.0, 14, 12); X.pop(s + 4.6);
  s = T[4]; for (let i = 0; i < 6; i++) X.pop(s + 1.4 + i * .4); X.pop(s + 3.6); X.pen(s + 4.6, .4); X.ticks(s + 4.9, 13, 12); X.ding(s + 6.4);
  s = T[5]; for (let i = 0; i < 6; i++) X.pen(s + 1.0 + i * .35, .2); X.ding(s + 3.6); X.pen(s + 4.6, .5); X.ticks(s + 5.4, 18, 12); X.stamp(s + 7.4); for (let i = 0; i < 6; i++) K.noise(s + 7.5 + i * .08, .1, .04, 'highpass', 5000); X.pop(s + 7.6);
  s = T[6]; X.pop(s + .6); for (let i = 0; i < 3; i++) { X.pop(s + .6 + i * 1.4); X.ticks(s + .8 + i * 1.4, 7, 12); } X.ticks(s + 5.4, 8, 10); X.ding(s + 6.2);
  s = T[7]; X.ticks(s + .4, 3, 10); X.ticks(s + 1.0, 5, 10); X.bell(s + 1.4); X.stamp(s + 2.4); for (let i = 0; i < 6; i++) K.noise(s + 2.0 + i * .08, .1, .04, 'highpass', 5000);
}

licaiRun({ T, S, seed: 525, allText: SRC.replace(/[\x00-\x7f]/g, '') + '–～°≈×→', audio: sound, cover: coverArt, encode: { b: '4M', maxrate: '6M', bufsize: '12M' } });

})();
</script>
</body>
</html>
