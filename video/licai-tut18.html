<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李财骑行小课堂 · 变速怎么用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b2621;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;cursor:pointer}
  body.render canvas{width:1080px;height:1920px;max-width:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="snowkit.js"></script>
<script src="licai-assets.js"></script>
<script src="licai-emo.js"></script>
<!-- seq:begin -->
<script>var LICAI_SEQ = {};</script>
<script src="licai-seq/叉腰得意.js"></script>
<script src="licai-seq/打招呼.js"></script>
<script src="licai-seq/点头指向.js"></script>
<script src="licai-seq/爬坡吃力.js"></script>
<script src="licai-seq/骑车开心.js"></script>
<!-- seq:end -->
<script src="licaikit.js"></script>
<script src="licai-move.js"></script>
<script src="shortkit.js"></script>
<script src="tutkit.js"></script>
<script>
(() => {
'use strict';
const SRC = document.currentScript.textContent;
// 李财骑行小课堂 · 竖版教程 17《变速怎么用》：手绘 + Mixkit 实拍（见 video/素材/变速怎么用/素材清单.md）
// 左手管前拨、右手管后拨是最常见的配置，片中说“一般”；没有找到拨杆特写实拍，拨杆和链条走线都是手绘示意
// 公共件里用到的动作（splitseq 按名字加载）：'打招呼' '叉腰得意'
const k01 = tk01;
const SHOTS = [
  [0.0, 2.6, 'W', ''],
  [19.2, 23.4, 'V', ''],
  [28.2, 32.4, 'W', '到坡前，就先换好轻挡'],
  [41.3, 45.2, 'W', '一次一两挡，听到咔哒再换']
];
const withShots = tutFrames(SHOTS);
const LINES = [
  [0.1, 2.6, '车上这么多挡，你只用一个？'],
  [2.7, 5.4, '变速其实很简单，记住这几句。'],
  [5.8, 9.8, '一般{o}左手管前面{/}的牙盘，{o}右手管后面{/}的飞轮。'],
  [10.0, 14.4, '前面小盘、后面大飞轮最轻；前面大盘、后面小飞轮最重。'],
  [14.6, 18.8, '上坡、起步用轻挡，平路、下坡再换重挡。'],
  [19.2, 23.4, '{o}换挡时要一直轻轻踩{/}，链条转起来才换得过去。'],
  [23.5, 27.8, '但别在用力猛踩的时候换，链条咔一声，容易掉链。'],
  [28.2, 32.4, '{o}提前换{/}：到坡前、停车前，就把轻挡换好。'],
  [32.5, 36.8, '{o}别交叉{/}：大盘配最大的飞轮、小盘配最小的飞轮，链条拧得最斜。'],
  [37.0, 41.2, '又响又磨损，往中间换一个挡就好。'],
  [41.3, 45.2, '一次换一两挡，听到咔哒一声再继续。'],
  [45.6, 50.4, '口诀：{o}边踩边换，提前换，别交叉{/}。'],
  [50.8, 54.6, '你骑车会换挡吗？'],
  [54.7, 57.8, '评论区说说。']
];
// 侧面传动：ring 'big'|'small'，cog 0（最小）~ 6（最大）
function drive(x, y, ring, cog, col, rot) {
  const R = ring === 'big' ? 120 : 82, cx = x + 420, cr = 32 + cog * 7;
  for (let i = 0; i < 7; i++) { g.save(); g.globalAlpha = i === cog ? 1 : .25; gear(cx, y, 32 + i * 7, 10 + i * 2, rot, i === cog ? col : C.gray, i === cog ? 5 : 3); g.restore(); }
  g.save(); g.globalAlpha = .25; gear(x, y, ring === 'big' ? 82 : 120, ring === 'big' ? 28 : 40, rot * .4, C.gray, 3); g.restore();
  gear(x, y, R, ring === 'big' ? 40 : 28, rot * .4, col, 6);
  g.save(); g.strokeStyle = col; g.lineWidth = 6; g.setLineDash([16, 8]); g.lineDashOffset = -rot * 40; g.beginPath(); g.moveTo(x, y - R); g.lineTo(cx, y - cr); g.moveTo(x, y + R); g.lineTo(cx, y + cr); g.stroke(); g.restore();
}
// 俯视链条线：ri 0 小盘 / 1 大盘；ci 0 最大飞轮（最里）~ 6 最小（最外）
function chainline(y0, ri, ci, col, a) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.lineCap = 'round';
  const ry = [y0 + 40, y0 + 120], cy = i => y0 + i * 26;
  g.strokeStyle = C.ink; g.lineWidth = 12; ry.forEach((yy, i) => { const L = i ? 150 : 110; g.beginPath(); g.moveTo(260 - L / 2, yy); g.lineTo(260 + L / 2, yy); g.stroke(); });
  for (let i = 0; i < 7; i++) { const L = 90 - i * 8; g.beginPath(); g.moveTo(820 - L / 2, cy(i)); g.lineTo(820 + L / 2, cy(i)); g.stroke(); }
  g.strokeStyle = col; g.lineWidth = 8; g.beginPath(); g.moveTo(260 + (ri ? 75 : 55), ry[ri]); g.lineTo(820 - (90 - ci * 8) / 2, cy(ci)); g.stroke();
  txt('牙盘', 260, y0 + 190, 38, C.sub, { align: 'center' }); txt('飞轮', 820, y0 + 210, 38, C.sub, { align: 'center' });
  g.restore();
}
shortRun({ src: SRC, seed: 977, lines: LINES, bgm: 'lofi',
  title: { text: '变速{r}怎么换{/}才顺', t: 0, small: '李财骑行小课堂' },
  scenes: withShots([
    [0, 5.7, (lt, t) => { if (t >= 2.6) tutPreview(t, 2.8, ['左前右后', '上坡轻挡', '边踩边换', '别交叉'], '爬坡吃力'); }],
    [5.7, 14.5, (lt, t) => {
      if (t < 10.0) {
        // 车把俯视：左手 / 右手
        g.save(); g.strokeStyle = C.ink; g.lineCap = 'round'; g.lineWidth = 22; g.beginPath(); g.moveTo(140, 760); g.quadraticCurveTo(540, 700, 940, 760); g.stroke(); g.lineWidth = 30; g.beginPath(); g.moveTo(540, 720); g.lineTo(540, 860); g.stroke(); g.restore();
        [[200, C.blue, '左手', '前面牙盘', '变化大', 6.0], [880, C.orange, '右手', '后面飞轮', '一点点微调', 7.2]].forEach(s => {
          const a = k01(t, s[5], s[5] + .3); if (a <= 0) return; g.save(); g.globalAlpha = a; g.fillStyle = s[1]; g.beginPath(); g.roundRect(s[0] - 40, 690, 80, 90, 20); g.fill(); g.restore();
          txt(s[2], s[0], 560, 60, s[1], { align: 'center', a: a }); txt(s[3], s[0] + (s[0] < 540 ? 40 : -40), 880, 48, C.ink, { align: 'center', a: a }); txt(s[4], s[0] + (s[0] < 540 ? 40 : -40), 950, 40, C.sub, { align: 'center', a: k01(t, s[5] + .6, s[5] + .9) });
        });
        txt('示意：最常见的配置', 540, 1080, 32, C.sub, { align: 'center', font: BODY, a: k01(t, 8.4, 8.7) });
        return;
      }
      const light = t < 12.2;
      drive(320, 760, light ? 'small' : 'big', light ? 6 : 0, light ? C.green : C.red, t * 3);
      txt(light ? '小盘 + 大飞轮' : '大盘 + 小飞轮', 540, 520, 56, C.ink, { align: 'center', a: k01(t, light ? 10.1 : 12.2, light ? 10.4 : 12.5) });
      txt(light ? '最轻：上坡' : '最重：平路快骑', 540, 1010, 56, light ? C.green : C.red, { align: 'center', a: k01(t, light ? 10.6 : 12.6, light ? 10.9 : 12.9) });
    }],
    [14.5, 28.0, (lt, t) => {
      if (t < 19.2) {
        [['上坡、起步', '轻挡', C.green, 14.7], ['平路、下坡', '重挡', C.red, 16.4]].forEach((s, i) => { const a = k01(t, s[3], s[3] + .3); if (a <= 0) return; boxNote(90, 520 + i * 220, 900, 170, 1701 + i, s[2], a); txt(s[0], 140, 605 + i * 220, 60, C.ink, { a: a }); txt('→ ' + s[1], 640, 605 + i * 220, 64, s[2], { a: k01(t, s[3] + .4, s[3] + .7) }); });
        cat('骑车开心', 540, 1060, 200, t - 15.0); return;
      }
      if (t < 23.5) { txt('边踩', 770, 620, 70, C.green, { align: 'center', a: k01(t, 19.6, 19.9) }); txt('边换', 770, 720, 70, C.green, { align: 'center', a: k01(t, 20.0, 20.3) }); txt('链条转着才换得过去', 770, 860, 36, C.ink, { align: 'center', a: k01(t, 20.8, 21.1) }); return; }
      drive(320, 760, 'big', 2, C.red, t * 1.2 + Math.sin(t * 30) * .05 * k01(t, 24.4, 24.6));
      txt('猛踩的时候换挡', 540, 520, 56, C.ink, { align: 'center', a: k01(t, 23.6, 23.9) }); bigX(900, 520, 44, k01(t, 24.2, 24.5));
      if (t > 24.4) stamp('咔！', 760, 640, 70, t - 24.4, .1);
      txt('容易掉链', 540, 1010, 56, C.red, { align: 'center', a: k01(t, 25.0, 25.3) });
    }],
    [28.0, 41.3, (lt, t) => {
      if (t < 32.4) return;
      if (t < 37.0) {
        txt('俯视：链条走线', 540, 480, 48, C.sub, { align: 'center', a: k01(t, 32.6, 32.9) });
        const cross = t < 35.0; chainline(560, cross ? 1 : 0, cross ? 0 : 6, C.red, k01(t, 32.7, 33.1));
        txt(cross ? '大盘 + 最大飞轮' : '小盘 + 最小飞轮', 540, 900, 52, C.red, { align: 'center', a: k01(t, cross ? 33.0 : 35.0, cross ? 33.3 : 35.3) }); bigX(900, 900, 36, k01(t, cross ? 33.4 : 35.2, cross ? 33.7 : 35.5));
        txt('链条拧得最斜', 540, 1000, 52, C.ink, { align: 'center', a: k01(t, 33.8, 34.1) });
        return;
      }
      const fix = t > 38.6; chainline(560, 1, fix ? 4 : 0, fix ? C.green : C.red, 1);
      if (!fix) { txt('又响又磨损', 540, 900, 56, C.red, { align: 'center', a: k01(t, 37.1, 37.4) }); for (let i = 0; i < 3; i++) { const a = (t * 2 + i / 3) % 1; txt('♪', 560 + i * 60, 700 - a * 80, 44, C.red, { a: 1 - a }); } }
      else { txt('往中间换一个挡', 540, 900, 56, C.green, { align: 'center', a: k01(t, 38.6, 38.9) }); tick(900, 900, 40, k01(t, 39.0, 39.3)); }
    }],
    [41.3, 45.4, () => {}],
    [45.4, 50.6, (lt, t) => tutSlogan(t, 46.4, ['边踩边换', '提前换', '别交叉'])],
    [50.6, 58.4, (lt, t) => tutEnd(lt, t, 50.6, '会换挡吗？')]
  ]),
  cues: [['whoosh', .05], ['pop', 2.8], ['pop', 3.3], ['pop', 3.8], ['pop', 4.3], ['pop', 6.0], ['pop', 7.2], ['ding', 10.6], ['wrong', 12.6], ['pop', 14.7], ['pop', 16.4], ['whoosh', 19.2], ['pop', 19.6],
    ['wrong', 24.2], ['stamp', 24.4], ['whoosh', 28.2], ['pop', 32.7], ['wrong', 33.4], ['wrong', 35.2], ['ding', 39.0], ['whoosh', 41.3], ['stamp', 46.4], ['stamp', 47.3], ['stamp', 48.2], ['pop', 50.8], ['ding', 51.2]],
  cover: (key, w, h) => epCover(key, w, h, { tag: '李财骑行小课堂', l1: '这么多挡只用一个？', l2: '变速三句话', sub: '边踩边换 · 提前换 · 别交叉', emo: '灵光一闪', emoScale: .85,
    art: (x, y, s) => { g.save(); g.translate(x - 190 * .4 * s, y + 20 * s); g.scale(.4 * s, .4 * s); drive(0, 0, 'small', 6, C.green, 0); g.restore(); } })
});

})();
</script>
</body>
</html>
