<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>李财骑行实验室 EP.01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b2621;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100vw;max-height:100vh;aspect-ratio:16/9;object-fit:contain;cursor:pointer}
  body.render canvas{width:1920px;height:1080px;max-height:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="snowkit.js"></script>
<script src="licai-assets.js"></script>
<script src="licai-emo.js"></script>
<!-- seq:begin -->
<script>var LICAI_SEQ = {};</script>
<script src="licai-seq/叉腰得意.js"></script>
<script src="licai-seq/吓一跳.js"></script>
<script src="licai-seq/思考怀疑.js"></script>
<script src="licai-seq/点头指向.js"></script>
<script src="licai-seq/绕锥桶.js"></script>
<script src="licai-seq/记笔记.js"></script>
<script src="licai-seq/骑车开心.js"></script>
<script src="licai-seq/骑车摇摆.js"></script>
<!-- seq:end -->
<script src="licaikit.js"></script>
<script src="licai-move.js"></script>
<script src="labkit.js"></script>
<script>
(() => {
'use strict';
const SRC = document.currentScript.textContent;
// 李财骑行实验室 EP.01《自行车为什么不会倒？》
function wheel(x, y, r, rot, col) { g.save(); g.strokeStyle = col || C.ink; g.lineWidth = 8; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.stroke(); g.lineWidth = 3; for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 8; g.beginPath(); g.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke(); } g.restore(); }
labRun({ ep: 1, src: SRC, cover: { l1: '自行车', l2: '为什么不会倒？', sub: '答案不只是陀螺效应', emo: '歪头', art: (x, y, s) => bikeType(x, y, 1.1 * s, 'road', 0, C.blue) },
  pages: [
    { type: 'open', dur: 6, emo: '骑车摇摆', l1: '自行车，', l2: '为什么{o}不会倒{/}？' },
    { type: 'draw', dur: 10, title: '常见答案：陀螺效应', sub: '转起来的轮子像陀螺，所以不倒？', col: C.orange,
      fn: lt => { wheel(560, 600, 230, lt * 4, C.ink); harrow(260, 380, 300, 280, 420, 300, C.blue, clamp((lt - .6) / .5, 0, 1), 6); harrow(860, 820, 820, 920, 700, 900, C.blue, clamp((lt - .6) / .5, 0, 1), 6);
        const r = typeText('轮子转起来像陀螺，所以不倒', 960, 440, 50, lt - 1.2, { cps: 12 }); if (lt > 4.4) strike(950, 444, 960 + r.width + 10, 3201, (lt - 4.4) / .3); },
      notes: [{ t: 5.0, text: '只说对了{r}一小部分{/}', x: 960, y: 560, size: 56 }, { t: 6.6, text: '轮子的陀螺效应其实很弱，不足以单独撑住整辆车', x: 964, y: 650, plain: 1, size: 34 }],
      emo: { n: '托腮疑问', x: 1720, y: 880, h: 280, t: 6.0 }, cues: [['wrong', 4.4]] },
    { type: 'draw', dur: 12, title: '2011 年，科学家造了一辆“怪车”', sub: '专门用来拆穿“陀螺效应”', col: C.blue,
      fn: lt => { bikeType(480, 560, 1.3, 'road', lt * 3, C.blue); txt('普通自行车', 480, 800, 42, C.ink, { align: 'center' });
        const mv = lt > 6.4 ? Math.min(220, (lt - 6.4) * 120) : 0, wob = lt > 6.4 ? Math.sin((lt - 6.4) * 5) * 10 * Math.max(0, 1 - (lt - 6.4) / 3) : 0;
        g.save(); g.translate(mv, 0); g.translate(1340, 560); g.rotate(wob * D2R); bikeType(0, 0, 1.3, 'flat', lt * 3, C.purple); g.fillStyle = C.red; g.beginPath(); g.arc(150, -50, 26, 0, 6.283); g.fill(); g.restore();
        txt('实验车', 1340, 800, 42, C.purple, { align: 'center', a: clamp((lt - 1) / .3, 0, 1) });
        if (lt > 2.0) txt('① 前轮加一个反着转的小轮：抵消陀螺效应', 980, 870, 34, C.ink, { font: BODY, a: clamp((lt - 2) / .3, 0, 1) });
        if (lt > 3.4) txt('② 前轮接地点正好在转向轴上：拖曳距 = 0', 980, 920, 34, C.ink, { font: BODY, a: clamp((lt - 3.4) / .3, 0, 1) }); },
      notes: [{ t: 6.4, text: '推出去：{g}照样自己稳住！{/}', x: 980, y: 300, size: 54 }],
      emo: { n: '惊呆举爪', x: 1780, y: 360, h: 220, t: 7.4 }, foot: '实验：Kooijman 等，《科学》2011 年', cues: [['pop', 2.0], ['pop', 3.4], ['whoosh', 6.4], ['ding', 7.0]] },
    { type: 'list', dur: 11, title: '那到底靠什么？三股力一起出力', sub: '车往哪边倒，车把就会自己往哪边拐一点', col: C.green,
      items: [['{g}拖曳距{/}：前轮接地点在转向轴后面', '像超市购物车的小轮，会自己摆正'], ['{g}车头的重量分布{/}：车一歪，车头就往同侧转', '把车“接”住'], ['{g}陀螺效应{/}：帮一点小忙', '不是主力']], emo: '灵光一闪', opt: { size: 50, cx: 1660, cy: 700, ch: 420 } },
    { type: 'bars', dur: 11, title: '推得多快，车才能自己稳住？', sub: '经典自行车模型的计算（没人骑，只是推出去）', col: C.purple, unit: ' 公里/时', x0: 520, wmax: 1000, max: 35,
      rows: [{ l: '太慢', s: '晃着晃着就倒', r: [0, 15.5], c: C.red }, { l: '自己稳住', s: '不扶也不倒', r: [15.5, 21.6], c: C.green }, { l: '再快', s: '慢慢往一边倒，很好扶', r: [21.6, 35], c: C.orange }], dy: 170, y0: 360,
      notes: [{ t: 4.6, text: '这个“自稳区间”，大约是{g}慢跑到快骑{/}的速度', x: 520, y: 900, size: 46 }],
      emo: { n: '记笔记', x: 1780, y: 880, h: 220, t: 5.6 }, foot: '数据：Meijaard 等 2007 年的“基准自行车”模型；不同车的区间不同' },
    { type: 'draw', dur: 10, title: '有人骑的时候呢？', sub: '俯视图 · 车轮轨迹', col: C.orange,
      fn: lt => { const k = clamp((lt - .6) / 4, 0, 1); g.save(); g.strokeStyle = C.ink; g.lineWidth = 5; g.beginPath(); for (let x = 140; x <= 140 + 1200 * k; x += 6) { const y = 600 + Math.sin(x / 90) * 40 * Math.exp(-(x - 140) / 900); x === 140 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); g.restore();
        const bx = 140 + 1200 * k; bikeType(bx, 560 + Math.sin(bx / 90) * 40 * Math.exp(-(bx - 140) / 900), .4, 'flat', lt * 6, C.green); },
      notes: [{ t: 4.8, text: '往哪边倒，就往哪边{r}轻轻拐一下{/}', x: 140, y: 820, size: 54 }, { t: 6.4, text: '你骑车时一直在做，只是自己没感觉', x: 144, y: 900, plain: 1, size: 34 }],
      emo: { n: '骑车开心', x: 1700, y: 600, h: 320, t: 5.4 } },
    { type: 'end', dur: 10, items: ['不只是陀螺效应：{g}拖曳距 + 车头重量{/}一起出力', '车速约 {g}15～22 公里/时{/}，车自己最稳', '人骑车：{g}往哪边倒就往哪边拐{/}'] },
    { type: 'next', dur: 6, emo: '绕锥桶', l1: '过弯', l2: '为什么要{o}压车{/}？', bk: 'road', bc: C.blue }
  ] });

})();
</script>
</body>
</html>
