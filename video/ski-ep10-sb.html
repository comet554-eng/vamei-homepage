<script>
/*
 * 滑雪不难 EP.10 单板《立刃：板立多高才咬得住》（约 2 分 05 秒）
 * 主要用"顺着板看"的横截面视角：rot > 0 前刃，rot < 0 后刃。
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 27.6, 43.6, 59.6, 73.6, 93.6, 111.6, 118.6, 125.1];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '转弯总是\n{r}打滑{/}？', y: YH, size: 88, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '问题可能在：\n板{a}立得不够{/}。', y: YH, size: 84, w: 900 },
  { in: 8.25, out: 11.35, text: '立刃：\n板立多高才咬得住', y: .3, size: 96, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '滑雪里最重要的一个角度', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 19.4, text: '立刃，就是板和\n雪面的{a}夹角{/}。', y: YH, size: 84, w: 900 },
  { in: 12.6, out: 19.4, text: '从板头方向看，板立起来的那个角度。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 19.8, out: 27.4, text: '角度越大，\n刃{g}咬得越住{/}。', y: YH, size: 84, w: 900 },
  { in: 20.6, out: 27.4, text: '平的时候容易横着滑开；\n立起来，刃就切进雪里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 27.8, out: 35.4, text: '前刃：脚尖踩，\n膝盖{g}往前顶{/}。', y: YH, size: 84, w: 900 },
  { in: 28.6, out: 35.4, text: '小腿压住鞋舌，\n膝盖朝坡下、朝板头方向送。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 35.8, out: 43.4, text: '后刃：脚跟踩，\n屁股{g}往下坐{/}。', y: YH, size: 84, w: 900 },
  { in: 36.6, out: 43.4, text: '脚尖微微抬起，像坐一把矮椅子。\n是往下坐，不是往后坐。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 43.8, out: 51.4, text: '用{a}脚踝和膝盖{/}立刃，\n不只是倒身体。', y: YH, size: 80, w: 900 },
  { in: 44.6, out: 51.4, text: '腿先把板立起来，上身跟着，保持稳定。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 51.8, out: 59.4, text: '立得越高，\n越需要{g}速度{/}撑着。', y: YH, size: 84, w: 900 },
  { in: 52.6, out: 59.4, text: '像骑自行车，骑得太慢很难压弯。\n速度不够还立很高，就会倒进弯里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 59.8, out: 66.4, text: '怎么知道咬住了？\n{g}听声音{/}。', y: YH, size: 84, w: 900 },
  { in: 60.6, out: 66.4, text: '"沙沙"是在搓雪；\n变成干净的"嘶"，刃就咬住了。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 66.8, out: 73.4, text: '回头看痕迹，\n越来越{g}细{/}。', y: YH, size: 84, w: 900 },
  { in: 67.6, out: 73.4, text: '从宽宽一片，到一条细线。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 73.8, out: 76.4, text: '怎么练？\n三步。', y: YH, size: 80, w: 900 },
  { in: 76.7, out: 82.8, text: '① 横穿时只立刃', y: YH, size: 80, w: 900 },
  { in: 77.4, out: 82.8, text: '斜着滑过雪道，不转板，\n慢慢把刃立高，听声音变化。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 83.2, out: 88.8, text: '② 落叶飘：立高、放低', y: YH, size: 76, w: 900 },
  { in: 83.9, out: 88.8, text: '立高就慢下来，放低就往下滑。\n感受角度和速度的关系。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 89.2, out: 93.4, text: '③ 大弯里慢慢加', y: YH, size: 80, w: 900 },
  { in: 89.9, out: 93.4, text: '一点一点加角度，别一下立到最高。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 93.8, out: 99.4, text: '常见错误一：\n腿是直的，{r}只倒上身{/}', y: YH, size: 76, w: 900 },
  { in: 94.6, out: 99.4, text: '重心一偏，刃一滑就摔。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 99.8, out: 105.4, text: '常见错误二：\n后刃时{r}往后坐{/}', y: YH, size: 80, w: 900 },
  { in: 100.6, out: 105.4, text: '屁股往后撅，重量离开板，刃就滑开了。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 105.8, out: 111.4, text: '常见错误三：\n速度太慢，{r}立得太高{/}', y: YH, size: 76, w: 900 },
  { in: 106.6, out: 111.4, text: '撑不住，人直接倒进弯里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 118.8, out: 999, text: '你现在\n能立到几度？', y: .37, size: 88, w: 900, st: .06 },
  { in: 119.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const STEPS = ['① 横穿立刃', '② 落叶飘高低', '③ 大弯慢慢加'];

/* ───────── 姿势（顺着板看） ───────── */
const FLAT = { shin: 14, thigh: -30, torso: 16, head: 10, uarm: 150, farm: 105 };
const TOE = { shin: 42, thigh: -30, torso: 20, head: 12, uarm: 150, farm: 100 };
const HEEL = { shin: 14, thigh: -70, torso: 34, head: 14, uarm: 150, farm: 105 };
const HEELBACK = { shin: 4, thigh: -40, torso: -6, head: -10, uarm: 170, farm: 150 };
const STIFF = { shin: 6, thigh: -10, torso: 8, head: 6, uarm: 160, farm: 140 };
// deg > 0 前刃，< 0 后刃；pose 不传时按角度自动在 FLAT/TOE/HEEL 之间插值
function edgeRider(F, deg, u, o = {}) {
  const k = clamp(Math.abs(deg) / 40, 0, 1), pose = o.pose || lerpPose(FLAT, deg >= 0 ? TOE : HEEL, k);
  return rider(F, 0, pose, u, { rot: deg, pivot: deg >= 0 ? 'toe' : 'heel', mono: o.mono, alpha: o.alpha });
}
function snowLine(F, groove) {
  g.save(); g.fillStyle = '#ffffff'; g.fillRect(0, F[1], W, H - F[1]); g.strokeStyle = '#c8d7e5'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, F[1]); g.lineTo(W, F[1]); g.stroke(); g.restore();
}
function angleArc(J, deg, a) {
  if (Math.abs(deg) < 1) return; const toe = deg > 0, p = J.tf(J.P(toe ? .34 : -.34, 0)), r = 1.1 * J.u, s = toe ? Math.PI : 0, e = toe ? Math.PI + deg * D2R : -Math.abs(deg) * D2R;
  g.save(); g.globalAlpha = a == null ? 1 : a; g.strokeStyle = COL.amber; g.lineWidth = 6; g.beginPath(); g.arc(p[0], p[1], r, Math.min(s, e), Math.max(s, e)); g.stroke();
  label(`${Math.round(Math.abs(deg))}°`, p[0] + (toe ? -1 : 1) * (r + 70), p[1] - 40 - Math.abs(deg) * 2, 52, COL.amber, 900); g.restore();
}
function gripBar(x, y, w, v) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.92)'; g.shadowColor = 'rgba(27,40,56,.1)'; g.shadowBlur = 16; rrect(x - 20, y - 60, w + 40, 110, 22); g.fill(); g.shadowBlur = 0;
  label('刃咬得多住', x, y - 28, 28, COL.sub, 700, 'left');
  g.fillStyle = '#e6edf3'; rrect(x, y, w, 26, 13); g.fill();
  const c = v < .35 ? COL.red : v < .65 ? COL.amber : COL.green; g.fillStyle = c; rrect(x, y, Math.max(26, w * v), 26, 13); g.fill();
  label(v < .35 ? '打滑' : v < .65 ? '搓雪' : '咬住', x + w, y - 28, 28, c, 900, 'right'); g.restore();
}
const grip = deg => clamp(Math.abs(deg) / 42, 0, 1);
function slideSpray(J, t, amt, dir) {
  if (amt < .02) return; const p = J.tf(J.P(dir * .34, 0)); g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 10; i++) { const ph = (t * 2 + hash(i)) % 1; g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(p[0] + dir * (20 + ph * 160), p[1] - 10 - ph * 60 - hash(i + 2) * 30, 6 + hash(i) * 7, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

/* 俯视：横穿的痕迹 */
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
}
function topBoard(x, y, ang, s) {
  g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = COL.board; rrect(-75 * s, -18 * s, 150 * s, 36 * s, 17 * s); g.fill();
  g.fillStyle = '#2a2f3a'; rrect(-42 * s, -14 * s, 16 * s, 28 * s, 5 * s); g.fill(); rrect(26 * s, -14 * s, 16 * s, 28 * s, 5 * s); g.fill();
  g.fillStyle = COL.jacket; g.beginPath(); g.ellipse(0, 0, 30 * s, 15 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 3 * s; g.beginPath(); g.arc(0, 0, 11 * s, 0, Math.PI * 2); g.fill(); g.stroke(); g.restore();
}
function traverse(k, s, yaw0) { // 宽度随 k 变窄的横穿痕迹
  const P = kk => [lerp(W * .15, W * .85, kk), lerp(H * .32, H * .58, kk)], ang = Math.atan2(H * .26, W * .7);
  g.save(); for (let i = 0; i <= 160; i++) { const kk = k * i / 160, p = P(kk), yaw = yaw0 * (1 - kk); g.translate(p[0], p[1]); g.rotate(ang + yaw); g.fillStyle = 'rgba(150,172,192,.07)'; g.fillRect(-72 * s, -16 * s, 144 * s, 32 * s); g.setTransform(1, 0, 0, 1, 0, 0); } g.restore();
  g.save(); g.strokeStyle = '#7d93a8'; g.lineWidth = 5; g.globalAlpha = sm((k - .5) / .3); g.beginPath(); g.moveTo(...P(.55)); g.lineTo(...P(k)); g.stroke(); g.restore();
  const p = P(k); topBoard(p[0], p[1], ang + yaw0 * (1 - k), s);
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：打滑 → 立起来咬住
S.push(lt => {
  drawSky(0); const F = [CX - 20, H * .645];
  const deg = lt < 4.2 ? 8 : lerp(8, 38, sm((lt - 4.4) / 1)), slide = lt < 4.2 ? -((lt * 160) % 280) + 100 : 0;
  snowLine(F); const J = edgeRider([F[0] + slide, F[1]], deg, 158); angleArc(J, deg, 1);
  if (lt < 4.2) { slideSpray(J, lt, 1, 1); label('横着滑开', CX + 260, H * .29, 40, COL.red, 900); }
  else { const a = sm((lt - 5.2) / .4); g.save(); g.globalAlpha = a; label('咬住了', CX + 250, H * .32, 44, COL.green, 900); g.restore(); }
  gripBar(W * .14, H * .675, W * .72, grip(deg));
});
// B 标题
S.push(lt => {
  drawSky(0); const F = [CX, H * .8]; snowLine(F); const deg = 30 + Math.sin(lt * 1.6) * 6, J = edgeRider(F, deg, 120); angleArc(J, deg, 1);
  pill('滑雪不难 · EP.10 · 单板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
});
// C 什么是立刃
S.push(lt => {
  drawSky(0); const F = [CX - 20, H * .645]; snowLine(F);
  let deg;
  if (lt < 8) deg = lt < 1 ? 0 : lt < 3 ? lerp(0, 12, sm((lt - 1) / 1)) : lt < 5 ? lerp(12, 25, sm((lt - 3) / 1)) : lerp(25, 40, sm((lt - 5) / 1));
  else { const l2 = lt - 8; deg = l2 < 2.6 ? 0 : l2 < 5.2 ? 14 : 40; }
  const J = edgeRider(F, deg, 158); angleArc(J, deg, 1);
  if (lt < 8 && lt > 1.5) label('板和雪面的夹角', CX, H * .24, 38, COL.amber, 900);
  if (lt >= 8) {
    const l2 = lt - 8, z = l2 < 2.6 ? 0 : l2 < 5.2 ? 1 : 2;
    [['平板', '打滑、容易卡刃', COL.red], ['小角度', '搓雪', COL.amber], ['大角度', '咬住、刻滑', COL.green]].forEach(([t1, t2, c], i) => {
      const x = CX + (i - 1) * 320, on = z === i; g.save(); g.globalAlpha = on ? 1 : .35; pill(t1, x, H * .245, 34, on ? c : '#fff', on ? '#fff' : COL.sub); label(t2, x, H * .29, 30, c, 900); g.restore(); });
    if (deg === 0) slideSpray(J, lt, 1, 1);
  }
  gripBar(W * .14, H * .675, W * .72, grip(deg));
});
// D 前刃 / 后刃
S.push(lt => {
  drawSky(0); const F = [CX - 20, H * .645]; snowLine(F);
  if (lt < 8) {
    const k = sm((lt - .5) / 1), deg = 32 * k, J = edgeRider(F, deg, 158); angleArc(J, deg, k);
    const a = sm((lt - 1.6) / .4); ring(J.tf(J.K)[0], J.tf(J.K)[1], 46, COL.green, a); g.save(); g.globalAlpha = a; const kn = J.tf(J.K); arrow(kn[0] + 50, kn[1], kn[0] + 170, kn[1] + 20, COL.green, 7, 24); label('膝盖往前顶', kn[0] + 200, kn[1] - 50, 36, COL.green, 900); label('前刃', CX, H * .24, 44, COL.ink, 900); g.restore();
  } else {
    const l2 = lt - 8, k = sm((l2 - .5) / 1), deg = -32 * k, J = edgeRider(F, deg, 158); angleArc(J, deg, k);
    const a = sm((l2 - 1.6) / .4), hp = J.tf(J.Hp); ring(hp[0], hp[1], 50, COL.green, a); g.save(); g.globalAlpha = a; arrow(hp[0] - 40, hp[1] - 120, hp[0] - 40, hp[1] - 10, COL.green, 7, 24); label('往下坐', hp[0] + 40, hp[1] - 170, 36, COL.green, 900); label('后刃', CX, H * .24, 44, COL.ink, 900); g.restore();
  }
});
// E 用腿立刃 / 速度
S.push(lt => {
  drawSky(0); const F = [CX - 20, H * .645]; snowLine(F);
  if (lt < 8) {
    edgeRider([F[0] + 280, F[1]], 30, 110, { pose: STIFF, mono: COL.red, alpha: .25 });
    const J = edgeRider([F[0] - 110, F[1]], 30, 165); angleArc(J, 30, 1);
    const a = sm((lt - .8) / .4); [J.tf(J.A), J.tf(J.K)].forEach(q => ring(q[0], q[1], 40, COL.green, a));
    g.save(); g.globalAlpha = a; label('脚踝 + 膝盖', F[0] - 110, H * .25, 40, COL.green, 900); label('只倒身体', F[0] + 280, H * .36, 32, COL.red, 900); g.restore();
  } else {
    const l2 = lt - 8, slow = l2 < 3.8, k = slow ? ein(clamp((l2 - 1.2) / 1.4, 0, 1)) : 0;
    const deg = slow ? 36 + 50 * k : 36, J = edgeRider(F, deg, 158, slow && k > .1 ? { pose: lerpPose(TOE, RP.fallFwd, k) } : {});
    angleArc(J, Math.min(deg, 60), 1 - k);
    label(slow ? '5 km/h' : '18 km/h', W * .8, H * .25, 52, slow ? COL.red : COL.green, 900);
    label(slow ? '太慢：撑不住，倒进弯里' : '速度够：稳稳立住', CX, H * .3, 38, slow ? COL.red : COL.green, 900);
    if (!slow) speedLines(F, 0, lt, .5);
  }
});
// F 听声音 / 看痕迹
function wave(x, y, w, h, clean, t) {
  g.save(); g.strokeStyle = clean ? COL.green : COL.amber; g.lineWidth = 5; g.beginPath();
  for (let i = 0; i <= 200; i++) { const xx = x + i / 200 * w, n = clean ? Math.sin(i * .25 + t * 8) * .35 : (hash(i + Math.floor(t * 20) * 7) - .5) * 1.6; const yy = y + n * h; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
  g.stroke(); g.restore();
}
S.push(lt => {
  if (lt < 7) {
    drawSky(0); const F = [CX - 20, H * .64]; snowLine(F);
    const deg = lt < 3.2 ? 12 : lerp(12, 38, sm((lt - 3.2) / .8)), J = edgeRider(F, deg, 150); angleArc(J, deg, 1);
    const clean = deg > 30; g.save(); g.fillStyle = 'rgba(255,255,255,.92)'; rrect(W * .12, H * .22, W * .76, 150, 26); g.fill(); g.restore();
    wave(W * .16, H * .22 + 75, W * .68, 40, clean, lt);
    label(clean ? '"嘶——" 刃咬住了' : '"沙沙沙" 在搓雪', CX, H * .22 + 190, 40, clean ? COL.green : COL.amber, 900);
  } else {
    slopeTop(0); traverse(clamp((lt - 7.3) / 5.6, 0, 1), 1.1, .7);
    label('宽', W * .2, H * .27, 40, COL.amber, 900); if (lt > 11) label('细', W * .82, H * .64, 40, COL.green, 900);
  }
});
// G 练习三步
S.push(lt => {
  const cur = lt < 2.4 ? -1 : lt < 9 ? 0 : lt < 15 ? 1 : lt < 19.8 ? 2 : 3;
  if (cur <= 0) { slopeTop(0); const k = clamp((lt - .6) / 8, 0, 1); traverse(k, 1.1, .7); pill(`立刃 ${Math.round(lerp(8, 38, k))}°`, W * .78, H * .3, 38, COL.amber, '#fff'); }
  else if (cur === 1) {
    drawSky(0); const F = [CX - 20, H * .645]; snowLine(F); const l2 = lt - 9, v = .5 - .5 * Math.cos(l2 * 1.8), deg = -lerp(10, 36, v);
    const J = edgeRider([F[0] + (1 - v) * Math.sin(l2 * 1.8) * 30, F[1]], deg, 160); angleArc(J, deg, 1); if (v < .4) slideSpray(J, lt, .8, -1);
    label(v > .5 ? '立高：慢下来' : '放低：往下滑', CX, H * .3, 40, v > .5 ? COL.green : COL.amber, 900);
  } else {
    drawSky(0); const F = [CX - 20, H * .645]; snowLine(F); const l2 = lt - 15, deg = lerp(10, 40, clamp(l2 / 4.4, 0, 1)), J = edgeRider(F, deg, 150); angleArc(J, deg, 1); speedLines(F, 0, lt, .4);
    gripBar(W * .14, H * .675, W * .72, grip(deg));
  }
  stepChips(STEPS, H * .235, cur, eout((lt - .3) / .4), 34);
});
// H 三个错误
S.push(lt => {
  const seg = lt < 6 ? 0 : lt < 12 ? 1 : 2, l2 = lt - seg * 6;
  drawSky(0); const F = [CX - 20, H * .645]; snowLine(F);
  if (seg === 0) {
    const k = sm((l2 - .3) / .8), slip = l2 > 2.4 ? Math.min(220, (l2 - 2.4) * 200) : 0;
    const J = edgeRider([F[0] + slip, F[1]], lerp(5, 28, k), 158, { pose: STIFF }); if (slip > 0) slideSpray(J, lt, 1, 1);
    const a = win(l2, 1.2, 6, .3, .3); g.save(); g.globalAlpha = a; label('腿是直的', CX - 300, H * .4, 38, COL.red, 900); if (slip > 0) label('刃一滑', CX + 300, H * .5, 38, COL.red, 900); g.restore();
  } else if (seg === 1) {
    const k = sm((l2 - .3) / .9), slip = l2 > 2.4 ? -Math.min(220, (l2 - 2.4) * 200) : 0;
    const J = edgeRider([F[0] + slip, F[1]], -lerp(10, 26, k), 158, { pose: lerpPose(HEEL, HEELBACK, k) }); if (slip < 0) slideSpray(J, lt, 1, -1);
    const hp = J.tf(J.Hp), a = win(l2, 1.2, 6, .3, .3); ring(hp[0], hp[1], 56, COL.red, a, true); g.save(); g.globalAlpha = a; label('往后撅', hp[0] + 160, hp[1] - 100, 38, COL.red, 900); g.restore();
  } else {

});
// I 口诀卡
S.push(lt => {

    const ra = eout((lt - .8 - i * 1.2) / .35); if (ra <= 0) return; const ry = y + 250 + i * 225;
    g.save(); g.globalAlpha = a * ra; g.translate((1 - ra) * 40, 0); pill(t1, x + 70 + (t1.length * 38 + 52) / 2, ry - 44, 38, c, '#fff'); label(t2, x + 70, ry + 42, 50, COL.ink, 900, 'left'); g.restore();
  });

S.push(lt => {

/* ───────── 封面 ───────── */
function coverArt(key, w, h) {
  drawSky(0);
  const art = (F, u) => { snowLine(F); const J = edgeRider(F, 40, u); angleArc(J, 40, 1); };
  const title = (cx, y1, y2, size, subY, subSize, pillY, pillSize) => {
    pill('滑雪不难 · EP.10 · 单板', cx, pillY, pillSize, COL.amber, '#fff');
    label('立刃', cx, y1, size, COL.ink, 900);
    g.font = `900 ${size * .5}px ${SANS}`; const parts = [['板立多高才', COL.ink], ['咬得住', COL.green]], ws = parts.map(q => g.measureText(q[0]).width);
    let x = cx - ws.reduce((s, v) => s + v, 0) / 2; parts.forEach((q, i) => { label(q[0], x + ws[i] / 2, y2, size * .5, q[1], 900); x += ws[i]; });
    label('角度 · 前后刃 · 速度 · 三个错误', cx, subY, subSize, COL.sub, 700);
  };
  if (key === '9x16') { art([w * .44, h * .8], 200); title(CX, h * .22, h * .3, 180, h * .36, 40, h * .13, 42); }
  else if (key === '3x4') { art([w * .44, h * .84], 160); title(CX, h * .16, h * .25, 170, h * .315, 38, h * .06, 40); }
  else {
    art([w * .7, h * .84], key === '16x9' ? 165 : 135);
    const fade = g.createLinearGradient(0, 0, w * .62, 0); fade.addColorStop(0, 'rgba(240,246,251,.96)'); fade.addColorStop(1, 'rgba(240,246,251,0)'); g.fillStyle = fade; g.fillRect(0, 0, w * .5, h);
    const size = key === '16x9' ? 170 : 140;
    title(w * .27, h * .4, h * .56, size, h * .68, key === '16x9' ? 34 : 28, h * .2, key === '16x9' ? 38 : 34);
  }
}

/* ───────── 声音 ───────── */
function sound(K, c, DUR) {
  K.bed(8.0, DUR, t => t < 27.6 ? 'verse' : t < 43.6 ? 'chorus' : t < 59.6 ? 'verse' : t < 93.6 ? 'chorus' : t < 111.6 ? 'tense' : 'outro');
  const scrape = (a, b) => { for (let t = a; t < b; t += .14) K.noise(t, .16, .05, 'bandpass', 2400 + 700 * Math.sin(t * 7), null, 1.4); };
  const hiss = (a, b) => { for (let t = a; t < b; t += 1.4) K.noise(t, 1.3, .045, 'highpass', 5200); };
  scrape(.2, 4.2); hiss(4.6, 8); K.ding(5.2);
  scrape(19.8, 22.4); scrape(22.4, 25); hiss(25, 27.6); K.ding(25.2);
  K.ding(27.6 + 1.6); K.ding(35.6 + 1.6); K.ding(43.6 + .8); K.wrong(51.6 + 1.4); K.thud(51.6 + 2.4, .5); K.ding(51.6 + 4.2);
  scrape(59.6, 62.8); hiss(62.8, 66.6); K.ding(59.6 + 3.4);
  [93.6 + .3, 99.6 + .3, 105.6 + .3].forEach(K.wrong); K.thud(105.6 + 2.8, .5);
  for (let i = 0; i < 3; i++) K.tone(880 + i * 110, 111.6 + .8 + i * 1.2, .25, .07, 'triangle');
  K.riser(92.2, 93.6, .12);
}

kitRun({
