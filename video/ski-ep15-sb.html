  { in: 120.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }

const STEPS = ['① 练急停', '② 练最陡那段', '③ 找人陪'];
const CHECK = ['能连续转弯', '前刃、后刃都能停', '速度控制得住'];
const BLUE = '#2f80ed', GREEN = 'rgb(18,166,121)', AMB = 'rgb(255,159,28)';

/* ───────── 人物（单板） ───────── */
// 俯视：板沿局部 x；o.face = ±1：正面（护目镜）朝局部 ±y
function topR(x, y, ang, s, o = {}) {
  g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  g.fillStyle = COL.board; rrect(-75 * s, -18 * s, 150 * s, 36 * s, 17 * s); g.fill();
  g.fillStyle = '#2a2f3a'; rrect(-42 * s, -14 * s, 16 * s, 28 * s, 5 * s); g.fill(); rrect(26 * s, -14 * s, 16 * s, 28 * s, 5 * s); g.fill();
  g.fillStyle = o.jacket || COL.jacket; g.beginPath(); g.ellipse(0, 0, 30 * s, 15 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 3 * s; g.beginPath(); g.arc(0, 0, 11 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  const f = o.face || 1; g.fillStyle = COL.amber; g.beginPath(); g.arc(0, f * 8 * s, 5 * s, 0, Math.PI * 2); g.fill();
  g.restore();
}
// 停住时：板横过来，正面朝山下
const stopAng = v => v < 0 ? 0 : Math.PI;
const faceFor = ang => Math.cos(ang) >= 0 ? 1 : -1;
function topRider(x, y, ang, s, o = {}) { topR(x, y, ang, s, Object.assign({ face: faceFor(ang) }, o)); }
const RS = 1.0; // 地图上人的大小（乘以 V.z）

/* ───────── 俯视：一条雪道的"地图" ───────── */
const ML = 960; // u 从 0 到 1 的长度（z = 1 时，像素）
const tc = u => 60 * Math.sin(u * 5.2 + .5);
const nar = u => sm((u - .55) / .08) * (1 - sm((u - .67) / .08));
const thw = u => 250 - 100 * nar(u);
const STEEP = [.34, .5];
const ICE = [[.48, .1, 1], [.8, -.5, .7]];
function view(u0, u1, top, bot, cx) { return { u0, u1, top, bot, cx: cx == null ? CX : cx, z: (bot - top) / ((u1 - u0) * ML) }; }
const MP = (V, u, v) => [V.cx + (tc(u) + v * thw(u)) * V.z, V.top + (u - V.u0) * ML * V.z];
function band(V, ua, ub, va, vb) {
  g.beginPath(); const N = 70;
  for (let i = 0; i <= N; i++) { const p = MP(V, lerp(ua, ub, i / N), va); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
  for (let i = N; i >= 0; i--) { const p = MP(V, lerp(ua, ub, i / N), vb); g.lineTo(p[0], p[1]); }
  g.closePath();
}
function tree(x, y, s) {
  g.fillStyle = '#a9c0d1';
  for (let j = 0; j < 3; j++) { const w = (30 - j * 7) * s, yy = y - j * 18 * s; g.beginPath(); g.moveTo(x, yy - 34 * s); g.lineTo(x - w, yy); g.lineTo(x + w, yy); g.closePath(); g.fill(); }
}
function drawMap(V, o = {}) {
  const uA = V.u0 - V.top / (ML * V.z) - .03, uB = V.u0 + (H - V.top) / (ML * V.z) + .03, z = V.z;
  g.fillStyle = '#e2ebf2'; g.fillRect(0, 0, W, H);
  // 雪道外的树
  for (let u = Math.floor(uA / .05) * .05; u < uB; u += .05) {
    [-1, 1].forEach((sd, j) => {
      for (let r = 0; r < 3; r++) { const p = MP(V, u + hash(u * 100 + j + r * 7) * .03, sd * (1.18 + r * .32 + hash(u * 77 + j + r) * .12)); if (p[0] > -60 && p[0] < W + 60) tree(p[0], p[1], Math.min(1.6, z * .95)); }
    });
  }
  // 雪道
  band(V, uA, uB, -1, 1); g.fillStyle = '#fbfdff'; g.fill();
  g.strokeStyle = '#c3d4e4'; g.lineWidth = 4;
  [-1, 1].forEach(sd => { g.beginPath(); for (let i = 0; i <= 90; i++) { const p = MP(V, lerp(uA, uB, i / 90), sd); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke(); });
  g.strokeStyle = '#edf2f7'; g.lineWidth = 4;
  for (let i = 0; i < 46; i++) { const u = lerp(uA, uB, hash(i + 40)), p = MP(V, u, hash(i + 3) * 1.6 - .8); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + 6 * z, p[1] + 34 * z); g.stroke(); }
  // 陡的一段：深色阴影（右边更陡）
  const sa = o.easy ? .5 : 1, mu = (STEEP[0] + STEEP[1]) / 2, xl = MP(V, mu, -1)[0], xr = MP(V, mu, 1)[0];
  g.save(); band(V, STEEP[0] - .035, STEEP[1] + .035, -1, 1); g.fillStyle = `rgba(60,88,120,${.05 * sa})`; g.fill();
  band(V, STEEP[0], STEEP[1], -1, 1); const gr = g.createLinearGradient(xl, 0, xr, 0); gr.addColorStop(0, `rgba(60,88,120,${.1 * sa})`); gr.addColorStop(1, `rgba(60,88,120,${.34 * sa})`); g.fillStyle = gr; g.fill();
  g.clip(); g.strokeStyle = `rgba(60,88,120,${.12 * sa})`; g.lineWidth = 3; const yb0 = MP(V, STEEP[0], 0)[1], yb1 = MP(V, STEEP[1], 0)[1];
  for (let x = -400; x < W + 400; x += 26) { g.beginPath(); g.moveTo(x, yb0); g.lineTo(x + (yb1 - yb0) * .5, yb1); g.stroke(); }
  g.restore();
  // 冰面
  if (o.ice !== false) ICE.forEach(([u, v, r], i) => {
    const p = MP(V, u, v); g.save(); g.translate(p[0], p[1]); g.rotate(-.18 + i * .3);
    g.fillStyle = 'rgba(140,208,255,.8)'; g.strokeStyle = '#5bb6f0'; g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, 72 * r * z, 24 * r * z, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 4 * z; g.lineCap = 'round'; g.beginPath(); g.moveTo(-40 * r * z, -4 * z); g.lineTo(10 * r * z, -10 * z); g.stroke(); g.restore();
  });
  // 人群
  const nC = o.crowd == null ? 11 : o.crowd, cols = [BLUE, COL.green, '#9b59b6', COL.red, COL.amber];
  for (let i = 0; i < nC; i++) {
    const p = MP(V, .86 + hash(i + 20) * .1, -.75 + hash(i + 30) * 1.5); g.fillStyle = cols[i % 5]; g.strokeStyle = '#fff'; g.lineWidth = 3;
    g.beginPath(); g.arc(p[0], p[1], 10 * z, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  // 缆车
  if (o.lift) {
    const lx = V.cx + 430 * z, ya = MP(V, 1.0, 0)[1], yb = MP(V, -.02, 0)[1];
    g.save(); g.strokeStyle = '#4a5768'; g.lineWidth = 4; g.beginPath(); g.moveTo(lx, ya); g.lineTo(lx, yb); g.stroke();
    g.fillStyle = '#8a9bb0'; [0, .33, .66, 1].forEach(k => { g.fillRect(lx - 16, lerp(ya, yb, k) - 5, 32, 10); });
    for (let j = 0; j < 7; j++) { const k = ((j / 7 + (o.liftT || 0) * .025) % 1), y = lerp(ya, yb, k); g.strokeStyle = '#4a5768'; g.lineWidth = 3; g.beginPath(); g.moveTo(lx, y); g.lineTo(lx - 22, y); g.stroke(); g.fillStyle = '#4f5f73'; rrect(lx - 46, y - 12, 30, 24, 6); g.fill(); }
    g.restore();
  }
}
// 计划路线：几个"停"点之间各转几个弯
const STOPS = [[.03, -.72], [.27, -.72], [.55, .72], [.78, -.72], [.97, .72]];
const SEGM = [2, 3, 3, 3];
function segUV(i, t) {
  const [ua, va] = STOPS[i], ub = STOPS[i + 1][0], m = SEGM[i];
  return [ua + (ub - ua) * (t + .8 * Math.sin(2 * Math.PI * m * t) / (2 * Math.PI * m)), va * Math.cos(Math.PI * m * t)];
}
const routeUV = x => { const i = Math.min(SEGM.length - 1, Math.max(0, Math.floor(x))); return segUV(i, clamp(x - i, 0, 1)); };
const routePt = (V, x) => MP(V, ...routeUV(x));
const routeHd = (V, x) => { const a = routePt(V, Math.max(0, x - .004)), b = routePt(V, Math.min(SEGM.length, x + .004)); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
function drawRoute(V, x0, x1, color, dashed, w) {
  g.save(); g.strokeStyle = color; g.lineWidth = w || 6; g.lineCap = 'round'; if (dashed) g.setLineDash([14, 12]);
  g.beginPath(); const N = Math.max(2, Math.round((x1 - x0) * 90)); for (let i = 0; i <= N; i++) { const p = routePt(V, lerp(x0, x1, i / N)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke(); g.restore();
}
function stopMark(V, i, a, s) {
  if (a <= 0) return; const [u, v] = STOPS[i], p = MP(V, u, Math.sign(v) * 1.0), r = 24 * (s || 1);
  g.save(); g.globalAlpha = a; g.fillStyle = COL.green; g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2); g.fill(); g.stroke();
  label('停', p[0], p[1] + 1, 26 * (s || 1), '#fff', 900); g.restore();
}
// 沿路线走：每段走 mv 秒、停 ps 秒；返回位置与朝向
function tour(V, lt, mv, ps, n0, n1) {
  n0 = n0 || 0; n1 = n1 == null ? SEGM.length : n1;
  const per = mv + ps, i = n0 + Math.floor(Math.max(0, lt) / per);
  if (i >= n1) { const p = routePt(V, n1), v = STOPS[n1][1]; return { p, ang: stopAng(v), x: n1, pause: 1 }; }
  const r = Math.max(0, lt) - (i - n0) * per;
  if (r < mv) { const x = i + sm(r / mv); return { p: routePt(V, x), ang: routeHd(V, x), x, pause: 0 }; }
  const x = i + 1, v = STOPS[x][1], k = sm((r - mv) / .35), h = routeHd(V, x - .01);
  return { p: routePt(V, x), ang: lerp(h, stopAng(v), k), x, pause: k };
}
function cone(x, y, ang, len, spread, color, a) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; const gr = g.createRadialGradient(x, y, 0, x, y, len); gr.addColorStop(0, color.replace(')', ',.38)').replace('rgb', 'rgba')); gr.addColorStop(1, color.replace(')', ',0)').replace('rgb', 'rgba'));
  g.fillStyle = gr; g.beginPath(); g.moveTo(x, y); g.arc(x, y, len, ang - spread, ang + spread); g.closePath(); g.fill(); g.restore();
}
function puffs(x, y, t, a) { // 呼气
  if (a <= 0) return; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 5; i++) { const ph = (t * .8 + i / 5) % 1; g.globalAlpha = a * (1 - ph) * .9; g.beginPath(); g.arc(x + 40 + ph * 70, y - 30 - ph * 60 + Math.sin(ph * 6 + i) * 8, 10 + ph * 16, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}
function snowSpray(x, y, dir, t, amt, s) { // 俯视：往 dir 方向推开的雪
  if (amt < .02) return; s = s || 1; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 14; i++) { const ph = (t * 1.6 + hash(i + 11)) % 1, a = dir + (hash(i + 3) - .5) * 1.4, d = (40 + ph * 110) * s;
    g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, (6 + hash(i) * 8) * s, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

/* ───────── 普通俯视雪面（ep05 同款） ───────── */
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - (scroll || 0)) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}
const zPath = (cx, y0, y1, A, n) => k => [cx + A * Math.sin(k * n * Math.PI), lerp(y0, y1, k)];
const cPath = (cx, y0, y1, A, n) => k => { const ph = k * n * Math.PI, yy = ph / 2 - Math.sin(2 * ph) / 4, ymax = n * Math.PI / 2; return [cx + A * Math.sin(ph), lerp(y0, y1, yy / ymax)]; };
const heading = (f, k) => { const a = f(Math.max(0, k - .002)), b = f(Math.min(1, k + .002)); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
const downness = (f, k) => Math.abs(Math.sin(heading(f, k)));

    title(w * .29, h * .43, h * .58, size, h * .7, key === '16x9' ? 36 : 30, h * .26, key === '16x9' ? 38 : 34);
  }
}
