<script>
/*
 * 滑雪不难 EP.14 双板《侧滑：陡坡下不去怎么办》（约 2 分 05 秒）
 * 两种视角：俯视（画面下方 = 山下，两块板横在坡上）；横截面（顺着板看，雪坡往右下倾斜）。
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 27.6, 43.6, 59.6, 73.6, 93.6, 111.6, 118.6, 125.1];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '滑到一段{r}陡坡{/}，\n腿软、不敢转？', y: YH, size: 84, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '会{g}侧滑{/}，\n就能慢慢下去。', y: YH, size: 88, w: 900 },
  { in: 8.25, out: 11.35, text: '侧滑：\n陡坡下不去怎么办', y: .3, size: 96, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '不转弯，也能一点点蹭下去', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 19.4, text: '侧滑：两块板\n{a}横在坡上{/}往下蹭。', y: YH, size: 84, w: 900 },
  { in: 12.6, out: 19.4, text: '板和下坡方向垂直，不转弯，\n整个人横着一点点往下走。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 19.8, out: 27.4, text: '快慢靠什么？\n{a}放平{/}和{g}立刃{/}。', y: YH, size: 84, w: 900 },
  { in: 20.6, out: 27.4, text: '板放平一点就往下滑，刃一立就停住。\n靠板的角度控速，而不是靠转弯。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 27.8, out: 35.4, text: '板横着，\n{a}山上那块板{/}稍靠前。', y: YH, size: 84, w: 900 },
  { in: 28.6, out: 35.4, text: '两块板平行，都和下坡方向垂直；\n山上那只脚稍微领先一点。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 35.8, out: 43.4, text: '上身{g}朝向山下{/}，\n重心在{g}两脚中间{/}。', y: YH, size: 84, w: 900 },
  { in: 36.6, out: 43.4, text: '肩膀和胸口稍稍转向坡下；\n别往山上靠，一靠板就容易滑走。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 43.8, out: 51.4, text: '膝盖、脚踝往{a}山下放{/}，\n板一平，就开始滑。', y: YH, size: 80, w: 900 },
  { in: 44.6, out: 51.4, text: '两块板一起放平一点，\n人就跟着板整体往下蹭。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 51.8, out: 59.4, text: '膝盖往{g}山上顶{/}，\n刃一立，就停住。', y: YH, size: 84, w: 900 },
  { in: 52.6, out: 59.4, text: '两块板一起立、一起放，\n像踩刹车，想停就停。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 59.8, out: 66.4, text: '进阶：重心{a}前移、后移{/}，\n就会斜着往下走。', y: YH, size: 76, w: 900 },
  { in: 60.6, out: 66.4, text: '这就是"落叶飘"。\n能左右挪一挪，让开前面的人。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 66.8, out: 73.4, text: '慢慢蹭下去，\n{g}一点也不丢人{/}。', y: YH, size: 84, w: 900 },
  { in: 67.6, out: 73.4, text: '窄道、陡坡、硬雪上，\n很多老手也会先侧滑下去。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 73.8, out: 76.4, text: '怎么练？\n三步。', y: YH, size: 80, w: 900 },
  { in: 76.7, out: 82.8, text: '① 缓坡上：放平、立刃', y: YH, size: 76, w: 900 },
  { in: 77.4, out: 82.8, text: '先在缓坡上横站，\n练放平一点就动、立刃就停。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 83.2, out: 88.8, text: '② 一小段一小段地滑', y: YH, size: 76, w: 900 },
  { in: 83.9, out: 88.8, text: '滑一点，停一下；\n再滑一点，再停一下。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 89.2, out: 93.4, text: '③ 加上前后移动', y: YH, size: 80, w: 900 },
  { in: 89.9, out: 93.4, text: '重心稍往前、往后，\n试着斜着往前、往后下。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 93.8, out: 99.4, text: '错误一：\n身体{r}往山上靠{/}', y: YH, size: 80, w: 900 },
  { in: 94.6, out: 99.4, text: '怕往下掉就往坡上躲，\n结果板从脚下滑走，人倒在坡上。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 99.8, out: 105.4, text: '错误二：\n腿是直的，{r}只动上身{/}', y: YH, size: 80, w: 900 },
  { in: 100.6, out: 105.4, text: '板的角度靠膝盖和脚踝来调，\n腿一直，板就不听话。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 105.8, out: 111.4, text: '错误三：两块板\n{r}各干各的{/}', y: YH, size: 80, w: 900 },
  { in: 106.6, out: 111.4, text: '一块立着、一块放平，腿就被拉开。\n两块板要一起放、一起立。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 118.8, out: 999, text: '遇到陡坡，\n你一般怎么下？', y: .37, size: 88, w: 900, st: .06 },
  { in: 119.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const STEPS = ['① 放平立刃', '② 一段一段', '③ 前后移动'];
const SW = 44, FACE = -1;      // 俯视：两块板中心到人中心的距离；板头朝左
const E_STOP = 26, E_FLAT = 4;  // 横截面：立刃 / 放平（相对雪面的角度，示意）

/* ───────── 小工具 ───────── */
function pw(x, pts) { // 分段平滑插值
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], sm((x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0])));
  return pts[pts.length - 1][1];
}
const slipV = e => 240 * Math.pow(clamp((E_STOP - 4 - e) / (E_STOP - 4 - E_FLAT), 0, 1), 1.3);

/* ───────── 俯视：画面下方是山下 ───────── */
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - (scroll || 0)) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}
// 两块板沿 x 方向横在坡上；山上那块（上面）稍靠前；o.twist：上身转向山下的程度
function topSlip(x, y, s, o = {}) {
  const f = FACE, lead = (o.lead == null ? 26 : o.lead) * s, tw = o.twist == null ? .3 : o.twist, out = {};
  g.save(); g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.lineCap = 'round';
  [-1, 1].forEach(sd => {
    const yy = y + sd * SW * s, cx = x + f * (sd < 0 ? lead / 2 : -lead / 2), tail = cx - f * 105 * s, tip = cx + f * 125 * s;
    if (o.edge) { g.strokeStyle = o.edge; g.lineWidth = 8 * s; g.beginPath(); g.moveTo(tail, yy - 12 * s); g.lineTo(tip, yy - 12 * s); g.stroke(); }
    g.strokeStyle = o.mono || COL.ski; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(tail, yy); g.lineTo(tip, yy); g.stroke();
    g.fillStyle = COL.boot; rrect(cx - 20 * s, yy - 13 * s, 40 * s, 26 * s, 8 * s); g.fill();
    out[sd < 0 ? 'up' : 'dn'] = { tip: [tip, yy], tail: [tail, yy], c: [cx, yy] };
  });
  const phi = lerp(Math.PI, Math.PI / 2, tw);
  g.translate(x, y); g.rotate(phi);
  g.fillStyle = o.mono || COL.jacket; g.beginPath(); g.ellipse(-4 * s, 0, 26 * s, 54 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(4 * s, 0, 17 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = COL.amber; g.beginPath(); g.arc(16 * s, 0, 6 * s, 0, Math.PI * 2); g.fill();
  g.restore();
  return out;
}
// 板刮出来的一片痕迹（f(k) 给出每个时刻的人的位置，k ∈ [k0,k1]）
function trail(f, k0, k1, s, o = {}) {
  if (k1 - k0 < 1e-4) return;
  const n = Math.max(2, Math.ceil((k1 - k0) * (o.n || 160))), ld = 13 * s, xa = -125 * s - ld, xb = 105 * s + ld, hh = (SW + 10) * s;
  g.save(); g.fillStyle = o.col || 'rgba(158,180,200,.22)'; g.beginPath();
  for (let i = 0; i <= n; i++) { const p = f(lerp(k0, k1, i / n)); g.rect(p[0] + xa, p[1] - hh, xb - xa, hh * 2); }
  g.fill();
  g.strokeStyle = 'rgba(128,154,178,.3)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let j = 0; j < 9; j++) {
    const xo = lerp(xa + 10, xb - 10, j / 8), yo = (hash(j + 4) - .5) * hh * 1.4;
    g.beginPath(); for (let i = 0; i <= n; i++) { const p = f(lerp(k0, k1, i / n)); i ? g.lineTo(p[0] + xo, p[1] + yo) : g.moveTo(p[0] + xo, p[1] + yo); } g.stroke();
  }
  g.restore();
}
function sprayDown(x, y, s, t, amt) {
  if (amt < .02) return; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const ph = (t * 1.5 + hash(i + 5)) % 1, xx = x + (hash(i + 1) * 230 - 125) * s, yy = y + (SW + 16) * s + ph * 50 * s;
    g.globalAlpha = amt * (1 - ph) * .95; g.beginPath(); g.arc(xx, yy, (5 + hash(i + 2) * 6) * s, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  g.restore();
}
function fallArrow(x, y0, y1, a, txt) {
  g.save(); g.globalAlpha = a == null ? 1 : a; arrow(x, y0, x, y1, COL.blue, 7, 26); label(txt || '下坡', x, y0 - 34, 32, COL.blue, 900); g.restore();
}
function cone(x, y) {
  g.save(); g.fillStyle = COL.amber; g.beginPath(); g.arc(x, y, 30, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 7; g.beginPath(); g.arc(x, y, 17, 0, Math.PI * 2); g.stroke();
  g.fillStyle = COL.jacket2; g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2); g.fill(); g.restore();
}

/* ───────── 横截面：顺着板看，雪坡往右下倾斜 ─────────
   eUp / eDn：山上板、山下板相对雪面的立刃角度（往山里立为正） */
function crossSlip(F, sdeg, eUp, eDn, t, o = {}) {
  const a = sdeg * D2R, sd = [Math.cos(a), Math.sin(a)], nn = [Math.sin(a), -Math.cos(a)], bw = 104, bt = 22, gap = 220;
  // 雪坡
  const p1 = [F[0] - sd[0] * 2400, F[1] - sd[1] * 2400], p2 = [F[0] + sd[0] * 2400, F[1] + sd[1] * 2400];
  g.save();
  const gr = g.createLinearGradient(0, F[1] - 300, 0, F[1] + 600); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#e6eef5');
  g.fillStyle = gr; g.beginPath(); g.moveTo(...p1); g.lineTo(...p2); g.lineTo(p2[0], p2[1] + 4000); g.lineTo(p1[0], p1[1] + 4000); g.closePath(); g.fill();
  g.strokeStyle = '#c3d4e4'; g.lineWidth = 5; g.beginPath(); g.moveTo(...p1); g.lineTo(...p2); g.stroke();
  const spc = 120, off = (((o.scroll || 0) % spc) + spc) % spc;
  g.strokeStyle = '#d6e2ed'; g.lineWidth = 4; g.lineCap = 'round';
  for (let k = -14; k <= 14; k++) { const s = k * spc - off, dep = 24 + (Math.abs(k) % 3) * 18, q = [F[0] + sd[0] * s - nn[0] * dep, F[1] + sd[1] * s - nn[1] * dep]; g.beginPath(); g.moveTo(...q); g.lineTo(q[0] + sd[0] * 34, q[1] + sd[1] * 34); g.stroke(); }
  g.restore();
  // 两块板 + 鞋
  const es = [eUp, eDn], sh = o.skiShift || [0, 0], B = [], U = [], C = [], ang = [];
  [0, 1].forEach(i => {
    const ai = a - es[i] * D2R, along = (i ? 1 : -1) * gap / 2 - bw / 2 + sh[i], c = [F[0] + sd[0] * along, F[1] + sd[1] * along];
    g.save(); g.translate(c[0], c[1]); g.rotate(ai);
    g.fillStyle = COL.ski; rrect(0, -bt, bw, bt, 6); g.fill(); g.fillStyle = '#2a2f3a'; g.fillRect(0, -bt, 5, bt); g.fillRect(bw - 5, -bt, 5, bt);
    g.fillStyle = COL.boot; rrect(bw / 2 - 28, -bt - 62, 56, 62, 10); g.fill();
    g.restore();
    const u = [Math.sin(ai), -Math.cos(ai)], al = [Math.cos(ai), Math.sin(ai)];
    B.push([c[0] + al[0] * bw / 2 + u[0] * (bt + 52), c[1] + al[1] * bw / 2 + u[1] * (bt + 52)]); U.push(u); C.push(c); ang.push(ai);
  });
  // 腿
  let K, hip;
  if (o.stiff) {
    hip = [(B[0][0] + B[1][0]) / 2, Math.min(B[0][1], B[1][1]) - 270];
    K = B.map((b, i) => [lerp(b[0], hip[0] + (i ? 26 : -26), .5), lerp(b[1], hip[1], .5)]);
  } else {
    const Ky = Math.min(B[0][1], B[1][1]) - 80;
    K = B.map((b, i) => { const L = clamp((b[1] - Ky) / Math.max(.3, -U[i][1]), 55, 230); return [b[0] + U[i][0] * L, b[1] + U[i][1] * L]; });
    hip = [lerp((K[0][0] + K[1][0]) / 2, (B[0][0] + B[1][0]) / 2, .5), Math.min(K[0][1], K[1][1]) - 100];
  }
  if (o.hipShift) hip = [hip[0] + o.hipShift[0], hip[1] + o.hipShift[1]];
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  [0, 1].forEach(i => {
    g.strokeStyle = COL.pants; g.lineWidth = 34; g.beginPath(); g.moveTo(...B[i]); g.lineTo(...K[i]); g.stroke();
    g.lineWidth = 38; g.beginPath(); g.moveTo(...K[i]); g.lineTo(hip[0] + (i ? 24 : -24), hip[1]); g.stroke();
  });
  g.lineWidth = 64; g.beginPath(); g.moveTo(hip[0] - 22, hip[1]); g.lineTo(hip[0] + 22, hip[1]); g.stroke();
  // 上身、手臂、头
  const tl = (o.lean || 0) * D2R, Sh = [hip[0] + Math.sin(tl) * 170, hip[1] - Math.cos(tl) * 170], ax = [Math.cos(tl), Math.sin(tl)], dn = [-Math.sin(tl), Math.cos(tl)];
  [-1, 1].forEach(s2 => {
    const s0 = [Sh[0] + ax[0] * s2 * 38 + dn[0] * 18, Sh[1] + ax[1] * s2 * 38 + dn[1] * 18];
    const e = [s0[0] + ax[0] * s2 * 50 + dn[0] * 70, s0[1] + ax[1] * s2 * 50 + dn[1] * 70], hn = [e[0] + ax[0] * s2 * 34 + dn[0] * 62, e[1] + ax[1] * s2 * 34 + dn[1] * 62];
    g.strokeStyle = s2 > 0 ? '#ff8a4f' : COL.jacket2; g.lineWidth = 26; g.beginPath(); g.moveTo(...s0); g.lineTo(...e); g.lineTo(...hn); g.stroke();
    g.fillStyle = COL.pants; g.beginPath(); g.arc(hn[0], hn[1], 14, 0, Math.PI * 2); g.fill();
  });
  g.strokeStyle = COL.jacket; g.lineWidth = 96; g.beginPath(); g.moveTo(hip[0], hip[1] - 20); g.lineTo(...Sh); g.stroke();
  const Hd = [Sh[0] + Math.sin(tl) * 92, Sh[1] - Math.cos(tl) * 92];
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 8; g.beginPath(); g.arc(Hd[0], Hd[1], 40, 0, Math.PI * 2); g.fill(); g.stroke();
  g.save(); g.translate(Hd[0], Hd[1]); g.rotate(tl); g.fillStyle = COL.amber; rrect(-30, -10, 60, 22, 10); g.fill(); g.restore();
  g.restore();
  // 咬住雪的刃（山上那一侧的刃）
  if (!o.noDots) [0, 1].forEach(i => { if (es[i] > 12) { g.fillStyle = COL.green; g.beginPath(); g.arc(C[i][0], C[i][1], 10, 0, Math.PI * 2); g.fill(); } });
  // 立刃角度
  if (o.arc && eDn > 2) {
    const c1 = C[1]; g.save(); g.globalAlpha = o.arc; g.strokeStyle = COL.amber; g.lineWidth = 5; g.beginPath(); g.arc(c1[0], c1[1], 160, ang[1], a, false); g.stroke(); g.restore();
  }
  // 往下滑时，雪被刮下去
  if ((o.slide || 0) > .02) {
    const p0 = [C[1][0] + Math.cos(ang[1]) * bw, C[1][1] + Math.sin(ang[1]) * bw];
    g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const ph = (t * 2 + hash(i + 3)) % 1, d = 10 + ph * 170, hgt = 8 + hash(i + 2) * 46 * (1 - ph);
      g.globalAlpha = o.slide * (1 - ph); g.beginPath(); g.arc(p0[0] + sd[0] * d + nn[0] * hgt, p0[1] + sd[1] * d + nn[1] * hgt, 6 + hash(i) * 7, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    g.restore();
  }
  return { B, K, hip, Sh, Hd, C, ang, sd, nn };
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：陡坡上腿软 → 侧滑慢慢下去
S.push(lt => {
  if (lt < 3.95) {
    drawSky(0); const P0 = [CX, H * .55], th = 32, fr = frameOf(th);
    drawSlope(P0, th, 0, { noProps: true });
    const F = [P0[0] - fr.d[0] * 210, P0[1] - fr.d[1] * 210], wob = .45 + .12 * Math.sin(lt * 18);
    drawSkier(F, th, lerpPose(POSES.tense, POSES.back, wob), 100);
    const Q = [P0[0] + fr.d[0] * 260, P0[1] + fr.d[1] * 260];
    g.save(); g.strokeStyle = COL.red; g.lineWidth = 4; g.setLineDash([10, 8]); g.beginPath(); g.moveTo(...Q); g.lineTo(Q[0] + 230, Q[1]); g.stroke(); g.setLineDash([]);
    g.lineWidth = 6; g.beginPath(); g.arc(Q[0], Q[1], 170, 0, th * D2R); g.stroke(); g.restore();
    label('陡坡', Q[0] + 120, Q[1] + 150, 40, COL.red, 900);
    const a = sm((lt - 1) / .4); g.save(); g.globalAlpha = a; label('腿软…', W * .74, H * .3, 44, COL.red, 900); g.restore();
  } else {
    slopeTop(0);
