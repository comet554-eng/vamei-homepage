  { in: 120.2, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }

const STEPS = ['① 横穿平行', '② 后半弯并脚', '③ 并脚提前'];

/* ───────── 俯视：两块板各自的角度 ─────────
 * 局部坐标里人往 +y 走；th[i] 是第 i 块板相对前进方向的转角（正 = 板头往局部 +x 偏）。
 * i = 0 在局部 -x 一侧，i = 1 在 +x 一侧。light[i] = 1 表示那只脚放轻（板稍微离雪、变淡）。*/
function skiPair(x, y, ang, th, s, o = {}) {
  const L = 230 * s, w = (o.w == null ? 48 : o.w) * s, out = [], fw = o.fwd || [0, 0];
  g.save(); g.translate(x, y); g.rotate(ang); g.lineCap = 'round';
  [0, 1].forEach(i => {
    const sd = i ? 1 : -1, a = th[i], dir = [Math.sin(a), Math.cos(a)], b = [sd * w, fw[i] * s];
    const tip = [b[0] + dir[0] * L * .55, b[1] + dir[1] * L * .55], tail = [b[0] - dir[0] * L * .45, b[1] - dir[1] * L * .45];
    const lt = o.light ? o.light[i] : 0;
    if (lt > .02) { g.strokeStyle = `rgba(40,60,80,${.12 * lt})`; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(tail[0] + 10 * s * lt, tail[1] + 10 * s * lt); g.lineTo(tip[0] + 10 * s * lt, tip[1] + 10 * s * lt); g.stroke(); }
    if (o.press && o.press[i]) { g.strokeStyle = 'rgba(18,166,121,.5)'; g.lineWidth = 34 * s; g.beginPath(); g.moveTo(...tail); g.lineTo(...tip); g.stroke(); }
    g.globalAlpha = 1 - .35 * lt; g.strokeStyle = o.mono || (o.red && o.red[i] ? COL.red : COL.ski); g.lineWidth = 18 * s; g.beginPath(); g.moveTo(...tail); g.lineTo(...tip); g.stroke(); g.globalAlpha = 1;
    g.fillStyle = COL.boot; rrect(b[0] - 13 * s, b[1] - 20 * s, 26 * s, 40 * s, 8 * s); g.fill();
    out.push({ tip, tail, b });
  });
  if (!o.noBody) {
    g.fillStyle = o.mono || COL.jacket; g.beginPath(); g.ellipse(0, 6 * s, (w / s + 4) * s, 26 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(0, 12 * s, 17 * s, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = COL.amber; g.beginPath(); g.arc(0, 24 * s, 6 * s, 0, Math.PI * 2); g.fill();
  }
  g.restore();
  return out;
}
const WA = 20 * D2R; // 八字：每块板往里收 20°
// 圆弧 S 形轨迹：穿过中线时横过来，在两侧对准山下
const cPath = (cx, y0, y1, A, n) => k => { const ph = k * n * Math.PI, yy = ph / 2 - Math.sin(2 * ph) / 4, ymax = n * Math.PI / 2; return [cx + A * Math.sin(ph), lerp(y0, y1, yy / ymax)]; };
const headAng = (f, k) => { const a = f(Math.max(0, k - .002)), b = f(Math.min(1, k + .002)); return Math.atan2(-(b[0] - a[0]), b[1] - a[1]); };
// 内侧在局部的哪一边：+1 / -1
function innerSide(f, k) { const p = f(k), q = f(Math.min(1, k + .03)), r = f(Math.max(0, k - .03)), ang = headAng(f, k);
  const loc = pt => (pt[0] - p[0]) * Math.cos(ang) + (pt[1] - p[1]) * Math.sin(ang); const v = loc(q) + loc(r); return v > 0 ? 1 : -1; }
/* m：0 = 八字，1 = 内脚已经并过来。outer 板保持八字角度，内板转到和外板平行 */
function skierOnPath(f, k, m, s, o = {}) {
  const p = f(k), ang = headAng(f, k), inn = innerSide(f, k), ii = inn > 0 ? 1 : 0, oi = 1 - ii;
  const th = [WA, -WA]; // 八字：i=0（-x 侧）板头往 +x，i=1 往 -x
  const outerTh = th[oi]; th[ii] = lerp(th[ii], outerTh, m);
  if (o.par != null) { const off = -inn * o.par; th[0] = th[1] = off; } // 完全平行：两块板一起，带一点往弯里的角度
  const light = [0, 0]; light[ii] = o.lightOn ? o.lightOn : 0;
  const press = [0, 0]; press[oi] = o.press == null ? 1 : o.press;
  const sk = skiPair(p[0], p[1], ang, th, s, { press, light, red: o.red });
  return { p, ang, inn, ii, oi, sk };
}
function track(f, k0, k1, colFn, wdt) { // 轨迹：colFn(k) 返回颜色
  g.save(); g.lineWidth = wdt || 8; g.lineCap = 'round'; let prev = f(k0);
  for (let i = 1; i <= 180; i++) { const kk = lerp(k0, k1, i / 180), q = f(kk); g.strokeStyle = colFn(kk); g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(q[0], q[1]); g.stroke(); prev = q; }
  g.restore();
}
function ghost(f, color) { g.save(); g.strokeStyle = color; g.lineWidth = 6; g.setLineDash([14, 12]); g.beginPath(); for (let i = 0; i <= 160; i++) { const q = f(i / 160); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); } g.stroke(); g.restore(); }
const ORG = 'rgba(255,159,28,.85)', GRN = 'rgba(18,166,121,.85)';
// 一个弯内的相位：u ∈ [0,1)，0 = 穿过中线（换弯），.5 = 板头朝山下
const turnU = (k, n) => { const ph = k * n; return ph - Math.floor(ph); };
// 后半弯并脚：u 过了 start 开始并，接近下个弯时重新打开成八字
const matchM = (u, start) => sm((u - start) / .18) * (1 - sm((u - .9) / .08));

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：一直推着八字 → 收成平行
S.push(lt => {
  topBg(lt * 70);
  const f = cPath(CX, H * .3, H * .74, 230, 3), k = clamp(lt / 7.6, 0, 1), par = sm((lt - 4.2) / 1.2);
  track(f, 0, k, kk => kk < 4.6 / 7.6 ? ORG : GRN, 8);
  const p = f(k), ang = headAng(f, k), inn = innerSide(f, k), off = -inn * .1;
  skiPair(p[0], p[1], ang, [lerp(WA, off, par), lerp(-WA, off, par)], 1.15, { press: [1 - par, 1 - par] });
  const tired = clamp(lt / 3.6, 0, 1) * (1 - par);
  g.save(); g.globalAlpha = win(lt, .5, 4.4, .3, .4); label('腿酸', W * .82, H * .29, 46, COL.red, 900);
  g.fillStyle = '#e6edf3'; rrect(W * .72, H * .315, W * .2, 24, 12); g.fill(); g.fillStyle = COL.red; rrect(W * .72, H * .315, W * .2 * tired, 24, 12); g.fill(); g.restore();
  if (lt > 4.4) { g.save(); g.globalAlpha = sm((lt - 4.4) / .4); label('平行', W * .82, H * .29, 46, COL.green, 900); g.restore(); }
});
// B 标题
S.push(lt => {
  topBg(lt * 60); g.fillStyle = 'rgba(247,250,252,.6)'; g.fillRect(0, 0, W, H);
  pill('滑雪不难 · EP.05 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  const f = cPath(CX, H * .52, H * .84, 230, 2), k = clamp(lt / 3.4, 0, 1), u = turnU(k, 2);
  ghost(f, 'rgba(18,166,121,.2)'); track(f, 0, k, kk => matchM(turnU(kk, 2), .55) > .5 ? GRN : ORG, 7);
  skierOnPath(f, k, matchM(u, .55), 1.0);
});
// C 为什么：八字对着推 vs 平行同向
S.push(lt => {
  topBg(lt * 40);
  const x = CX, y = H * .4, s = 1.7, par = sm((lt - 8.6) / 1.2), th = [lerp(WA, 0, par), lerp(-WA, 0, par)];
  const sk = skiPair(x, y, 0, th, s, { press: [1, 1] });
  // 八字：两块板把雪往两边推，力互相顶着
  const pushA = (1 - par) * sm((lt - .8) / .6);
  if (pushA > .01) {
    g.save(); g.globalAlpha = pushA;
    sk.forEach((q, i) => { const sd = i ? 1 : -1, mx = x + (q.b[0] + (q.tip[0] - q.b[0]) * .2), my = y + q.b[1] + 40;
      arrow(mx - sd * 10, my, mx - sd * 150, my - 10, COL.red, 9, 30); });
    label('互相顶着', CX, y + 330, 44, COL.red, 900);
    // 推开的雪
    g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
    for (let i = 0; i < 16; i++) { const sd = i % 2 ? 1 : -1, ph = (lt * 1.3 + hash(i)) % 1, yy = y + 40 + hash(i + 5) * 120; g.globalAlpha = pushA * (1 - ph); g.beginPath(); g.arc(x + sd * (140 + ph * 140), yy - ph * 40, 8 + hash(i) * 8, 0, Math.PI * 2); g.fill(); g.stroke(); }
    g.restore();
  }
  if (par > .01) {
    g.save(); g.globalAlpha = par;
    sk.forEach(q => arrow(x + q.tip[0], y + q.tip[1] + 20, x + q.tip[0], y + q.tip[1] + 250, COL.green, 9, 30));
    label('同一个方向', CX, y + 560, 44, COL.green, 900); g.restore();
  }
});
// D 关键：外脚压住，内脚跟上（两个弯）
S.push(lt => {
  topBg(lt * 30);
  const n = 2, f = cPath(CX, H * .27, H * .62, 230, n), k = clamp((lt - .4) / 16.4, 0, 1), u = turnU(k, n);
  ghost(f, 'rgba(106,92,255,.16)');
  track(f, 0, k, kk => matchM(turnU(kk, n), .55) > .5 ? GRN : ORG, 9);
  const m = matchM(u, .55), r = skierOnPath(f, k, m, 1.2, { lightOn: sm((u - .45) / .1) * (1 - sm((u - .75) / .1)) });
  // 沿途标注：第一个弯
  const marks = [[.12, '八字进弯', COL.amber], [.27, '板头朝下', COL.sub], [.37, '内脚跟上', COL.green]];
  marks.forEach(([kk, t, c]) => { if (k < kk) return; const q = f(kk), a = sm((k - kk) / .03); g.save(); g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(q[0], q[1], 12, 0, Math.PI * 2); g.fill();
    const right = q[0] > CX; label(t, q[0] + (right ? 34 : -34), q[1], 34, c, 900, right ? 'left' : 'right'); g.restore(); });
  pill('外脚：压住', CX - 170, H * .675, 32, COL.green, '#fff'); pill('内脚：放轻、跟上', CX + 150, H * .675, 32, COL.amber, '#fff');
});
// E 内脚放轻（脚下特写，循环）
S.push(lt => {
  topBg(0);
  const cyc = ((lt - .6) % 4.6 + 4.6) % 4.6, on = lt > .6, m = on ? sm((cyc - 1.0) / 1.2) * (1 - sm((cyc - 3.9) / .5)) : 0, light = on ? sm((cyc - .5) / .5) * (1 - sm((cyc - 3.6) / .5)) : 0;
  const x = CX + 40, y = H * .43, s = 2.0;
  // 外脚 = i=1（画面右侧），内脚 = i=0；往画面左边转 → 外脚在右
  const th = [lerp(WA, -WA, m), -WA];
  const sk = skiPair(x, y, 0, th, s, { press: [0, 1], light: [light, 0], noBody: true });
  const L0 = [x + sk[0].b[0], y], R0 = [x + sk[1].b[0], y];
  // 重量
  const wi = Math.round(lerp(50, 15, light)), wo = 100 - wi;
  label(`${wo}%`, R0[0] + 30, y - 300, 60, COL.green, 900); label('外脚', R0[0] + 30, y - 240, 32, COL.green, 700);
  label(`${wi}%`, L0[0] - 30, y - 300, 60, light > .5 ? COL.amber : COL.sub, 900); label(light > .5 ? '内脚：放轻' : '内脚', L0[0] - 30, y - 240, 32, light > .5 ? COL.amber : COL.sub, 700);
  if (m > .05 && m < .95) arcArrow(L0[0], L0[1] + 120, 110, Math.PI * .35, Math.PI * .7, COL.amber, 6);

  const bA = win(lt, 7.5, 14, .4, .3);
  if (bA > 0) { g.save(); g.globalAlpha = bA; const yy = y - 160; g.strokeStyle = COL.blue; g.lineWidth = 5; g.beginPath(); g.moveTo(L0[0], yy + 20); g.lineTo(L0[0], yy); g.lineTo(R0[0], yy); g.lineTo(R0[0], yy + 20); g.stroke(); label('与髋同宽', (L0[0] + R0[0]) / 2, yy - 36, 36, COL.blue, 900); g.restore(); }
  label('脚下特写', CX, H * .2, 30, '#9aabbb', 700);
});
// F 并得越来越早 → 一开始就平行（3 个弯）
S.push(lt => {
  topBg(lt * 40);
  const n = 3, f = cPath(CX, H * .25, H * .7, 290, n), k = clamp((lt - .3) / 13.2, 0, 1);
  const startOf = kk => { const t = Math.floor(kk * n); return [.55, .3, -1][Math.min(2, t)]; };
  const mOf = kk => { const st = startOf(kk), u = turnU(kk, n); return st < 0 ? 1 : matchM(u, st); };
  ghost(f, 'rgba(106,92,255,.16)');
  track(f, 0, k, kk => mOf(kk) > .5 ? GRN : ORG, 9);
  const u = turnU(k, n), third = Math.floor(k * n) >= 2;
  if (third) { const p = f(k), ang = headAng(f, k), inn = innerSide(f, k), off = -inn * .12 * Math.sin(u * Math.PI); skiPair(p[0], p[1], ang, [off, off], 1.15, { press: [1, 1] }); }
  else skierOnPath(f, k, mOf(k), 1.15);
  [['过了朝下才并', 0], ['朝下前就并', 1], ['一开始就平行', 2]].forEach(([t, i]) => { if (k * n < i + .05) return; const q = f((i + .5) / n), right = q[0] > CX;
    g.save(); g.globalAlpha = sm((k * n - i - .05) / .15); label(t, q[0] + (right ? -40 : 40), q[1], 34, i === 2 ? COL.green : COL.amber, 900, right ? 'right' : 'left'); g.restore(); });
});
// G 练习三步
S.push(lt => {
  const cur = lt < 2.4 ? -1 : lt < 9 ? 0 : lt < 15 ? 1 : lt < 19.8 ? 2 : 3;
  topBg(lt * 40);
  if (cur <= 0) {
    // 横穿：斜着滑过雪道，两板平行，山上板靠前
    const k = clamp((lt - .5) / 8, 0, 1), x = lerp(W * .2, W * .8, k), y = lerp(H * .32, H * .58, k), ang = Math.atan2(-(W * .6), H * .26);
    g.save(); g.strokeStyle = GRN; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(W * .2, H * .32); g.lineTo(x, y); g.stroke(); g.restore();
