const GROUND = H * .645;

/* rider() 的关节（不画），用来求"什么时候碰到雪" */

const PT = {
  hand: J => J.tf(J.Hn)[1] + .1 * J.u,

// dir：1 往前（前刃一侧），-1 往后（后刃一侧）；deg ≥ 0，两种都朝画面右边倒
const fo = (dir, deg, pivot) => ({ facing: dir > 0 ? 1 : -1, rot: dir * deg, pivot: pivot || (dir > 0 ? 'toe' : 'heel') });

function landDeg(F, pose, u, dir, pt, maxDeg, pivot) {

}
function drawR(F, pose, u, o, extra) { rider(F, 0, pose, u, Object.assign({}, o, extra || {})); return riderJ(F, 0, pose, u, o); }

}
// 坐在雪上，绕屁股往后甩

/* ───────── 画面小部件 ───────── */
function snowLine(F) { g.save(); g.fillStyle = '#ffffff'; g.fillRect(0, F[1], W, H - F[1]); g.strokeStyle = '#c8d7e5'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, F[1]); g.lineTo(W, F[1]); g.stroke(); g.restore(); }

}

const lerpPt = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

/* ───────── 护具：画在 rider 身上；k 里每样 0~1 是"装上"的进度 ───────── */
const GEAR = '#2f80ed', GEAR2 = '#1d5fc4';
function gearOn(J, k, lt) {
