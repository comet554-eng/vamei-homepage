<script>
/*
 * 滑雪不难 EP.11 双板《立刃：板立多高才咬得住》（约 2 分 05 秒）
 * 主要用"从板头方向看"的两块板横截面：往画面右边转弯，左边是外脚、右边是内脚。
 */
(() => {
'use strict';
const T = [0, 8.0, 11.6, 27.6, 43.6, 59.6, 73.6, 93.6, 111.6, 118.6, 125.1];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '转弯总是\n{r}打滑{/}？', y: YH, size: 88, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '问题可能在：\n板{a}立得不够{/}。', y: YH, size: 84, w: 900 },
  { in: 8.25, out: 11.35, text: '立刃：\n板立多高才咬得住', y: .3, size: 96, w: 900, st: .05 },
  { in: 9.0, out: 11.35, text: '滑雪里最重要的一个角度', y: .415, size: 42, w: 600, sub: 1 },
  { in: 11.8, out: 19.4, text: '立刃，就是板和\n雪面的{a}夹角{/}。', y: YH, size: 84, w: 900 },
  { in: 12.6, out: 19.4, text: '从板头方向看，板立起来的那个角度。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 19.8, out: 27.4, text: '角度越大，\n刃{g}咬得越住{/}。', y: YH, size: 84, w: 900 },
  { in: 20.6, out: 27.4, text: '平的时候容易横着滑开；\n立起来，刃就切进雪里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 27.8, out: 35.4, text: '外脚：压住\n{g}大脚趾那一侧{/}。', y: YH, size: 84, w: 900 },
  { in: 28.6, out: 35.4, text: '外脚吃大部分重量，\n用内侧的刃咬住雪。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 35.8, out: 43.4, text: '内脚：跟着\n一起{g}立起来{/}。', y: YH, size: 84, w: 900 },
  { in: 36.6, out: 43.4, text: '小脚趾那一侧的刃，\n和外脚保持差不多的角度。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 43.8, out: 51.4, text: '用{a}脚踝和膝盖{/}立刃，\n不只是倒身体。', y: YH, size: 80, w: 900 },
  { in: 44.6, out: 51.4, text: '膝盖和脚踝往弯里送，上身保持稳定。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 51.8, out: 59.4, text: '立得越高，\n越需要{g}速度{/}撑着。', y: YH, size: 84, w: 900 },
  { in: 52.6, out: 59.4, text: '像骑自行车，骑得太慢很难压弯。\n速度不够还立很高，就会倒进弯里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 59.8, out: 66.4, text: '怎么知道咬住了？\n{g}听声音{/}。', y: YH, size: 84, w: 900 },
  { in: 60.6, out: 66.4, text: '"沙沙"是在搓雪；\n变成干净的"嘶"，刃就咬住了。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 66.8, out: 73.4, text: '回头看痕迹，\n越来越{g}细{/}。', y: YH, size: 84, w: 900 },
  { in: 67.6, out: 73.4, text: '从宽宽一片，到两条细线。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 73.8, out: 76.4, text: '怎么练？\n三步。', y: YH, size: 80, w: 900 },
  { in: 76.7, out: 82.8, text: '① 横穿时只立刃', y: YH, size: 80, w: 900 },
  { in: 77.4, out: 82.8, text: '斜着滑过雪道，不转板，\n两块板一起立高，听声音变化。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 83.2, out: 88.8, text: '② 侧滑：立高、放平', y: YH, size: 76, w: 900 },
  { in: 83.9, out: 88.8, text: '立高就停住，放平就往下蹭。\n感受角度和速度的关系。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 89.2, out: 93.4, text: '③ 大弯里慢慢加', y: YH, size: 80, w: 900 },
  { in: 89.9, out: 93.4, text: '一点一点加角度，别一下立到最高。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 93.8, out: 99.4, text: '常见错误一：\n腿是直的，{r}只倒上身{/}', y: YH, size: 76, w: 900 },
  { in: 94.6, out: 99.4, text: '重心一偏，刃一滑就摔。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 99.8, out: 105.4, text: '常见错误二：\n只立外脚，{r}内脚是平的{/}', y: YH, size: 76, w: 900 },
  { in: 100.6, out: 105.4, text: '两块板不平行，内脚拖着走，弯也乱了。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 105.8, out: 111.4, text: '常见错误三：\n速度太慢，{r}立得太高{/}', y: YH, size: 76, w: 900 },
  { in: 106.6, out: 111.4, text: '撑不住，人直接倒进弯里。', y: YB, size: 42, w: 500, sub: 1 },
  { in: 118.8, out: 999, text: '你现在\n能立到几度？', y: .37, size: 88, w: 900, st: .06 },
  { in: 119.8, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }
];
const STEPS = ['① 横穿立刃', '② 侧滑高低', '③ 大弯慢慢加'];

/* ───────── 两块板的横截面（从板头方向看） ─────────
 * 板往画面左边倾 = 往左转：右边是外脚（deg），左边是内脚（o.degIn，默认同 deg）；o.leanIn：上身往里倒；o.topple：整体倒下的角度（弧度）。*/
function crossSkis(cx, sy, deg, o = {}) {
  const s = o.s || 1, slide = o.slide || 0, degIn = o.degIn == null ? deg : o.degIn, gap = 230 * s, bw = 110 * s, bt = 22 * s;
  const knees = [], exs = [];
  g.save(); if (o.topple) { g.translate(cx + gap / 2, sy); g.rotate(o.topple); g.translate(-(cx + gap / 2), -sy); }
  [-1, 1].forEach(sd => {
    const d = sd < 0 ? degIn : deg, a = d * D2R, groove = d > 25 ? Math.min(26, (d - 25) * 1.4) * s : 0, ex = cx + sd * gap / 2 + 50 * s + slide;
    exs.push([ex, d]);
    if (groove) { g.fillStyle = '#e3ebf2'; g.beginPath(); g.moveTo(ex - 40 * s, sy); g.lineTo(ex - 4 * s, sy + groove); g.lineTo(ex + 4 * s, sy); g.closePath(); g.fill(); }
    g.save(); g.translate(ex, sy + groove * .8); g.rotate(-a);
    g.fillStyle = o.red && sd < 0 ? COL.red : COL.ski; rrect(-bw, -bt, bw, bt, 6 * s); g.fill(); g.fillStyle = '#2a2f3a'; g.fillRect(-5 * s, -bt, 5 * s, bt);
    g.fillStyle = COL.boot; rrect(-bw / 2 - 28 * s, -bt - 60 * s, 56 * s, 60 * s, 10 * s); g.fill();
    const kn = [-bw / 2, -bt - 160 * s]; g.strokeStyle = COL.pants; g.lineWidth = 34 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(-bw / 2, -bt - 60 * s); g.lineTo(kn[0], kn[1]); g.stroke();
    const m = g.getTransform(); knees.push([m.a * kn[0] + m.c * kn[1] + m.e, m.b * kn[0] + m.d * kn[1] + m.f]);
    g.restore();
  });
  const iv = g.getTransform().inverse(); const kn2 = knees.map(k => [iv.a * k[0] + iv.c * k[1] + iv.e, iv.b * k[0] + iv.d * k[1] + iv.f]);
  const hip = [(kn2[0][0] + kn2[1][0]) / 2 + (o.leanIn ? -30 : 20) * s, Math.min(kn2[0][1], kn2[1][1]) - 100 * s];
  g.lineCap = 'round'; g.strokeStyle = COL.pants; g.lineWidth = 38 * s; kn2.forEach(k => { g.beginPath(); g.moveTo(k[0], k[1]); g.lineTo(hip[0] + (k[0] < hip[0] ? -30 : 30) * s, hip[1]); g.stroke(); });
  const tl = o.leanIn ? -deg * 1.1 * D2R : 0, S2 = [hip[0] + Math.sin(tl) * 170 * s, hip[1] - Math.cos(tl) * 170 * s];
  g.strokeStyle = COL.jacket; g.lineWidth = 96 * s; g.beginPath(); g.moveTo(hip[0], hip[1] - 20 * s); g.lineTo(S2[0], S2[1]); g.stroke();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 8 * s; g.beginPath(); g.arc(S2[0] + Math.sin(tl) * 90 * s, S2[1] - Math.cos(tl) * 90 * s, 40 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.restore();
  return { hip, knees: kn2, exs, S: S2 };
}
function snowLine(F) { g.save(); g.fillStyle = '#ffffff'; g.fillRect(0, F[1], W, H - F[1]); g.strokeStyle = '#c8d7e5'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, F[1]); g.lineTo(W, F[1]); g.stroke(); g.restore(); }
function angleArc(C, i, a) { // i：0 内脚（左），1 外脚（右）
  const [ex, d] = C.exs[i]; if (d < 1) return; const sy = SY;
  g.save(); g.globalAlpha = a == null ? 1 : a; g.strokeStyle = COL.amber; g.lineWidth = 6; g.beginPath(); g.arc(ex, sy, 90, Math.PI, Math.PI + d * D2R); g.stroke();
  label(`${Math.round(d)}°`, ex + 60, sy - 50 - d, 48, COL.amber, 900); g.restore();
}
let SY = 0;
function skisAt(F, deg, o = {}) { SY = F[1]; snowLine(F); const C = crossSkis(F[0], F[1], deg, o); if (!o.noArc) angleArc(C, 1, 1); return C; }
function gripBar(x, y, w, v) {
  g.save(); g.fillStyle = 'rgba(255,255,255,.92)'; g.shadowColor = 'rgba(27,40,56,.1)'; g.shadowBlur = 16; rrect(x - 20, y - 60, w + 40, 110, 22); g.fill(); g.shadowBlur = 0;
  label('刃咬得多住', x, y - 28, 28, COL.sub, 700, 'left');
  g.fillStyle = '#e6edf3'; rrect(x, y, w, 26, 13); g.fill();
  const c = v < .35 ? COL.red : v < .65 ? COL.amber : COL.green; g.fillStyle = c; rrect(x, y, Math.max(26, w * v), 26, 13); g.fill();
  label(v < .35 ? '打滑' : v < .65 ? '搓雪' : '咬住', x + w, y - 28, 28, c, 900, 'right'); g.restore();
}
const grip = deg => clamp(Math.abs(deg) / 40, 0, 1);
function slideSpray(x, y, t, amt) {
  if (amt < .02) return; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 10; i++) { const ph = (t * 2 + hash(i)) % 1; g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(x + 20 + ph * 160, y - 10 - ph * 60 - hash(i + 2) * 30, 6 + hash(i) * 7, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

const SW = 44;
/* ───────── 俯视：两块板沿局部 +x 方向 ───────── */
function topSkis(x, y, ang, s, o = {}) {
  g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.lineCap = 'round';
  [-1, 1].forEach(sd => {
    if (o.edge) { g.strokeStyle = o.edge; g.lineWidth = 30 * s; g.globalAlpha = .45; g.beginPath(); g.moveTo(-105 * s, sd * SW * s); g.lineTo(125 * s, sd * SW * s); g.stroke(); g.globalAlpha = 1; }
    g.strokeStyle = o.mono || COL.ski; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(-105 * s, sd * SW * s); g.lineTo(125 * s, sd * SW * s); g.stroke();
    g.fillStyle = COL.boot; rrect(-20 * s, sd * SW * s - 13 * s, 40 * s, 26 * s, 8 * s); g.fill();
  });
  // 雪杖（向后拖着一点）
  g.strokeStyle = '#7d8ea3'; g.lineWidth = 5 * s; [-1, 1].forEach(sd => { g.beginPath(); g.moveTo(30 * s, sd * 78 * s); g.lineTo(-90 * s, sd * 118 * s); g.stroke(); });
  g.fillStyle = o.mono || COL.jacket; g.beginPath(); g.ellipse(-4 * s, 0, 26 * s, 54 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(4 * s, 0, 17 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = COL.amber; g.beginPath(); g.arc(16 * s, 0, 6 * s, 0, Math.PI * 2); g.fill();
  g.restore();
}
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - (scroll || 0)) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}
function slopeTop(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - (scroll || 0)) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
}

function traverse(k, s, yaw0) {
  const P = kk => [lerp(W * .15, W * .85, kk), lerp(H * .32, H * .58, kk)], ang = Math.atan2(H * .26, W * .7);
  g.save(); for (let i = 0; i <= 160; i++) { const kk = k * i / 160, p = P(kk), yaw = yaw0 * (1 - kk); g.translate(p[0], p[1]); g.rotate(ang + yaw); g.fillStyle = 'rgba(150,172,192,.06)'; [-1, 1].forEach(sd => g.fillRect(-100 * s, (sd * SW - 10) * s, 220 * s, 20 * s)); g.setTransform(1, 0, 0, 1, 0, 0); } g.restore();
  g.save(); g.strokeStyle = '#7d93a8'; g.lineWidth = 5; g.globalAlpha = sm((k - .5) / .3); [-1, 1].forEach(sd => { const n = [-Math.sin(ang) * sd * SW * s, Math.cos(ang) * sd * SW * s]; g.beginPath(); g.moveTo(P(.55)[0] + n[0], P(.55)[1] + n[1]); g.lineTo(P(k)[0] + n[0], P(k)[1] + n[1]); g.stroke(); }); g.restore();
  const p = P(k); topSkis(p[0], p[1], ang + yaw0 * (1 - k), s);
}

/* ───────── 场景 ───────── */
const S = [];
const FC = [CX - 140, H * .64];
// A 钩子：打滑 → 立起来咬住
S.push(lt => {
  drawSky(0); const deg = lt < 4.2 ? 8 : lerp(8, 38, sm((lt - 4.4) / 1)), slide = lt < 4.2 ? -((lt * 160) % 260) + 90 : 0;
  const C = skisAt(FC, deg, { slide });
  if (lt < 4.2) { slideSpray(C.exs[1][0], FC[1], lt, 1); label('横着滑开', CX + 260, H * .3, 40, COL.red, 900); }
  else { const a = sm((lt - 5.2) / .4); g.save(); g.globalAlpha = a; label('咬住了', CX + 260, H * .3, 44, COL.green, 900); g.restore(); }
  gripBar(W * .14, H * .69, W * .72, grip(deg));
});
// B 标题
S.push(lt => { drawSky(0); const deg = 30 + Math.sin(lt * 1.6) * 6; skisAt([CX - 110, H * .84], deg, { s: .75 }); pill('滑雪不难 · EP.11 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3)); });
// C 什么是立刃
S.push(lt => {
  drawSky(0); let deg;
  if (lt < 8) deg = lt < 1 ? 0 : lt < 3 ? lerp(0, 12, sm((lt - 1) / 1)) : lt < 5 ? lerp(12, 25, sm((lt - 3) / 1)) : lerp(25, 40, sm((lt - 5) / 1));
  else { const l2 = lt - 8; deg = l2 < 2.6 ? 0 : l2 < 5.2 ? 14 : 40; }
  const C = skisAt(FC, deg, { slide: lt >= 8 && deg === 0 ? -((lt * 160) % 200) + 60 : 0 });
  if (lt < 8 && lt > 1.5) label('板和雪面的夹角', CX, H * .26, 38, COL.amber, 900);
  if (lt >= 8) {
    const l2 = lt - 8, z = l2 < 2.6 ? 0 : l2 < 5.2 ? 1 : 2;
    [['平板', '打滑', COL.red], ['小角度', '搓雪', COL.amber], ['大角度', '咬住、刻滑', COL.green]].forEach(([t1, t2, c], i) => {
      const x = CX + (i - 1) * 320, on = z === i; g.save(); g.globalAlpha = on ? 1 : .35; pill(t1, x, H * .245, 34, on ? c : '#fff', on ? '#fff' : COL.sub); label(t2, x, H * .29, 30, c, 900); g.restore(); });
    if (deg === 0) slideSpray(C.exs[1][0], FC[1], lt, 1);
  }
  gripBar(W * .14, H * .69, W * .72, grip(deg));
});
// D 外脚 / 内脚（往画面左边转）
S.push(lt => {
  drawSky(0); const k = sm((lt - .5) / 1), deg = 32 * k, C = skisAt(FC, deg);
  angleArc(C, 0, k);
  const outer = lt < 8, a = sm(((outer ? lt : lt - 8) - 1.2) / .4), [ox] = C.exs[outer ? 1 : 0];
  g.save(); g.globalAlpha = a; ring(ox - 30, FC[1] - 30, 70, COL.green, 1); label(outer ? '外脚 · 大脚趾一侧' : '内脚 · 小脚趾一侧', ox - 40, FC[1] + 90, 36, COL.green, 900);
  arrow(CX - 120, H * .26, CX - 330, H * .26, COL.green, 8, 28); label('往这边转', CX - 225, H * .22, 34, COL.green, 900); g.restore();
  if (outer) { const a2 = sm((lt - 3) / .4); g.save(); g.globalAlpha = a2; label('大部分重量', ox - 60, FC[1] - 340, 34, COL.amber, 900); arrow(ox - 60, FC[1] - 300, ox - 60, FC[1] - 200, COL.amber, 7, 24); g.restore(); }
});
// E 用腿立刃 / 速度
S.push(lt => {
  drawSky(0);
  if (lt < 8) {
    SY = FC[1]; snowLine(FC);
    g.save(); g.globalAlpha = .28; crossSkis(FC[0] + 380, FC[1], 30, { s: .6, leanIn: true }); g.restore();
    const C = crossSkis(FC[0] - 40, FC[1], 30, { s: .9 }); angleArc(C, 1, 1);
    const a = sm((lt - .8) / .4); C.knees.forEach(q => ring(q[0], q[1], 36, COL.green, a));
    g.save(); g.globalAlpha = a; label('膝盖 + 脚踝往弯里送', FC[0] - 20, H * .25, 38, COL.green, 900); label('只倒身体', FC[0] + 400, H * .42, 32, COL.red, 900); g.restore();
  } else {
    const l2 = lt - 8, slow = l2 < 3.8, k = slow ? ein(clamp((l2 - 1.2) / 1.4, 0, 1)) : 0;
    SY = FC[1]; snowLine(FC); const C = crossSkis(FC[0], FC[1], 36, { topple: -k * 1.1 }); if (k < .2) angleArc(C, 1, 1);
    label(slow ? '5 km/h' : '18 km/h', W * .8, H * .25, 52, slow ? COL.red : COL.green, 900);
    label(slow ? '太慢：撑不住，倒进弯里' : '速度够：稳稳立住', CX, H * .3, 38, slow ? COL.red : COL.green, 900);
  }
});
// F 听声音 / 看痕迹
function wave(x, y, w, h, clean, t) {
  g.save(); g.strokeStyle = clean ? COL.green : COL.amber; g.lineWidth = 5; g.beginPath();
  for (let i = 0; i <= 200; i++) { const xx = x + i / 200 * w, n = clean ? Math.sin(i * .25 + t * 8) * .35 : (hash(i + Math.floor(t * 20) * 7) - .5) * 1.6; const yy = y + n * h; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
  g.stroke(); g.restore();
}
S.push(lt => {
  if (lt < 7) {
    drawSky(0); const deg = lt < 3.2 ? 12 : lerp(12, 38, sm((lt - 3.2) / .8)); skisAt([CX - 120, H * .66], deg, { s: .85 });

/* ───────── 封面 ───────── */
function coverArt(key, w, h) {
