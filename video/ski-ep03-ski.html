(() => {
'use strict';
const T = [0, 8.0, 11.6, 24.0, 46.0, 60.0, 84.0, 108.0, 118.0, 126.0, 133.0, 139.5];
const YH = .135, YB = .745;

const TX = [
  { in: .15, out: 3.8, text: '缓坡上，\n你是怎么停下来的？', y: YH, size: 84, w: 900, st: .06 },
  { in: 4.0, out: 7.8, text: '{a}八字刹车{/}，\n为什么能停下？', y: YH, size: 84, w: 900 },
  { in: 8.25, out: 11.35, text: '八字刹车，\n为什么能停下', y: .3, size: 104, w: 900, st: .06 },
  { in: 9.0, out: 11.35, text: '双板新手学会的第一个刹车', y: .415, size: 42, w: 500, sub: 1 },
  { in: 11.8, out: 17.8, text: '八字：板头靠近，\n板尾{a}分开{/}。', y: YH, size: 80, w: 900 },

  { in: 68.2, out: 75.8, text: '② 缓坡上小八字滑', y: YH, size: 80, w: 900 },

  { in: 84.2, out: 91.8, text: '常见错误一：\n{r}板头交叉{/}', y: YH, size: 80, w: 900 },

  { in: 92.2, out: 99.8, text: '常见错误二：\n{r}往后坐{/}', y: YH, size: 80, w: 900 },

  { in: 109.0, out: 117.8, text: '下一集细讲。', y: YB, size: 42, w: 500, sub: 1 },

  { in: 134.2, out: 999, text: '评论区说说', y: .465, size: 42, w: 500, sub: 1 }

const STEPS = ['① 平地摆八字', '② 小八字滑', '③ 推大八字停'];

/* ───────── 俯视：滑雪者（向画面下方滑）─────────
 * wedge 为每块板相对前进方向的夹角（度），tipGap 板头间距。*/
function skiGeom(x, y, wedge, s, tipGap) {
  const L = 230 * s, gap = (tipGap == null ? 30 : tipGap) * s, a = wedge * D2R, out = [];
  [-1, 1].forEach(side => {
    // 板头在前（画面下方），靠近中线；板尾在后，向两侧分开
    const dir = [-side * Math.sin(a), Math.cos(a)], tip = [x + side * (gap / 2 + 9 * s), y + L * .55], tail = [tip[0] - dir[0] * L, tip[1] - dir[1] * L];
    const m = [(tip[0] + tail[0]) / 2, (tip[1] + tail[1]) / 2];
    out.push({ side, tip, tail, mid: m, dir });
  });
  return out;
}
function topSkier(x, y, wedge, s, o = {}) {
  const sk = skiGeom(x, y, wedge, s, o.tipGap);
  g.save(); g.lineCap = 'round';
  sk.forEach(k => {
    g.strokeStyle = o.mono || COL.ski; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(...k.tail); g.lineTo(...k.tip); g.stroke();
    if (o.press && o.press[k.side < 0 ? 0 : 1]) { g.strokeStyle = 'rgba(18,166,121,.5)'; g.lineWidth = 34 * s; g.beginPath(); g.moveTo(...k.tail); g.lineTo(...k.tip); g.stroke(); }
  });
  g.fillStyle = o.mono || COL.jacket; g.beginPath(); g.ellipse(x, y + 10 * s, 40 * s, 26 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.strokeStyle = COL.pants; g.lineWidth = 4 * s; g.beginPath(); g.arc(x, y + 14 * s, 17 * s, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = COL.amber; g.beginPath(); g.arc(x, y + 26 * s, 6 * s, 0, Math.PI * 2); g.fill();
  g.restore();
  return sk;
}
function topBg(scroll) {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e3ebf2'; g.lineWidth = 3; for (let x = 40; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 14; i++) { const side = i % 2 ? W - 36 : 36, y = ((i * 260 - scroll) % (H + 200) + H + 200) % (H + 200) - 100; g.fillStyle = '#cddbe6'; g.beginPath(); g.arc(side + (hash(i) - .5) * 20, y, 22 + hash(i + 3) * 8, 0, Math.PI * 2); g.fill(); }
  // 雪道上的痕迹，体现前进
  g.strokeStyle = '#e6edf3'; g.lineWidth = 6; for (let i = 0; i < 18; i++) { const x = 120 + (i * 173) % (W - 240), y = ((i * 211 - scroll) % H + H) % H; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30, y + 10); g.stroke(); }
}
function sprayTop(k, s, t, amt) { // 板外侧被推开的雪
  if (amt < .02) return; g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#c8d7e5'; g.lineWidth = 2;
  for (let i = 0; i < 10; i++) { const ph = (t * 1.4 + hash(i + k.side * 7)) % 1, along = .2 + hash(i + 3) * .7, bx = lerp(k.tail[0], k.tip[0], along), by = lerp(k.tail[1], k.tip[1], along);
    const x = bx + k.side * (20 + ph * 80) * s, y = by - ph * 30 * s; g.globalAlpha = amt * (1 - ph); g.beginPath(); g.arc(x, y, (5 + hash(i) * 7) * s, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

/* ───────── 正面：人迎着镜头滑来 ───────── */
const FV = {
  parallel: { wedge: 0, stance: .3, hipH: 1.55, kneeIn: .02, sway: 0, edge: 0 },
  pizza: { wedge: 1, stance: .42, hipH: 1.45, kneeIn: .1, sway: 0, edge: .8 },
  big: { wedge: 1, stance: .62, hipH: 1.38, kneeIn: .12, sway: 0, edge: 1 },
  knock: { wedge: 1, stance: .5, hipH: 1.35, kneeIn: .3, sway: 0, edge: 1 }
};
const lerpFV = (a, b, k) => { const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; };
function frontV(F, p, u, o = {}) {
  const col = c => o.mono || c, J = { u };
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  const seg = (a, b, w, c) => { g.strokeStyle = col(c); g.lineWidth = w * u; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  const poly = (pts, c) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = col(c); g.fill(); };
  const boots = [-1, 1].map(sd => [F[0] + sd * p.stance * u + p.sway * u * .3, F[1]]);
  // 雪板：板头朝镜头（画面下方）、更宽；板尾往远处（画面上方）
  boots.forEach((b, i) => {
    const sd = i ? 1 : -1, tipX = lerp(b[0], F[0] + sd * .12 * u, p.wedge), tip = [tipX, F[1] + 1.05 * u], tail = [b[0] + (b[0] - tipX) * .85, F[1] - .9 * u];
    const wn = .2 * u, wf = .12 * u, eg = p.edge * .07 * u * sd; // eg：立刃时露出内侧
    poly([[tail[0] - wf / 2 - eg, tail[1]], [tail[0] + wf / 2 - eg, tail[1]], [tip[0] + wn / 2 - eg, tip[1]], [tip[0] - wn / 2 - eg, tip[1]]], COL.ski);
    if (p.edge > .05) poly([[tail[0] - sd * wf / 2 - eg, tail[1]], [tail[0] - sd * wf / 2, tail[1] + .03 * u], [tip[0] - sd * wn / 2, tip[1] + .05 * u], [tip[0] - sd * wn / 2 - eg, tip[1]]], '#1d5fbf');
    J['tip' + i] = tip; J['tail' + i] = tail;
  });
  J.boots = boots;
  const hipC = [F[0] + p.sway * u, F[1] - p.hipH * u], hips = [[hipC[0] - .18 * u, hipC[1]], [hipC[0] + .18 * u, hipC[1]]];
  const knees = boots.map((b, i) => { const a = [b[0], b[1] - .4 * u], m = mid(a, hips[i]); return [m[0] - (i ? 1 : -1) * p.kneeIn * u, m[1]]; });
  J.knees = knees;
  // 雪杖
  const S = [hipC[0], hipC[1] - 1.1 * u], sh = [[S[0] - .28 * u, S[1]], [S[0] + .28 * u, S[1]]];
  const hands = sh.map((q, i) => [q[0] + (i ? 1 : -1) * .42 * u, q[1] + .8 * u]);
  hands.forEach((h, i) => seg(h, [h[0] + (i ? 1 : -1) * .35 * u, F[1] + .25 * u], .04, '#8a9bb0'));
  boots.forEach((b, i) => {
    const a = [b[0], b[1] - .4 * u];
    seg(a, knees[i], .26, COL.pants); seg(knees[i], hips[i], .3, COL.pants);
    poly([[b[0] - .15 * u, b[1] + .02 * u], [b[0] + .15 * u, b[1] + .02 * u], [b[0] + .13 * u, b[1] - .45 * u], [b[0] - .13 * u, b[1] - .45 * u]], COL.boot);
  });
  seg(hips[0], hips[1], .34, COL.pants);
  seg(hipC, S, .6, COL.jacket); seg(sh[0], sh[1], .32, COL.jacket);
  sh.forEach((q, i) => { const e = [q[0] + (i ? 1 : -1) * .3 * u, q[1] + .45 * u]; seg(q, e, .17, i ? '#ff8a4f' : COL.jacket2); seg(e, hands[i], .15, i ? '#ff8a4f' : COL.jacket2); g.fillStyle = col(COL.pants); g.beginPath(); g.arc(hands[i][0], hands[i][1], .1 * u, 0, Math.PI * 2); g.fill(); });
  const Hd = [S[0], S[1] - .4 * u]; J.Hd = Hd; J.hipC = hipC;
  g.fillStyle = col('#fff'); g.strokeStyle = col(COL.pants); g.lineWidth = .05 * u; g.beginPath(); g.arc(Hd[0], Hd[1], .22 * u, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = col(COL.amber); rrect(Hd[0] - .17 * u, Hd[1] - .06 * u, .34 * u, .13 * u, .06 * u); g.fill();
  g.restore();
  return J;
}
function snowFront(scroll) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#e2edf6'); gr.addColorStop(.35, '#f3f7fb'); gr.addColorStop(1, '#ffffff'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { const x = 60 + i * 125 + (i % 2) * 30, y = H * .28 + (i % 3) * 22; g.fillStyle = '#c9d8e5'; for (let j = 0; j < 3; j++) { const w = 40 - j * 10, yy = y - j * 30; g.beginPath(); g.moveTo(x, yy - 48); g.lineTo(x - w, yy); g.lineTo(x + w, yy); g.closePath(); g.fill(); } }
  g.strokeStyle = '#e0e9f1'; g.lineWidth = 5;
  for (let i = 0; i < 26; i++) { const x = (i * 197) % W, y = H * .36 + (((i * 131) + scroll) % (H * .6)); const s = .5 + (y - H * .36) / (H * .6); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40 * s, y); g.stroke(); }
}

/* ───────── 场景 ───────── */
const S = [];
// A 钩子：一路冲下去 → 摆出八字停住
const aWedge = lt => lt < 3.6 ? 0 : 24 * sm((lt - 3.6) / 1.4);
const aV = lt => lt < 3.6 ? lerp(500, 1000, lt / 3.6) : Math.max(0, 1000 - (lt - 3.6) * 330);
const aScroll = makeScroll(aV, 0, 8.2);
S.push(lt => {
  const sc = aScroll(lt); topBg(sc);
  const sk = topSkier(CX, H * .5, aWedge(lt), 1.4);
  if (lt > 3.6) sk.forEach(k => sprayTop(k, 1.4, lt, clamp(aV(lt) / 1000, 0, 1)));
  if (lt < 3.6 && lt > 1.0) { const a = win(lt, 1.0, 3.6, .3, .2); g.save(); g.globalAlpha = a; label('刹不住了！', CX, H * .66, 52, COL.red, 900); g.restore(); }
  const v = Math.round(aV(lt) / 1000 * 28);
  label(`${v}`, CX - 20, H * .74, 90, v > 20 ? COL.red : COL.green, 900); label('km/h', CX + 90, H * .75, 32, COL.sub, 700);
  if (lt > 6.6) { const k = pop(lt - 6.6); markV(CX + 170, H * .44, 40, 1, k); }
});
// B 标题
S.push(lt => {
  snowFront(lt * 40);
  pill('滑雪不难 · EP.03 · 双板', CX, H * .19, 40, COL.amber, '#fff', eout(lt / .3));
  frontV([CX, H * .76], lerpFV(FV.parallel, FV.pizza, sm((lt - .4) / .8)), 150);
});
// C 是什么（正面）
S.push(lt => {
  snowFront(lt * 60);
  const k = sm((lt - .4) / 1.2), p = lerpFV(FV.parallel, FV.pizza, k), J = frontV([CX, H * .58], p, 190);
  if (lt > 1.8 && lt < 6.2) {
    const a = win(lt, 1.8, 6.0, .3, .3);
    g.save(); g.globalAlpha = a;
    const tm = mid(J.tip0, J.tip1); arrow(tm[0] + 150, tm[1] - 30, tm[0] + 25, tm[1] - 5, COL.amber, 5, 18); label('板头靠近，留一拳', tm[0] + 300, tm[1] - 40, 36, COL.amber, 900);
    label('板尾分开', J.tail1[0] + 120, J.tail1[1] - 10, 36, COL.amber, 900); label('板尾分开', J.tail0[0] - 120, J.tail0[1] - 10, 36, COL.amber, 900);
    g.restore();
  }
  if (lt > 6.6) {
    const a = win(lt, 6.6, 12.2, .3, .3);
    g.save(); g.globalAlpha = a; J.knees.forEach(q => ring(q[0], q[1], 40, COL.green, 1)); label('膝盖微微往里', CX + 330, J.knees[0][1], 36, COL.green, 900);
    [0, 1].forEach(i => { const t = J['tip' + i], b = J.boots[i]; const x = (t[0] + b[0]) / 2 - (i ? 1 : -1) * 22; g.strokeStyle = COL.green; g.lineWidth = 8; g.beginPath(); g.moveTo(x, b[1] - 10); g.lineTo(x + (t[0] - b[0]) * .4, t[1] - 20); g.stroke(); });
    label('内侧刃', CX - 200, J.tip0[1] - 30, 38, COL.green, 900);
    J.boots.forEach((b, i) => arrow(b[0], b[1] + 30, b[0] + (i ? 1 : -1) * 90, b[1] + 30, COL.green, 6, 22));
    label('脚跟往外推', J.boots[1][0] + 190, J.boots[1][1] + 30, 34, COL.green, 900);
    g.restore();
  }
});
// D 为什么能停：推雪与受力
S.push(lt => {
  topBg(lt * 120);
  const y = H * .43, s = 1.9;
  if (lt < 8) {
    // 一块板：斜着往下滑，把雪推向侧面
    const sk = skiGeom(CX + 60, y, 24, s, 30)[0];
    g.save(); g.lineCap = 'round'; g.strokeStyle = COL.ski; g.lineWidth = 18 * s; g.beginPath(); g.moveTo(...sk.tail); g.lineTo(...sk.tip); g.stroke(); g.restore();
    sprayTop(sk, s, lt, 1);
    arrow(W * .12, H * .3, W * .12, H * .4, '#9aabbb', 6, 22); label('板往下滑', W * .12, H * .425, 32, '#7d8ea3', 900);
    const a = win(lt, 1.6, 7.9, .3, .3), m = sk.mid;
    g.save(); g.globalAlpha = a; arrow(m[0] - 30, m[1], m[0] - 180, m[1], COL.sub, 7, 24); label('雪被推开', m[0] - 120, m[1] + 55, 34, COL.sub, 900);
    arrow(m[0] + 40, m[1] + 30, m[0] + 210, m[1] - 120, COL.red, 9, 30); label('雪顶回来', m[0] + 250, m[1] - 170, 38, COL.red, 900); g.restore();
  } else if (lt < 15) {
    const l2 = lt - 8, sk = topSkier(CX, y, 24, s);
    sk.forEach(k => sprayTop(k, s, lt, .6));
    const a1 = sm((l2 - .2) / .5), a2 = sm((l2 - 1.6) / .5), a3 = sm((l2 - 3.2) / .5);
    sk.forEach(k => {
      const m = k.mid, fx = -k.side * 130, fy = -170; // 斜向的反作用力：指向内侧 + 往后
      g.save(); g.globalAlpha = a1 * (1 - a2 * .6); arrow(m[0], m[1], m[0] + fx, m[1] + fy, COL.red, 8, 26); g.restore();

      const gy = py + ph * .62; g.fillStyle = '#eef4f9'; g.fillRect(px + 20, gy, pw - 40, ph * .3); g.strokeStyle = '#c3d4e4'; g.lineWidth = 4; g.beginPath(); g.moveTo(px + 20, gy); g.lineTo(px + pw - 20, gy); g.stroke();

});
// E 八字大小 = 油门和刹车
const eW = lt => kfL([[0, 8], [2, 8], [5, 30], [8, 30], [10, 8], [13.8, 8]], lt);
function kfL(list, t) { if (t <= list[0][0]) return list[0][1]; for (let i = 1; i < list.length; i++) if (t <= list[i][0]) { const k = sm((t - list[i - 1][0]) / (list[i][0] - list[i - 1][0])); return lerp(list[i - 1][1], list[i][1], k); } return list[list.length - 1][1]; }
const eV = lt => Math.max(0, 900 - eW(lt) * 30);
const eScroll = makeScroll(eV, 0, 15);
S.push(lt => {
  topBg(eScroll(lt)); const w = eW(lt), sk = topSkier(CX, H * .44, w, 1.6);

  const an = Math.PI + kk * Math.PI; g.strokeStyle = COL.ink; g.lineWidth = 8; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + Math.cos(an) * (r - 20), gy + Math.sin(an) * (r - 20)); g.stroke();

// F 三步练习
S.push(lt => {

// G 三个错误
S.push(lt => {

  } else {
    snowFront(0);
    const J = frontV([CX, H * .6], lerpFV(FV.pizza, FV.knock, sm((l2 - .6) / 1.0)), 190);
    const a = win(l2, 1.6, 7.8, .3, .3);

// H 八字转弯预告
S.push(lt => {

// J 口诀卡
S.push(lt => {

/* ───────── 封面 ───────── */

/* ───────── 声音 ───────── */
function sound(K, c, DUR) {
