<!doctype html>
<html lang="zh-CN">
<head>

<title>你真的能忘掉一个人吗</title>

<style>
  :root{
    --ink:#f3e9d8;
    --dim:rgba(243,233,216,.48);
    --faint:rgba(243,233,216,.22);
    --red:#e5483f;
    --ember:#ff9a5a;
    --bg:#050505;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--ink)}
  #stage{

    overflow:hidden;background:var(--bg);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;
  }
  @media (max-aspect-ratio:9/16){#stage{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto}}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .9s ease}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 85% at 50% 46%,transparent 52%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.9) 100%)}
  .bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:2.2%;background:#000;z-index:5;pointer-events:none}
  .bars::before{top:0}.bars::after{bottom:0}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--red);mix-blend-mode:screen;transition:opacity 1.2s ease}

  #hud{position:absolute;top:4.2%;left:7%;right:7%;display:flex;justify-content:space-between;
    font-size:calc(var(--u)*2.55);letter-spacing:.22em;color:var(--dim);z-index:6;font-weight:300;
    transition:color .6s}
  #hud.alert{color:var(--red)}
  #hud span{white-space:nowrap}
  #hudL::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:currentColor;margin-right:.7em;vertical-align:.12em;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.15}}

  .tx{position:absolute;left:6%;right:6%;text-align:center;pointer-events:none;transition:opacity .3s,filter .3s;z-index:4}
  .tx.out{opacity:0;filter:blur(8px);transition:opacity .9s,filter .9s}
  .tx .ln{display:block}
  .tx i{font-style:normal;display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.25em);
    animation:chin 1.1s forwards cubic-bezier(.2,.7,.2,1)}
  @keyframes chin{to{opacity:1;filter:blur(0);transform:none}}

  #title{top:11.5%;font-size:calc(var(--u)*8.6);font-weight:600;line-height:1.38;letter-spacing:.06em;
    text-shadow:0 0 calc(var(--u)*6) rgba(255,190,140,.18)}
  #title.red{color:var(--red);text-shadow:0 0 calc(var(--u)*5) rgba(229,72,63,.45)}

  #caption{top:65%;font-size:calc(var(--u)*4.3);font-weight:400;letter-spacing:.12em;line-height:1.7}
  #caption.event{font-style:normal;color:#ffd9c2;text-shadow:-1px 0 rgba(255,60,60,.6),1px 0 rgba(80,220,255,.45)}
  #caption.red{color:var(--red)}
  #caption.big{font-size:calc(var(--u)*5.4);font-weight:600}

  #log{position:absolute;left:9%;right:9%;top:71%;height:8%;overflow:hidden;z-index:4;pointer-events:none;
    font-size:calc(var(--u)*2.7);letter-spacing:.08em;line-height:1.75;color:var(--faint)}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:logIn .5s ease both}
  #log div b{font-weight:400;color:var(--dim);margin-right:.6em}
  #log div.r{color:rgba(255,140,120,.75)}
  #log div.r b{color:var(--red)}
  @keyframes logIn{from{opacity:0;transform:translateX(-.8em)}}

  #list{position:absolute;left:10%;right:10%;top:71%;z-index:4;pointer-events:none;
    font-size:calc(var(--u)*3.9);letter-spacing:.1em;line-height:1.75;text-align:center}
  #list div{opacity:0;filter:blur(8px);animation:chin 1s forwards}
  #list.out{opacity:0;transition:opacity 1s}

  #prog{position:absolute;left:0;right:0;top:79.5%;text-align:center;z-index:4;pointer-events:none;transition:opacity .6s}
  #pnum{font-size:calc(var(--u)*6.2);font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #plab{font-size:calc(var(--u)*2.3);letter-spacing:.4em;color:var(--dim);margin-top:.3em}
  #prog.alert #pnum{color:var(--red)}

  #hold{position:absolute;left:50%;top:90.2%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;
    width:calc(var(--u)*16);height:calc(var(--u)*16);transition:opacity .7s}
  #hold svg{width:100%;height:100%;overflow:visible}
  #hold .bg{fill:none;stroke:var(--faint);stroke-width:1}
  #hold .arc{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .4s}
  #hold .dot{fill:var(--ink);transform-origin:50% 50%;animation:pulse 2s infinite ease-in-out}
  #hold.on .dot{animation:none;fill:var(--red)}

  #hlab{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;margin-top:calc(var(--u)*.6);
    font-size:calc(var(--u)*2.5);letter-spacing:.35em;color:var(--dim)}

  #choice{position:absolute;left:0;right:0;top:79%;display:flex;justify-content:center;gap:calc(var(--u)*6);z-index:7;
    opacity:0;pointer-events:none;transition:opacity 1s}
  #choice.on{opacity:1;pointer-events:auto}
  button{font-family:var(--serif);background:transparent;color:var(--ink);border:1px solid rgba(243,233,216,.35);
    font-size:calc(var(--u)*4);letter-spacing:.5em;padding:calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*2.4) calc(var(--u)*5.5);
    cursor:pointer;transition:all .4s;backdrop-filter:blur(2px)}
  button:hover,button:active{background:rgba(243,233,216,.08);border-color:var(--ink)}
  button.del{color:#ffb3a8;border-color:rgba(229,72,63,.55)}

    opacity:0;pointer-events:none;transition:opacity 2.4s}
  #end.on{opacity:1;pointer-events:auto}
  #end h1{margin:0 0 0;font-size:calc(var(--u)*8.2);font-weight:600;line-height:1.45;letter-spacing:.08em;text-align:center;
    text-shadow:0 0 calc(var(--u)*7) rgba(255,190,140,.25)}
  #end p{margin:calc(var(--u)*6) 0 0;font-size:calc(var(--u)*3.3);letter-spacing:.2em;color:var(--dim);text-align:center;line-height:1.9}
  #end .tiny{margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.4);color:var(--faint);letter-spacing:.3em}
  #end button{margin-top:calc(var(--u)*12);font-size:calc(var(--u)*3.3)}
  #end .line{width:calc(var(--u)*10);height:1px;background:var(--faint);margin-top:calc(var(--u)*6)}

  #finger{position:absolute;left:50%;top:90.2%;width:calc(var(--u)*10);height:calc(var(--u)*10);margin:calc(var(--u)*-5) 0 0 calc(var(--u)*-5);
    border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.08) 60%,transparent 70%);
    opacity:0;transition:opacity .3s,transform .3s;transform:scale(1.3);pointer-events:none;z-index:9}
  #finger.on{opacity:1;transform:scale(1)}
  .hide{opacity:0!important}
</style>
</head>
<body>
<div id="stage" class="bars">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div id="flash"></div>
  <header id="hud"><span id="hudL">记忆载入中</span><span id="hudR">分开后 · 第 1,095 天</span></header>

  <div id="hold" class="hide">
    <svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="28"/><circle class="arc" id="arc" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93"/><circle class="dot" cx="32" cy="32" r="4"/></svg>
    <div id="hlab">按住屏幕 · 删除 TA</div>
  </div>
  <div id="choice"><button class="del" data-c="del">删除</button><button data-c="keep">留着</button></div>
  <div id="end">
    <h1>你真的能<br>忘掉一个人吗？</h1>
    <div class="line"></div>
    <p>在评论区，留下那段<br>你删不掉的记忆。</p>
    <button id="replay">↻ 再删一次</button>
  </div>
  <div id="finger"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#c'), ctx = cv.getContext('2d');
const elTitle = $('#title'), elCap = $('#caption'), elLog = $('#log'), elList = $('#list');
const elProg = $('#prog'), elPnum = $('#pnum'), elHold = $('#hold'), elArc = $('#arc'), elHlab = $('#hlab');
const elHudL = $('#hudL'), elHud = $('#hud'), elFlash = $('#flash'), elChoice = $('#choice'), elEnd = $('#end'), elFinger = $('#finger');

const DEMO = /demo/.test(location.search);
const SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
const TOTAL = 12804;
const ARC = 175.93;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ───────── 内容 ───────── */
const FRAGS = [
  '凌晨两点的语音，“再聊五分钟”', '便利店最后一份关东煮', '雨里那把偏向我的伞',
  '地铁二号线，第三节车厢', '你给我备注的名字', '那首歌的前奏',
  '你外套上洗衣液的味道', '说好要去的那片海', '“到家了告诉我”',
  '你笑之前，会先眯一下眼', '没有发出去的那条消息', '最后一次见面，你没有回头',
  '冬天，你把手塞进我口袋', '第 1,314 条聊天记录', '那家已经关门的面馆',
  '你说你讨厌香菜', '晚安的三种写法', '电影散场后的路灯',
  '你送的那支没电的表', '车站的风很大'
];
const LINKS = [
  '你现在爱喝的，是 TA 爱喝的冰美式',
  '你说晚安之前，总会停顿一下',
  '你终于不吃香菜了',
  '你听到那首歌，会下意识切走',
  '你变得温柔的语气'
];
const TRIGS = [
  { at: .30, back: .13, kind: 'song',  text: '街角，有人放了那首歌的前奏。' },
  { at: .58, back: .16, kind: 'scent', text: '擦肩而过的人，用着 TA 的香水。' },
  { at: .84, back: .19, kind: 'dream', text: '凌晨三点，你又梦见了 TA。' }
];

/* ───────── 状态 ───────── */
let W = 0, H = 0, DPR = 1, U = 3.9;
let particles = [], frags = [], embers = [], waves = [];
let targets = { ta: null, me: null };
let shape = 'free';          // free | ta | me | sky
let phase = 'intro';         // intro ready delete stall error choice delself keep ending end
let progress = 0, regress = 0, freeze = 0, holding = false, holdVis = 0, everHeld = false;
let glitch = 0, shake = 0, swirl = 0, stallT = 0, beatT = 0, corePulse = 0, t = 0;
let fired = [], releaseHinted = false, idleT = 0, fontsReady = false, runId = 0;
let demoHold = false, demoReleased = false;
let hudText = '';

/* ───────── 音频（WebAudio 实时合成） ───────── */
const A = {
  c: null,
  init() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.c = new AC(), now = c.currentTime;
    this.out = c.createGain(); this.out.gain.value = .85;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    this.out.connect(comp); comp.connect(c.destination);
    const conv = c.createConvolver(); conv.buffer = this.ir(3.8);
    this.rv = c.createGain(); this.rv.gain.value = .6; this.rv.connect(conv); conv.connect(this.out);
    // 低频氛围
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 3;
    this.dg = c.createGain(); this.dg.gain.value = 0; lp.connect(this.dg); this.dg.connect(this.out); this.dg.connect(this.rv);
    [55, 55.35, 82.41, 110.3].forEach((f, i) => {
      const o = c.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      const g = c.createGain(); g.gain.value = i < 2 ? .45 : .22; o.connect(g); g.connect(lp); o.start();
    });
    const lfo = c.createOscillator(); lfo.frequency.value = .07; const lg = c.createGain(); lg.gain.value = 110;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    this.lp = lp;
    this.dg.gain.linearRampToValueAtTime(.17, now + 4);
    // 删除时的噪声
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.nb = nb;
    const ns = c.createBufferSource(); ns.buffer = nb; ns.loop = true;
    this.bp = c.createBiquadFilter(); this.bp.type = 'bandpass'; this.bp.frequency.value = 300; this.bp.Q.value = .9;
    this.ng = c.createGain(); this.ng.gain.value = 0;
    ns.connect(this.bp); this.bp.connect(this.ng); this.ng.connect(this.out); this.ng.connect(this.rv); ns.start();
  },
  ir(sec) {
    const c = this.c, len = c.sampleRate * sec | 0, b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
    return b;
  },
  del(level, p) {
    if (!this.c) return; const n = this.c.currentTime;
    this.ng.gain.setTargetAtTime(level * (.04 + p * .13), n, .08);
    this.bp.frequency.setTargetAtTime(220 + p * 2400, n, .15);
  },
  drone(v, sec = 2) { if (!this.c) return; const n = this.c.currentTime; this.dg.gain.cancelScheduledValues(n); this.dg.gain.setTargetAtTime(v, n, sec / 3); },
  tone(f, when = 0, dur = 3, vol = .1, type = 'sine') {
    const c = this.c; if (!c) return; const t0 = c.currentTime + when;
    const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain();
    o.type = type; o.frequency.value = f; o2.frequency.value = f * 2.003; g2.gain.value = .16;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.out); g.connect(this.rv);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + .1); o2.stop(t0 + dur + .1);
  },
  beat(v = 1) {
    const c = this.c; if (!c) return;
    [0, .19].forEach((w, i) => {
      const t0 = c.currentTime + w, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(95, t0); o.frequency.exponentialRampToValueAtTime(36, t0 + .2);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.6 * v * (i ? .55 : 1), t0 + .008); g.gain.exponentialRampToValueAtTime(.001, t0 + .32);
      o.connect(g); g.connect(this.out); o.start(t0); o.stop(t0 + .4);
    });
  },
  noise(dur, vol, type, freq, when = 0) {
    const c = this.c; if (!c) return; const t0 = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.nb; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.out); g.connect(this.rv); s.start(t0, Math.random()); s.stop(t0 + dur + .05);
  },
  boom() {
    const c = this.c; if (!c) return; const t0 = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(72, t0); o.frequency.exponentialRampToValueAtTime(26, t0 + 1.8);
    g.gain.setValueAtTime(.85, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + 2.8);
    o.connect(g); g.connect(this.out); g.connect(this.rv); o.start(t0); o.stop(t0 + 3);
    this.noise(1.6, .35, 'lowpass', 260);
  },
  glitch() {
    const c = this.c; if (!c) return;
    for (let i = 0; i < 8; i++) {
      const t0 = c.currentTime + i * .034 + Math.random() * .02, o = c.createOscillator(), g = c.createGain();
      o.type = 'square'; o.frequency.value = rand(70, 1900);
      g.gain.setValueAtTime(.06, t0); g.gain.setValueAtTime(0, t0 + .025);
      o.connect(g); g.connect(this.out); o.start(t0); o.stop(t0 + .04);
    }
    this.noise(.28, .22, 'highpass', 1800);
  },
  motif(n = 8, when = 0, vol = .1) {
    const M = [[659.25, 0], [523.25, .44], [587.33, .88], [440, 1.32], [392, 2.1], [440, 2.54], [523.25, 2.98], [493.88, 3.5]];
    M.slice(0, n).forEach(([f, w]) => this.tone(f, when + w, 3.2, vol, 'triangle'));
  },
  chord(vol = .05) { [220, 261.63, 329.63, 440, 523.25].forEach((f, i) => this.tone(f, i * .07, 6, vol)); this.tone(55, 0, 7, .12); },
  shimmer() { [1318.5, 1568, 1975.5, 2637, 3136].forEach((f, i) => this.tone(f, i * .08, 2.4, .025)); }
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ───────── 文字（逐字模糊显影） ───────── */
const esc = c => c === ' ' ? '&nbsp;' : c.replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function say(el, text, cls = '', step = 55, d0 = 0) {
  el.className = 'tx ' + cls;
  let k = 0;
  el.innerHTML = text.split('\n').map(line =>
    '<span class="ln">' + [...line].map(ch => `<i style="animation-delay:${d0 + (k++) * step}ms">${esc(ch)}</i>`).join('') + '</span>'
  ).join('');
}
const hush = el => el.classList.add('out');
function logLine(kind, text) {
  const d = document.createElement('div');
  if (kind === 'r') d.className = 'r';
  d.innerHTML = `<b>${kind === 'r' ? '被唤醒' : '已删除'}</b>${esc2(text)}`;
  elLog.appendChild(d);
  while (elLog.children.length > 3) elLog.removeChild(elLog.firstChild);
}
const esc2 = s => s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
function setHud(s, alert) { if (s !== hudText) { elHudL.textContent = s; hudText = s; } elHud.classList.toggle('alert', !!alert); }
function flash(op = .55, color) {
  elFlash.style.background = color || 'var(--red)';
  elFlash.style.transition = 'none'; elFlash.style.opacity = op;
  requestAnimationFrame(() => requestAnimationFrame(() => { elFlash.style.transition = 'opacity 1.4s ease'; elFlash.style.opacity = 0; }));
}

/* 可取消的时间线 */
const W8 = s => { const id = runId; return new Promise((res, rej) => setTimeout(() => id === runId ? res() : rej('x'), s * 1000)); };

/* ───────── 画布与形状 ───────── */
const SPR = {};
function sprite(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
  const gr = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.22, `rgba(${r},${g},${b},.55)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);

    const y = y0 - b * 22;
    let al = (.16 + fr.z * .34) * (1 - b * .93) * fadeFrags * (phase === 'intro' ? Math.min(1, t / 2) : 1);
    ctx.font = `${fr.z > .7 ? 400 : 300} ${fs}px ${SERIF}`;
    if (b > 0 && b < 1) {
      const r = 243 + 12 * b, g = 233 - 120 * b, bl = 216 - 170 * b;
      ctx.fillStyle = `rgba(${r | 0},${g | 0},${bl | 0},${al})`;
      ctx.globalAlpha = 1; ctx.fillText(fr.text, x + rand(-1, 1) * b * 2, y);
    } else { ctx.globalAlpha = 1; ctx.fillStyle = `rgba(243,233,216,${al})`; ctx.fillText(fr.text, x, y); }
    if (fr.rev > 0) {
      const o = fr.rev * 5; ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,50,50,${fr.rev * .8})`; ctx.fillText(fr.text, x - o, y);
      ctx.fillStyle = `rgba(60,210,255,${fr.rev * .6})`; ctx.fillText(fr.text, x + o, y);
      ctx.fillStyle = `rgba(255,255,255,${fr.rev * .7})`; ctx.fillText(fr.text, x, y);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // 粒子
  ctx.globalCompositeOperation = 'lighter';
  const dimAll = live ? 1 : (shape === 'sky' ? .5 : .55);
  for (const p of particles) {
    let spr, a, sz;
    if (p.ash) { spr = SPR.ash; a = .26 * clamp(p.y / (H * .35), .12, 1); sz = p.s * 2.2; }
    else {
      spr = p.hue < .72 ? SPR.warm : SPR.amber; a = .62 * dimAll; sz = p.s * 3;
      if (phase === 'stall' && p.core) { spr = SPR.red; a = 1; sz *= 1.6 + corePulse * 2; }
    }
    ctx.globalAlpha = a; ctx.drawImage(spr, p.x - sz, p.y - sz, sz * 2, sz * 2);
    if (p.flash > 0) { const fs2 = sz * (1 + 2.5 * p.flash); ctx.globalAlpha = p.flash * .9; ctx.drawImage(SPR.red, p.x - fs2, p.y - fs2, fs2 * 2, fs2 * 2); }
  }
  for (const e of embers) { const s = e.s * 2.4; ctx.globalAlpha = e.life * .9; ctx.drawImage(SPR.ember, e.x - s, e.y - s, s * 2, s * 2); }
  ctx.globalAlpha = 1;
  for (const w of waves) { ctx.strokeStyle = `rgba(${w.col},${w.life * .5})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke(); }

  // 故障切片
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over';
  if (glitch > .03) {
    const n = 2 + (glitch * 7 | 0);
    for (let i = 0; i < n; i++) {
      const y = Math.random() * H, h = rand(3, 34) * glitch, dx = rand(-34, 34) * glitch;
      ctx.drawImage(cv, 0, y * DPR, cv.width, Math.max(1, h * DPR), dx, y, W, h);
    }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = glitch * .12; ctx.fillStyle = '#ff2a2a';
    ctx.fillRect(0, rand(0, H), W, rand(2, 60) * glitch); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // 胶片颗粒
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .05;
  ctx.save(); ctx.translate(rand(-90, 0), rand(-90, 0)); ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 90, H + 90); ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ───────── 启动 ───────── */
resize();
makeParticles();
makeFrags();
const fontWait = (document.fonts && document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load(`900 100px "Noto Serif SC"`, 'TA我'), document.fonts.load(`400 20px "Noto Serif SC"`, '你真的能忘掉一个人吗')]), new Promise(r => setTimeout(r, 1400))]).catch(() => {})
  : Promise.resolve();
fontWait.then(() => { fontsReady = true; buildTargets(false); if (phase !== 'end' && shape === 'free') applyTargets('ta', 1.3); });
intro().catch(() => {});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
